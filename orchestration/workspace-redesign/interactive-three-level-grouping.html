<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace grouping mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #171512;
      --panel: #1d1a16;
      --line-heavy: rgba(235, 226, 207, .11);
      --line-light: rgba(235, 226, 207, .06);
      --text-strong: #f4f1ea;
      --text-default: #dcd8cf;
      --text-muted: #aaa59b;
      --text-faint: #777269;
      --hover: rgba(235, 226, 207, .055);
      --selected: rgba(231, 167, 66, .11);
      --amber: #e7a742;
      --radius: 8px;
      --motion-fast: 130ms;
      --motion-base: 200ms;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Newsreader", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text-default);
      font: 400 14px/1.4 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    .mockup {
      min-height: 100vh;
      padding: 28px;
    }

    .workspace-panel {
      width: min(100%, 470px);
      min-height: calc(100vh - 56px);
      padding: 28px 28px 44px;
      background: var(--panel);
      border: 1px solid var(--line-light);
      border-radius: 12px;
    }

    .tree,
    .project-body,
    .worker-body,
    .stage-body {
      min-width: 0;
    }

    .project-group + .project-group {
      margin-top: 44px;
    }

    .group-control,
    .ticket-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: var(--radius);
      color: inherit;
      background: transparent;
      font: inherit;
      text-align: left;
    }

    .group-control {
      position: relative;
      cursor: pointer;
      transition: color var(--motion-fast) ease, background var(--motion-fast) ease;
    }

    .group-control:hover,
    .group-control:focus-visible {
      outline: 0;
      color: var(--text-strong);
    }

    .group-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-control {
      min-height: 42px;
      color: var(--text-strong);
    }

    .project-control .group-label {
      font: 500 40px/.92 var(--serif);
      letter-spacing: -.035em;
    }

    .worker-block {
      margin-top: 21px;
      padding: 16px 16px 18px;
      border: 1px solid var(--line-heavy);
      border-radius: 10px;
      background: transparent;
      transition: border-color var(--motion-fast) ease;
    }

    .worker-block:hover,
    .worker-block:focus-within {
      border-color: rgba(235, 226, 207, .18);
    }

    .worker-control {
      min-height: 31px;
      color: var(--text-muted);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .stage-group {
      padding-top: 20px;
    }

    .stage-group + .stage-group {
      margin-top: 19px;
      padding-top: 19px;
      border-top: 1px solid var(--line-light);
    }

    .stage-control {
      min-height: 29px;
      color: var(--text-muted);
    }

    .stage-control .group-label {
      font-size: 21px;
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .group-chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-left: auto;
      opacity: 0;
      transform: rotate(0deg);
      transition: opacity var(--motion-fast) ease, transform var(--motion-base) ease;
    }

    .group-chevron::before {
      display: block;
      width: 6px;
      height: 6px;
      margin: 4px 0 0 5px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      content: "";
      transform: rotate(45deg);
    }

    .group-control:hover .group-chevron,
    .group-control:focus-visible .group-chevron {
      opacity: .85;
    }

    .group-control[aria-expanded="false"] .group-chevron {
      transform: rotate(-90deg);
    }

    .worker-body,
    .stage-body,
    .project-body {
      display: grid;
      grid-template-rows: 1fr;
      overflow: hidden;
      transition: grid-template-rows var(--motion-base) ease, opacity var(--motion-fast) ease;
    }

    .is-collapsed > .project-body,
    .is-collapsed > .worker-body,
    .is-collapsed > .stage-body {
      grid-template-rows: 0fr;
      opacity: 0;
    }

    .project-body-inner,
    .worker-body-inner,
    .stage-body-inner {
      min-height: 0;
    }

    .ticket-row {
      min-height: 34px;
      gap: 9px;
      margin-top: 5px;
      padding: 6px 7px;
      color: var(--text-default);
      font-size: 14px;
      cursor: pointer;
      transition: color var(--motion-fast) ease, background var(--motion-fast) ease;
    }

    .ticket-row:hover,
    .ticket-row:focus-visible {
      outline: 0;
      color: var(--text-strong);
      background: var(--hover);
    }

    .ticket-row.is-selected {
      color: var(--text-strong);
      background: var(--selected);
    }

    .ticket-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .running-mark {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      margin-left: auto;
      border: 2px solid rgba(231, 167, 66, .28);
      border-top-color: var(--amber);
      border-right-color: var(--amber);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 560px) {
      .mockup { padding: 0; }
      .workspace-panel { width: 100%; min-height: 100vh; border: 0; border-radius: 0; padding: 25px 20px 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="mockup">
    <section class="workspace-panel" aria-label="Workspace ticket tree">
      <div id="tree" class="tree"></div>
    </section>
  </main>

  <script>
    const projects = [
      {
        id: "panels",
        name: "Panels",
        workers: [
          {
            id: "coding",
            name: "Coding worker",
            stages: [
              {
                id: "build",
                name: "Build",
                tickets: [
                  { id: "t-runtime", title: "Deepen employee runtime ownership", running: true },
                  { id: "t-workspace", title: "Implement workspace grouping", running: false }
                ]
              },
              {
                id: "review",
                name: "Review",
                tickets: [
                  { id: "t-return", title: "Return-for-revision on review surface", running: false }
                ]
              }
            ]
          },
          {
            id: "research",
            name: "Research worker",
            stages: [
              {
                id: "research",
                name: "Research",
                tickets: [
                  { id: "t-handoff", title: "Research worker hand-off behavior", running: true }
                ]
              }
            ]
          }
        ]
      },
      {
        id: "vylo",
        name: "Vylo",
        workers: [
          {
            id: "coding",
            name: "Coding worker",
            stages: [
              {
                id: "plan",
                name: "Plan",
                tickets: [
                  { id: "t-waitlist-plan", title: "Draft the waitlist implementation plan", running: false }
                ]
              },
              {
                id: "build",
                name: "Build",
                tickets: [
                  { id: "t-waitlist-build", title: "Build the waitlist capture flow", running: true }
                ]
              }
            ]
          },
          {
            id: "research",
            name: "Research worker",
            stages: [
              {
                id: "research",
                name: "Research",
                tickets: [
                  { id: "t-consent", title: "Research consent requirements", running: false }
                ]
              },
              {
                id: "review",
                name: "Review",
                tickets: [
                  { id: "t-copy", title: "Review double opt-in copy", running: false }
                ]
              }
            ]
          }
        ]
      }
    ];

    const collapsed = new Set();
    let selectedTicketId = "t-runtime";
    const tree = document.querySelector("#tree");

    function groupKey(kind, path) {
      return `${kind}:${path.join("/")}`;
    }

    function button(kind, key, label, extraClass) {
      const expanded = !collapsed.has(key);
      return `
        <button class="group-control ${extraClass}" type="button" data-group-key="${key}" aria-expanded="${expanded}">
          <span class="group-label">${label}</span>
          <span class="group-chevron" aria-hidden="true"></span>
        </button>`;
    }

    function ticket(ticket) {
      return `
        <button class="ticket-row${ticket.id === selectedTicketId ? " is-selected" : ""}" type="button" data-ticket-id="${ticket.id}">
          <span class="ticket-title">${ticket.title}</span>
          ${ticket.running ? '<span class="running-mark" aria-label="Running"></span>' : ""}
        </button>`;
    }

    function stageGroup(stage, project, worker) {
      const key = groupKey("stage", [project.id, worker.id, stage.id]);
      const isCollapsed = collapsed.has(key);
      return `
        <section class="stage-group${isCollapsed ? " is-collapsed" : ""}">
          ${button("stage", key, stage.name, "stage-control")}
          <div class="stage-body">
            <div class="stage-body-inner">${stage.tickets.map(ticket).join("")}</div>
          </div>
        </section>`;
    }

    function workerGroup(worker, project) {
      const key = groupKey("worker", [project.id, worker.id]);
      const isCollapsed = collapsed.has(key);
      return `
        <section class="worker-block${isCollapsed ? " is-collapsed" : ""}">
          ${button("worker", key, worker.name, "worker-control")}
          <div class="worker-body">
            <div class="worker-body-inner">${worker.stages.map((stage) => stageGroup(stage, project, worker)).join("")}</div>
          </div>
        </section>`;
    }

    function projectGroup(project) {
      const key = groupKey("project", [project.id]);
      const isCollapsed = collapsed.has(key);
      return `
        <section class="project-group${isCollapsed ? " is-collapsed" : ""}">
          ${button("project", key, project.name, "project-control")}
          <div class="project-body">
            <div class="project-body-inner">${project.workers.map((worker) => workerGroup(worker, project)).join("")}</div>
          </div>
        </section>`;
    }

    function render() {
      tree.innerHTML = projects.map(projectGroup).join("");
    }

    tree.addEventListener("click", (event) => {
      const group = event.target.closest("[data-group-key]");
      const ticketRow = event.target.closest("[data-ticket-id]");
      if (group) {
        const { groupKey } = group.dataset;
        if (collapsed.has(groupKey)) collapsed.delete(groupKey);
        else collapsed.add(groupKey);
        render();
        return;
      }
      if (ticketRow) {
        selectedTicketId = ticketRow.dataset.ticketId;
        render();
      }
    });

    render();
  </script>
</body>
</html>
