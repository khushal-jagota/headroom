<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Empty State - Quiet Horizon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181715;
      --chrome: #141311;
      --ink: #efeade;
      --muted: #aaa397;
      --faint: #716a5f;
      --line: rgba(239,234,222,.11);
      --amber: #d49b45;
      --green: #7fa564;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
    .shell { min-height: 100vh; display: grid; grid-template-rows: 48px 1fr; }
    nav { display: flex; align-items: center; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--chrome); color: var(--faint); font-size: 13px; }
    nav strong, nav span:nth-child(4) { color: var(--ink); }
    nav strong { font-size: 14px; }
    main {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: radial-gradient(circle at 50% 54%, rgba(212,155,69,.07), transparent 35%);
    }
    .empty { width: min(440px, 100%); text-align: center; }
    .horizon { height: 108px; margin-bottom: 25px; position: relative; overflow: hidden; }
    .horizon::before {
      content: "";
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(239,234,222,.2), rgba(212,155,69,.58), rgba(239,234,222,.2), transparent);
    }
    .horizon::after {
      content: "";
      position: absolute;
      left: 24%;
      right: 24%;
      bottom: -55px;
      height: 112px;
      border-radius: 50% 50% 0 0;
      border-top: 1px solid rgba(212,155,69,.27);
    }
    .tick { position: absolute; bottom: 27px; width: 1px; height: 7px; background: rgba(239,234,222,.14); }
    .t1 { left: 25%; } .t2 { left: 50%; background: rgba(212,155,69,.52); } .t3 { right: 25%; }
    h1 { margin: 0; font-size: 24px; line-height: 1.18; font-weight: 650; letter-spacing: 0; }
    p { margin: 12px auto 0; max-width: 330px; color: var(--muted); font-size: 14px; line-height: 1.58; }
    .meta { margin: 26px auto 0; width: fit-content; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
    .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--green); box-shadow: 0 0 18px rgba(127,165,100,.42); }
  </style>
</head>
<body>
  <div class="shell">
    <nav><strong>Panels</strong><span>Today</span><span>Board</span><span>Review</span><span>Sprints</span><span>Backlog</span></nav>
    <main>
      <section class="empty" aria-label="Review queue empty">
        <div class="horizon" aria-hidden="true"><span class="tick t1"></span><span class="tick t2"></span><span class="tick t3"></span></div>
        <h1>Waiting for the next proposal</h1>
        <p>There is nothing to approve right now.</p>
        <div class="meta"><span class="dot"></span><span>3 agents in progress</span></div>
      </section>
    </main>
  </div>
</body>
</html>
