<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Empty State - System Pulse</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #191817;
      --chrome: #151412;
      --ink: #eee9df;
      --muted: #a9a398;
      --faint: #716c62;
      --line: rgba(238, 233, 223, 0.11);
      --amber: #d49b45;
      --green: #7fa564;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
    .shell { min-height: 100vh; display: grid; grid-template-rows: 48px 1fr; }
    nav { display: flex; align-items: center; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--chrome); color: var(--faint); font-size: 13px; }
    nav strong { color: var(--ink); font-size: 14px; }
    nav span:nth-child(4) { color: var(--ink); }
    main {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background:
        linear-gradient(rgba(238,233,223,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(238,233,223,.022) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .empty { width: min(420px, 100%); text-align: center; }
    .pulse { height: 66px; position: relative; margin-bottom: 28px; }
    .pulse::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,155,69,.2), rgba(212,155,69,.78), rgba(212,155,69,.2), transparent);
    }
    .pulse::after {
      content: "";
      position: absolute;
      left: calc(50% - 4px);
      top: 28px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--amber);
      box-shadow: 0 0 0 12px rgba(212,155,69,.08), 0 0 42px rgba(212,155,69,.42);
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.18; font-weight: 650; letter-spacing: 0; }
    p { margin: 12px auto 0; max-width: 330px; color: var(--muted); font-size: 14px; line-height: 1.58; }
    .meta { margin: 26px auto 0; width: fit-content; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
    .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--green); box-shadow: 0 0 18px rgba(127,165,100,.42); }
  </style>
</head>
<body>
  <div class="shell">
    <nav><strong>Panels</strong><span>Today</span><span>Board</span><span>Review</span><span>Sprints</span><span>Backlog</span></nav>
    <main>
      <section class="empty" aria-label="Review queue empty">
        <div class="pulse" aria-hidden="true"></div>
        <h1>Nothing needs review</h1>
        <p>New proposals will appear here as agents finish their current work.</p>
        <div class="meta"><span class="dot"></span><span>3 agents running</span></div>
      </section>
    </main>
  </div>
</body>
</html>
