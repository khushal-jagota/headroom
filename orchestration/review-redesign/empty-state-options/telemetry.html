<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Empty State - Agent Telemetry</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181817;
      --chrome: #141412;
      --ink: #eee9df;
      --muted: #aaa59a;
      --faint: #706b61;
      --line: rgba(238,233,223,.12);
      --amber: #d49b45;
      --green: #7fa564;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
    .shell { min-height: 100vh; display: grid; grid-template-rows: 48px 1fr; }
    nav { display: flex; align-items: center; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--chrome); color: var(--faint); font-size: 13px; }
    nav strong, nav span:nth-child(4) { color: var(--ink); }
    nav strong { font-size: 14px; }
    main { display: grid; place-items: center; padding: 48px 24px; }
    .empty { width: min(430px, 100%); text-align: center; }
    .telemetry {
      width: 126px;
      height: 126px;
      margin: 0 auto 28px;
      border: 1px solid rgba(238,233,223,.13);
      border-radius: 999px;
      position: relative;
      background:
        radial-gradient(circle, rgba(238,233,223,.075) 0 2px, transparent 3px) 0 0 / 21px 21px,
        radial-gradient(circle, rgba(212,155,69,.08), transparent 62%);
    }
    .telemetry::before,
    .telemetry::after {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 999px;
      border: 1px solid rgba(238,233,223,.09);
    }
    .telemetry::after { inset: 45px; border-color: rgba(212,155,69,.22); }
    .node { position: absolute; width: 8px; height: 8px; border-radius: 99px; background: var(--amber); box-shadow: 0 0 21px rgba(212,155,69,.34); }
    .n1 { top: 11px; left: 59px; }
    .n2 { top: 57px; right: 10px; background: var(--green); box-shadow: 0 0 21px rgba(127,165,100,.34); }
    .n3 { left: 31px; bottom: 16px; background: #a8a196; box-shadow: none; }
    h1 { margin: 0; font-size: 24px; line-height: 1.18; font-weight: 650; letter-spacing: 0; }
    p { margin: 12px auto 0; max-width: 340px; color: var(--muted); font-size: 14px; line-height: 1.58; }
    .status { margin: 28px auto 0; display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: 18px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
    .status strong { display: block; color: var(--ink); font-size: 15px; font-weight: 650; }
  </style>
</head>
<body>
  <div class="shell">
    <nav><strong>Panels</strong><span>Today</span><span>Board</span><span>Review</span><span>Sprints</span><span>Backlog</span></nav>
    <main>
      <section class="empty" aria-label="Review queue empty">
        <div class="telemetry" aria-hidden="true"><span class="node n1"></span><span class="node n2"></span><span class="node n3"></span></div>
        <h1>Review queue is clear</h1>
        <p>Agents are still working. This queue will update when something needs a decision.</p>
        <div class="status"><span><strong>3</strong>active</span><span><strong>0</strong>waiting</span><span><strong>0</strong>blocked</span></div>
      </section>
    </main>
  </div>
</body>
</html>
