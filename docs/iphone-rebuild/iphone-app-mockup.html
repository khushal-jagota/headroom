<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panels iPhone — Review Queue &amp; Workspace Prototype</title>
<style>
  /* ==========================================================================
     Panels Design Tokens (assets/tokens.css + Native iOS HIG)
     ========================================================================== */
  :root {
    --surface-canvas: #080809;
    --surface-recessed: #0e0e0e;
    --surface-1: #121212;
    --surface-2: #1a1a1a;
    --surface-rail: #1b1b1b;
    --surface-raised: #242424;
    --surface-hover: #272727;
    --surface-input: #2a2a2a;
    --surface-input-hover: #303030;
    --surface-selected: #353535;
    --surface-ink: #111318;
    --page-card-fill: rgba(255, 255, 255, 0.045); /* #1c1c1c over #121212: one step lighter! */

    --border-subtle: rgba(255, 255, 255, 0.07);
    --border-raised: rgba(255, 255, 255, 0.11);
    --border-hairline: rgba(255, 255, 255, 0.085);
    --scrim: rgba(10, 9, 8, 0.62);

    --tone-strong: #ececec;
    --tone-primary: #dadada;
    --tone-secondary: #a7a7a7;
    --tone-tertiary: #8c8c8c;
    --tone-faint: #626262;

    --accent-bright: #9aadd2;
    --accent-surface: #222a38;
    --accent-text: #dce6f8;
    --accent-badge: rgba(154, 173, 210, 0.16);
    --accent-done: #7fa564;
    --accent-error: #c97c77;
    --error-surface: #382226;
    --accent-attention: #d4ab6c;
    --accent-needs-me: #ffffff;
    --link-artifact: #a9bde6;

    --machine-jade: #83b7a7;
    --machine-cyan: #6fc9d0;
    --machine-orchid: #bd99bf;

    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

    --motion-fast: 90ms;
    --motion-base: 150ms;
    --motion-slow: 240ms;
    --motion-ease: cubic-bezier(0.2, 0.7, 0.3, 1);
    --motion-ease-exit: cubic-bezier(0.4, 0, 1, 1);
    --motion-move: cubic-bezier(0.45, 0, 0.55, 1);

    --dt: 1;
    --phone-w: 393px;
    --phone-h: 852px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
  }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 99px; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--surface-canvas); color: var(--tone-primary);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  button { border: none; background: none; padding: 0; cursor: pointer; }

  /* ==========================================================================
     Outer Workbench Shell
     ========================================================================== */
  .workbench { display: flex; flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden; }
  .wb-topbar {
    height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 20px; background: #0d0d0f; border-bottom: 1px solid var(--border-subtle); z-index: 20;
  }
  .wb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .wb-brand-mark {
    width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2);
    border: 1px solid var(--border-raised); display: grid; place-items: center; color: var(--accent-bright); flex-shrink: 0;
  }
  .wb-brand-title { font-size: 13.5px; font-weight: 600; color: var(--tone-strong); white-space: nowrap; }
  .wb-brand-sub { font-size: 12px; color: var(--tone-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .wb-controls { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .wb-controls::-webkit-scrollbar { display: none; }
  .wb-group { display: inline-flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 2px; gap: 2px; }
  .wb-pill {
    font-size: 12px; font-weight: 500; color: var(--tone-secondary); padding: 4px 9px;
    border-radius: 6px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
    transition: background var(--motion-fast) ease, color var(--motion-fast) ease;
  }
  .wb-pill:hover { color: var(--tone-strong); background: rgba(255,255,255,0.04); }
  .wb-pill.active { background: var(--surface-input); color: var(--tone-strong); }
  .wb-pill.active.warn { background: #362a18; color: var(--accent-attention); }
  .wb-pill.active.err { background: var(--error-surface); color: var(--accent-error); }
  .wb-pill.active.accent { background: var(--accent-surface); color: var(--accent-text); }
  .wb-dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }

  .wb-reset-btn {
    font-size: 12px; font-weight: 500; color: var(--tone-secondary); background: var(--surface-2);
    border: 1px solid var(--border-subtle); border-radius: 8px; padding: 5px 10px; white-space: nowrap;
  }
  .wb-reset-btn:hover { background: var(--surface-input); color: var(--tone-strong); }

  .wb-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(430px, 480px) minmax(0, 1fr); overflow: hidden; }

  /* ==========================================================================
     Left Stage: iPhone 16 Pro Hardware Frame
     ========================================================================== */
  .phone-stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px;
    background: radial-gradient(circle at 50% 30%, rgba(154, 173, 210, 0.035), transparent 60%), var(--surface-canvas);
    border-right: 1px solid var(--border-subtle); overflow: hidden; position: relative;
  }
  .phone-scaler { transform-origin: center center; will-change: transform; }

  .iphone-bezel {
    width: calc(var(--phone-w) + 22px); height: calc(var(--phone-h) + 22px);
    padding: 11px; border-radius: 56px;
    background: linear-gradient(145deg, #27272c 0%, #161619 52%, #222227 100%);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.12), inset 0 0 0 1.5px rgba(255, 255, 255, 0.06);
    position: relative;
  }
  .iphone-bezel::before {
    content: ""; position: absolute; left: -3px; top: 170px; width: 3px; height: 52px;
    border-radius: 2px 0 0 2px; background: #2b2b31; box-shadow: 0 64px 0 #2b2b31, 0 -42px 0 #2b2b31;
  }
  .iphone-bezel::after {
    content: ""; position: absolute; right: -3px; top: 204px; width: 3px; height: 82px;
    border-radius: 0 2px 2px 0; background: #2b2b31;
  }

  .iphone-screen {
    width: var(--phone-w); height: var(--phone-h); border-radius: 46px;
    background: var(--surface-1); overflow: hidden; position: relative;
    display: flex; flex-direction: column; color: var(--tone-primary);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05); user-select: none;
  }

  /* Status Bar & Dynamic Island */
  .ios-statusbar {
    height: 54px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 10px 28px; position: relative; z-index: 60; pointer-events: none;
  }
  .ios-island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; border-radius: 20px; background: #000;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: flex-end; padding-right: 11px;
  }
  .ios-island-lens { width: 11px; height: 11px; border-radius: 99px; background: radial-gradient(circle at 38% 38%, #1d2a44 0%, #090c14 60%, #000 100%); }
  .ios-time { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; color: var(--tone-strong); font-variant-numeric: tabular-nums; }
  .ios-status-icons { display: flex; align-items: center; gap: 6px; color: var(--tone-strong); font-size: 12px; font-weight: 600; }

  .ios-net-banner {
    flex-shrink: 0; display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 18px; font-size: calc(12px * var(--dt)); font-weight: 500;
    background: var(--surface-2); border-bottom: 1px solid var(--border-subtle); color: var(--tone-secondary); z-index: 50;
  }
  .ios-net-banner.visible { display: flex; }
  .ios-net-banner.offline { background: #1e1a14; color: var(--accent-attention); border-bottom-color: rgba(212,171,108,0.18); }
  .ios-net-banner.slow { background: #181c24; color: var(--accent-bright); border-bottom-color: rgba(154,173,210,0.16); }
  .ios-net-banner.err { background: var(--error-surface); color: var(--accent-error); }

  /* Viewport & Single Navigation Stack */
  .ios-viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .ios-stack-layer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface-1); overflow: hidden; }

  .ios-pushed-layer {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--surface-1); z-index: 30;
    box-shadow: -12px 0 32px rgba(0, 0, 0, 0.55);
    animation: iosPushIn var(--motion-slow) var(--motion-ease) both;
  }
  .ios-pushed-layer.popping { animation: iosPopOut var(--motion-base) var(--motion-ease-exit) both; }
  @keyframes iosPushIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes iosPopOut { from { transform: translateX(0); } to { transform: translateX(100%); } }

  /* Native Pinned iOS Navigation Bar */
  .ios-navbar {
    min-height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 2px 14px 4px 12px;
    background: rgba(18, 18, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle); z-index: 10;
  }
  .ios-navbar.borderless { border-bottom-color: transparent; background: var(--surface-1); }

  .ios-nav-back {
    min-height: 36px; padding: 0 8px 0 2px;
    display: inline-flex; align-items: center; gap: 3px;
    color: var(--accent-bright); font-size: calc(15px * var(--dt)); font-weight: 500; flex-shrink: 0;
  }
  .ios-nav-back:active { opacity: 0.6; }

  .ios-nav-title {
    font-size: calc(15px * var(--dt)); font-weight: 600; color: var(--tone-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; flex: 1; min-width: 0;
  }
  .ios-nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* Native iOS Navigation Bar Buttons (pill/rounded native feel!) */
  .ios-bar-btn {
    min-height: 34px; padding: 0 12px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border-subtle);
    font-size: calc(13.5px * var(--dt)); font-weight: 500; color: var(--tone-primary);
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: background var(--motion-fast) ease, color var(--motion-fast) ease;
  }
  .ios-bar-btn:hover { background: var(--surface-input); color: var(--tone-strong); }
  .ios-bar-btn:active { background: var(--surface-selected); }
  .ios-bar-btn.icon-only { width: 36px; height: 36px; padding: 0; }

  .ios-count-pill {
    font-size: calc(11.5px * var(--dt)); font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 2px 7px; border-radius: 999px; background: var(--accent-badge); color: var(--accent-text);
  }

  .ios-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .ios-scroll::-webkit-scrollbar { display: none; }

  .ios-home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.24);
    z-index: 90; pointer-events: none;
  }

  /* ==========================================================================
     Slide-Over Sidebar (Real Panels Rail Cards — Chief + Managers, Stripped of Tickets!)
     ========================================================================== */
  .sidebar-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 55; animation: fadeIn 180ms ease both; }
  .sidebar-scrim.closing { animation: fadeOut 150ms ease both; }

  .sidebar-drawer {
    position: absolute; top: 0; bottom: 0; left: 0; width: 85%;
    background: var(--surface-1); border-right: 1px solid var(--border-raised);
    z-index: 58; display: flex; flex-direction: column;
    padding: 58px 10px 24px;
    box-shadow: 18px 0 42px rgba(0, 0, 0, 0.65);
    animation: sidebarIn 220ms var(--motion-ease) both;
  }
  .sidebar-drawer.closing { animation: sidebarOut 150ms var(--motion-ease-exit) both; }
  @keyframes sidebarIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  @keyframes sidebarOut { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; padding-bottom: 8px; }
  .sb-scroll::-webkit-scrollbar { display: none; }

  /* Real Panels Rail Manager Card Bubble (Chief IS just the first Manager card!) */
  .rail-mgr-card {
    width: 100%; text-align: left; flex-shrink: 0;
    background: var(--surface-rail);
    border-radius: 12px;
    padding: 11px 14px 13px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 3px;
    transition: background var(--motion-fast) ease;
  }
  .rail-mgr-card:active { background: var(--surface-hover); }
  .rail-mgr-card.selected { background: var(--surface-rail); }

  /* Real Goal Status Haze Gradients from WorkspaceRailCard.svelte! */
  .rail-mgr-card.goal-bad::before,
  .rail-mgr-card.goal-attention::before,
  .rail-mgr-card.goal-good::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 56px; pointer-events: none;
  }
  .rail-mgr-card.goal-bad::before { background: linear-gradient(180deg, rgba(201, 124, 119, 0.11), transparent); }
  .rail-mgr-card.goal-attention::before { background: linear-gradient(180deg, rgba(212, 171, 108, 0.11), transparent); }
  .rail-mgr-card.goal-good::before { background: linear-gradient(180deg, rgba(127, 165, 100, 0.09), transparent); }
  .rail-mgr-card.selected::before { opacity: 0; }

  .rail-mgr-eyebrow {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: calc(12px * var(--dt)); font-weight: 500; line-height: 16px;
  }
  .rail-mgr-proj { color: var(--tone-tertiary); }
  .rail-goal-tag { font-size: calc(11.5px * var(--dt)); font-weight: 500; }
  .rail-goal-tag.good { color: var(--accent-done); }
  .rail-goal-tag.attention { color: var(--accent-attention); }
  .rail-goal-tag.bad { color: var(--accent-error); }

  .rail-mgr-head {
    position: relative; z-index: 1;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .rail-mgr-title {
    font-size: calc(16px * var(--dt)); font-weight: 600; line-height: 1.3;
    letter-spacing: -0.014em; color: #c8c8c8; flex: 1; min-width: 0;
  }
  .rail-mgr-card.unread .rail-mgr-title,
  .rail-mgr-card.selected .rail-mgr-title { color: var(--tone-strong); }

  /* Sidebar Settled Bubble + Bottom Utility Row (Review left with badge, Settings icon right!) */
  .sb-dock {
    flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
    padding-top: 8px; border-top: 1px solid var(--border-subtle);
  }

  .sb-settled-box {
    background: var(--surface-rail); border-radius: 12px; overflow: hidden;
  }
  .sb-settled-head {
    width: 100%; min-height: 40px; padding: 0 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: calc(13.5px * var(--dt)); font-weight: 500; color: var(--tone-secondary);
  }
  .sb-settled-row {
    padding: 8px 14px; border-top: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 13px; color: var(--tone-tertiary);
  }

  .sb-bottom-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 2px 2px 0;
  }
  .sb-review-btn {
    min-height: 42px; padding: 0 13px; border-radius: 11px;
    display: inline-flex; align-items: center; gap: 9px;
    font-size: calc(14.5px * var(--dt)); font-weight: 600; color: var(--tone-primary);
    background: transparent;
  }
  .sb-review-btn:hover { background: rgba(255,255,255,0.05); }
  .sb-review-btn.active { background: var(--surface-rail); color: var(--tone-strong); }

  .sb-settings-btn {
    width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center; color: var(--tone-secondary); position: relative;
  }
  .sb-settings-btn:hover { background: rgba(255,255,255,0.05); color: var(--tone-strong); }
  .sb-settings-btn.active { background: var(--surface-rail); color: var(--tone-strong); }

  /* ==========================================================================
     Review Directional Deck (Step-Lighter Proposal & Message Cards, Full-Width Decisions!)
     ========================================================================== */
  .deck-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }

  .deck-card-shell {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--surface-1); will-change: transform, opacity;
  }
  .deck-card-shell.enter-from-right { animation: deckEnterRight var(--motion-slow) var(--motion-ease) 60ms both; }
  .deck-card-shell.enter-from-left { animation: deckEnterLeft var(--motion-slow) var(--motion-ease) 60ms both; }
  .deck-card-shell.exit-left { pointer-events: none; animation: deckExitLeft var(--motion-base) var(--motion-ease-exit) both; }
  .deck-card-shell.exit-right { pointer-events: none; animation: deckExitRight var(--motion-base) var(--motion-ease-exit) both; }
  @keyframes deckEnterRight { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes deckEnterLeft { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes deckExitLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-36px); } }
  @keyframes deckExitRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(36px); } }

  .deck-part {
    transition: opacity var(--motion-base) var(--motion-ease-exit),
                transform var(--motion-base) var(--motion-ease-exit),
                max-height var(--motion-slow) var(--motion-move),
                margin var(--motion-slow) var(--motion-move),
                padding var(--motion-slow) var(--motion-move);
    overflow: hidden;
  }
  .deck-part.part-leaving {
    opacity: 0; transform: translateX(-32px); max-height: 0 !important;
    margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; pointer-events: none;
  }

  .review-pad { padding: 10px 18px 28px; }

  .review-title {
    font-size: calc(23px * var(--dt)); font-weight: 600; line-height: 1.24;
    letter-spacing: -0.016em; color: var(--tone-strong); margin: 0 0 8px;
  }
  .review-recap {
    font-size: calc(14px * var(--dt)); color: var(--tone-secondary); line-height: 1.5; margin: 0 0 18px;
  }

  /* Proposal Card: ONE STEP LIGHTER than #121212 (exact --page-card-fill from WorkerProposalCard.svelte!) */
  .proposal-card {
    background: var(--page-card-fill);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .proposal-card-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: calc(13px * var(--dt)); font-weight: 500; margin-bottom: 12px;
  }
  .proposal-stage-txt { color: var(--tone-secondary); font-weight: 600; }
  .proposal-approver-btn {
    color: var(--tone-secondary); font-size: calc(13px * var(--dt)); font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 7px;
    background: rgba(255, 255, 255, 0.05);
  }
  .proposal-approver-btn:hover { background: rgba(255, 255, 255, 0.09); color: var(--tone-strong); }

  /* Review Message Card (exact --surface-2 #1a1a1a, one step lighter — used both standalone & in mixed Ticket cards!) */
  .review-message-card {
    background: var(--surface-2);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg-piece-sep { width: 32px; height: 1px; background: rgba(255, 255, 255, 0.14); margin: 14px 0; }

  .prose { font-size: calc(14.5px * var(--dt)); line-height: 1.58; color: var(--tone-primary); user-select: text; }
  .prose p { margin: 0 0 11px; }
  .prose p:last-child { margin-bottom: 0; }
  .prose p.lead { font-size: calc(15px * var(--dt)); font-weight: 500; color: var(--tone-strong); }
  .prose ul { margin: 8px 0 11px; padding-left: 18px; }
  .prose li { margin-bottom: 4px; }
  .prose strong { color: var(--tone-strong); font-weight: 600; }
  .prose code { font-family: var(--font-mono); font-size: 0.86em; background: rgba(255, 255, 255, 0.06); padding: 1px 5px; border-radius: 4px; color: var(--tone-strong); }

  .artifact-link {
    display: inline; color: var(--link-artifact); font-weight: 500;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(169, 189, 230, 0.45);
    cursor: pointer;
  }
  .artifact-link:active { opacity: 0.65; }

  /* Inline Alerts */
  .inline-alert {
    border-radius: 11px; padding: 11px 13px; margin-bottom: 14px;
    font-size: calc(13px * var(--dt)); line-height: 1.46; display: flex; flex-direction: column; gap: 7px;
  }
  .inline-alert.refused { background: var(--error-surface); border: 1px solid rgba(201, 124, 119, 0.28); color: #f0c9c6; }
  .inline-alert.uncertain { background: #282115; border: 1px solid rgba(212, 171, 108, 0.28); color: #edd7b2; }
  .inline-alert.info { background: var(--accent-surface); border: 1px solid rgba(154, 173, 210, 0.22); color: var(--accent-text); }
  .inline-alert-title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .inline-alert-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

  /* ==========================================================================
     Floating Bottom Decision Dock (No Tab Bar Below -> Full-Width 50/50 Buttons!)
     ========================================================================== */
  .decision-dock {
    flex-shrink: 0; position: relative;
    background: var(--surface-1);
    padding: 8px 18px 26px;
    display: flex; flex-direction: column; gap: 10px; z-index: 15;
  }
  .decision-dock::before {
    content: ""; position: absolute; left: 0; right: 0; top: -22px; height: 22px;
    background: linear-gradient(to bottom, rgba(18, 18, 18, 0), var(--surface-1));
    pointer-events: none;
  }

  .note-box {
    background: var(--surface-input);
    border-radius: 12px;
    padding: 4px 6px 4px 10px;
    display: flex; flex-direction: column; gap: 5px;
    border: 1px solid transparent;
    transition: border-color var(--motion-fast) ease;
  }
  .note-box:focus-within { border-color: rgba(154, 173, 210, 0.6); }
  .note-input-row { display: flex; align-items: center; gap: 4px; }

  .note-textarea {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none; resize: none;
    overflow: hidden; scrollbar-width: none;
    font-size: calc(15px * var(--dt)); line-height: 1.38; color: var(--tone-strong);
    min-height: 24px; max-height: 88px; padding: 6px 2px;
  }
  .note-textarea::-webkit-scrollbar { display: none; }
  .note-textarea::placeholder { color: var(--tone-tertiary); }

  .composer-tool-btn {
    width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center; color: var(--tone-secondary); flex-shrink: 0;
  }
  .composer-tool-btn:hover { color: var(--tone-strong); background: rgba(255,255,255,0.06); }
  .composer-tool-btn.recording { background: var(--error-surface); color: var(--accent-error); }

  .composer-send-circle {
    width: 32px; height: 32px; border-radius: 99px;
    display: grid; place-items: center; background: var(--tone-strong); color: var(--surface-ink); flex-shrink: 0;
    transition: background var(--motion-fast) ease, color var(--motion-fast) ease, transform 80ms ease;
  }
  .composer-send-circle:active { transform: scale(0.94); }
  .composer-send-circle.empty { background: rgba(255, 255, 255, 0.11); color: var(--tone-tertiary); }

  /* Balanced Bottom Decision Rows: Equal-width buttons, just two visual button tiers (secondary & primary) */
  .decision-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .decision-btn-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .ios-btn {
    min-height: 46px; border-radius: 12px; padding: 0 12px;
    font-size: calc(14.5px * var(--dt)); font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform 80ms ease, background var(--motion-fast) ease, box-shadow var(--motion-fast) ease, color var(--motion-fast) ease;
  }
  .ios-btn:active { transform: scale(0.98); }
  .ios-btn.primary { background: var(--accent-bright); color: var(--surface-ink); }
  .ios-btn.primary:hover { background: #a8bae0; }
  .ios-btn.secondary { background: var(--surface-input); color: var(--tone-strong); }
  .ios-btn.secondary:hover { background: var(--surface-input-hover); }
  .ios-btn.subtle { background: transparent; color: var(--tone-secondary); min-height: 36px; font-weight: 500; }
  .ios-btn.flash-ring { box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 4px var(--accent-bright); }
  .ios-btn:disabled { opacity: 0.38; pointer-events: none; }

  .voice-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #1f1718; border-radius: 8px; padding: 5px 9px;
    font-size: calc(12.5px * var(--dt)); color: var(--tone-strong); margin: 2px 4px 0 0;
  }
  .voice-waves { display: inline-flex; align-items: center; gap: 2.5px; height: 14px; }
  .voice-bar { width: 2.5px; border-radius: 2px; background: var(--accent-error); animation: waveBounce 0.7s ease-in-out infinite alternate; }
  .voice-bar:nth-child(2) { animation-delay: 0.15s; }
  .voice-bar:nth-child(3) { animation-delay: 0.3s; }
  .voice-bar:nth-child(4) { animation-delay: 0.45s; }
  @keyframes waveBounce { from { height: 4px; } to { height: 13px; } }

  .att-strip { display: flex; gap: 6px; flex-wrap: wrap; padding: 3px 4px 0 0; }
  .att-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border-radius: 7px; padding: 3px 8px;
    font-size: calc(12px * var(--dt)); color: var(--tone-primary);
  }
  .att-chip.preparing { color: var(--accent-bright); }
  .att-remove { color: var(--tone-tertiary); font-size: 14px; line-height: 1; padding: 0 2px; }
  .nudge-text { font-size: calc(12px * var(--dt)); color: var(--accent-attention); }

  /* Answer Options */
  .answer-option {
    width: 100%; text-align: left; min-height: 48px; padding: 11px 13px;
    border-radius: 10px; background: var(--surface-2); border: 1px solid transparent;
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
  }
  .answer-option.selected { background: var(--accent-surface); border-color: rgba(154, 173, 210, 0.48); }
  .radio-circle {
    width: 17px; height: 17px; border-radius: 99px; border: 1.5px solid var(--tone-tertiary);
    margin-top: 2px; flex-shrink: 0; display: grid; place-items: center;
  }
  .answer-option.selected .radio-circle { border-color: var(--accent-bright); }
  .answer-option.selected .radio-circle::after { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--accent-bright); }

  /* End of Queue — Two-Tone Left Editorial */
  .final-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .final-stage {
    flex: 1; min-height: 0; position: relative; padding: 224px 20px 36px;
    display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;
    text-align: left;
  }
  .final-line1 {
    font-size: calc(31px * var(--dt)); font-weight: 700; letter-spacing: -0.03em; line-height: 1.12;
    color: var(--tone-strong); margin: 0; font-variant-numeric: tabular-nums;
  }
  .final-line2 {
    font-size: calc(31px * var(--dt)); font-weight: 600; letter-spacing: -0.03em; line-height: 1.12;
    color: #8a8a93; margin: 2px 0 0; font-variant-numeric: tabular-nums;
  }
  .final-cta {
    margin-top: 24px;
    min-height: 46px; border-radius: 12px; padding: 0 22px;
    background: #272727; color: #f0f0f2;
    border: none;
    font-size: calc(15.5px * var(--dt)); font-weight: 600; letter-spacing: -0.015em;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--motion-fast) ease, transform 80ms ease;
  }
  .final-cta:hover { background: #303030; }
  .final-cta:active { transform: scale(0.98); background: #333333; }
  .final-working {
    position: absolute; left: 20px; bottom: 12px;
    font-size: calc(13.5px * var(--dt)); font-weight: 400; color: #82828a;
    font-variant-numeric: tabular-nums;
  }

  /* ==========================================================================
     Artifact Vertical Layer (Web-Parity 3-Way Bottom Context Rule)
     ========================================================================== */
  .artifact-layer {
    position: absolute; inset: 0; background: var(--surface-1); z-index: 45;
    display: flex; flex-direction: column;
    animation: artifactRise var(--motion-slow) var(--motion-ease) both;
  }
  .artifact-layer.drop-out { animation: artifactDrop var(--motion-base) var(--motion-ease-exit) both; }
  .artifact-layer.exit-left { animation: deckExitLeft var(--motion-base) var(--motion-ease-exit) both; }
  @keyframes artifactRise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes artifactDrop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(26px); } }

  .segmented-mini { display: inline-flex; background: var(--surface-recessed); padding: 2px; border-radius: 8px; gap: 2px; }
  .segmented-mini button { font-size: calc(11.5px * var(--dt)); font-weight: 500; color: var(--tone-secondary); padding: 4px 9px; border-radius: 6px; }
  .segmented-mini button.active { background: var(--surface-input); color: var(--tone-strong); }

  /* Tables, Charts & Code */
  .gfm-table-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 12px 0;
    border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--surface-recessed);
  }
  .gfm-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: calc(12.5px * var(--dt)); font-variant-numeric: tabular-nums; }
  .gfm-table th, .gfm-table td { padding: 8px 11px; text-align: left; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
  .gfm-table th { color: var(--tone-tertiary); font-weight: 600; background: rgba(255, 255, 255, 0.025); }
  .gfm-table tr:last-child td { border-bottom: none; }
  .gfm-table td { color: var(--tone-primary); }

  .panels-chart-card {
    background: var(--surface-recessed); border: 1px solid var(--border-subtle);
    border-radius: 11px; padding: 12px; margin: 10px 0 2px;
  }
  .panels-chart-title { font-size: calc(12.5px * var(--dt)); font-weight: 600; color: var(--tone-strong); margin-bottom: 8px; }

  .code-block {
    background: var(--surface-recessed); border: 1px solid var(--border-subtle); border-radius: 10px;
    padding: 10px 12px; overflow-x: auto; margin: 10px 0;
    font-family: var(--font-mono); font-size: calc(12px * var(--dt)); line-height: 1.5; color: #d6dde8; white-space: pre;
  }

  /* ==========================================================================
     Existing iOS Worker Sections (WorkerSections.swift — Kept Intact, No Long-Press)
     ========================================================================== */
  .worker-sections { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .worker-disc-head {
    width: 100%; min-height: 44px; padding: 0 14px; border-radius: 10px;
    background: var(--surface-raised); color: var(--tone-secondary);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left;
    font-size: calc(13px * var(--dt)); font-weight: 600;
  }
  .worker-disc-head:active { background: var(--surface-input); }
  .worker-disc-count { font-size: calc(12.5px * var(--dt)); font-weight: 500; color: var(--tone-tertiary); font-variant-numeric: tabular-nums; }
  .worker-rows { display: flex; flex-direction: column; padding: 4px 0; }
  .worker-row {
    width: 100%; text-align: left; min-height: 44px; padding: 8px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 8px;
  }
  .worker-row:hover { background: rgba(255, 255, 255, 0.035); }
  .worker-row:active { background: rgba(255, 255, 255, 0.06); }
  .worker-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .worker-row-title { font-size: calc(14.5px * var(--dt)); font-weight: 500; color: var(--tone-strong); line-height: 1.35; }
  .worker-row-title.quiet { font-weight: 400; color: var(--tone-tertiary); }
  .worker-row-sub { font-size: calc(12px * var(--dt)); color: var(--tone-tertiary); font-variant-numeric: tabular-nums; }

  .mark-trail { width: 20px; height: 22px; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; }
  .mark-dot-accent { width: 8px; height: 8px; border-radius: 99px; background: var(--accent-bright); }
  .mark-dot-answer { width: 8px; height: 8px; border-radius: 99px; background: var(--accent-needs-me); box-shadow: 0 0 8px rgba(255, 255, 255, 0.45); }
  .mark-ring-assigned { width: 10px; height: 10px; border-radius: 99px; border: 2px solid var(--accent-bright); }
  .mark-ring-upcoming { width: 10px; height: 10px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,0.26); }
  .mark-done { width: 13px; height: 13px; border-radius: 99px; background: rgba(127, 165, 100, 0.2); color: var(--accent-done); display: grid; place-items: center; font-size: 9px; font-weight: 800; }
  .mark-spinner { width: 11px; height: 11px; border-radius: 99px; border: 1.8px solid rgba(154, 173, 210, 0.22); border-top-color: var(--tone-strong); animation: spin900 900ms linear infinite; }
  @keyframes spin900 { to { transform: rotate(360deg); } }

  /* Detail & Conversation Screens */
  .detail-pad { padding: 14px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
  .detail-pad > * { flex-shrink: 0; }
  .detail-card { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

  .disclosure-band { border-top: 1px solid var(--border-subtle); padding-top: 14px; }
  .disclosure-head { width: 100%; min-height: 36px; display: flex; align-items: center; justify-content: space-between; font-size: calc(13.5px * var(--dt)); font-weight: 600; color: var(--tone-strong); }
  .step-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
  .step-row:last-child { border-bottom: none; }

  .conv-preview-dock {
    flex-shrink: 0; position: relative; background: var(--surface-1);
    padding: 8px 18px 26px; display: flex; flex-direction: column; gap: 6px; z-index: 15;
  }
  .conv-preview-dock::before {
    content: ""; position: absolute; left: 0; right: 0; top: -20px; height: 20px;
    background: linear-gradient(to bottom, rgba(18,18,18,0), var(--surface-1)); pointer-events: none;
  }
  .conv-preview-line { font-size: calc(12px * var(--dt)); color: var(--tone-tertiary); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .chat-thread { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 15px; }
  .chat-human-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chat-human-bubble { max-width: 84%; background: var(--surface-2); color: var(--tone-strong); border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: calc(14.5px * var(--dt)); line-height: 1.48; }
  .chat-meta-tiny { font-size: 11px; color: var(--tone-tertiary); font-variant-numeric: tabular-nums; }
  .chat-agent-block { display: flex; flex-direction: column; gap: 6px; }
  .chat-tool-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--tone-tertiary); background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 7px; padding: 4px 8px; align-self: flex-start; }
  .chat-sys-note { font-size: calc(12px * var(--dt)); color: var(--tone-tertiary); border-left: 2px solid var(--accent-bright); padding: 4px 10px; background: rgba(154,173,210,0.06); border-radius: 0 7px 7px 0; }
  .held-stack { background: var(--surface-2); border-top: 1px solid var(--border-subtle); padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: calc(12px * var(--dt)); }

  /* Native SwiftUI Grouped Form Sheets (.sheet + NavigationStack + Form) */
  .ios-sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.56); z-index: 70; display: flex; align-items: flex-end; animation: fadeIn 150ms ease both; }
  .ios-sheet {
    width: 100%; max-height: 86%; background: #1c1c1e;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.55), inset 0 0.5px 0 rgba(255, 255, 255, 0.12);
    display: flex; flex-direction: column; overflow: hidden;
    animation: sheetRise 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes sheetRise { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-grabber { width: 36px; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.28); margin: 8px auto 0; flex-shrink: 0; }
  .ios-sheet-nav {
    height: 48px; flex-shrink: 0; padding: 0 16px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  }
  .ios-sheet-nav-title {
    font-size: calc(16.5px * var(--dt)); font-weight: 600; color: #ffffff;
    text-align: center; white-space: nowrap; letter-spacing: -0.015em;
  }
  .ios-sheet-nav-cancel {
    justify-self: start; font-size: calc(15.5px * var(--dt)); font-weight: 400;
    color: var(--accent-bright); padding: 6px 2px;
  }
  .ios-sheet-nav-cancel:active { opacity: 0.6; }
  .ios-sheet-nav-done {
    justify-self: end; font-size: calc(14.5px * var(--dt)); font-weight: 600;
    background: var(--accent-bright); color: var(--surface-ink);
    padding: 6px 14px; border-radius: 999px;
  }
  .ios-sheet-nav-done:active { opacity: 0.8; }
  .ios-sheet-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 34px;
    display: flex; flex-direction: column; gap: 22px; scrollbar-width: none;
  }
  .ios-sheet-body::-webkit-scrollbar { display: none; }

  .ios-form-section { display: flex; flex-direction: column; }
  .ios-form-header {
    font-size: calc(12px * var(--dt)); font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.03em; color: #8e8e93; padding: 0 14px 7px;
  }
  .ios-form-group { background: #2c2c2e; border-radius: 12px; overflow: hidden; }
  .ios-form-row {
    width: 100%; min-height: 46px; padding: 11px 16px; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: calc(15.5px * var(--dt)); color: #ffffff; position: relative;
    transition: background 80ms ease;
  }
  .ios-form-row:active { background: rgba(255, 255, 255, 0.08); }
  .ios-form-row + .ios-form-row::before {
    content: ""; position: absolute; left: 16px; right: 0; top: 0; height: 0.5px;
    background: rgba(255, 255, 255, 0.11);
  }
  .ios-form-row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ios-form-row-icon { width: 22px; height: 22px; display: grid; place-items: center; color: var(--accent-bright); flex-shrink: 0; }
  .ios-form-row.destructive { color: #ff6961; }
  .ios-form-row.destructive .ios-form-row-icon { color: #ff6961; }
  .ios-form-note { padding: 12px 16px; font-size: calc(14px * var(--dt)); line-height: 1.45; color: #d1d1d6; }

  .ios-segmented {
    background: #2c2c2e; border-radius: 10px; padding: 3px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
  }
  .ios-segmented button {
    min-height: 34px; border-radius: 7.5px; font-size: calc(14px * var(--dt)); font-weight: 500;
    color: #aeaeb2; transition: background 120ms ease, color 120ms ease;
  }
  .ios-segmented button.active {
    background: #545458; color: #ffffff; font-weight: 600;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.32);
  }

  /* Desktop-parity Artifact rows inside collapsed Artifacts disclosure band */
  .artifact-inline-row {
    width: 100%; min-height: 44px; padding: 9px 2px; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--border-subtle); font-size: calc(14px * var(--dt));
  }
  .artifact-inline-row:first-child { border-top: none; }
  .artifact-inline-row:active { opacity: 0.7; }

  .ios-toast {
    position: absolute; top: 62px; left: 16px; right: 16px; z-index: 80;
    background: rgba(34, 34, 38, 0.96); border: 1px solid var(--border-raised);
    border-radius: 12px; padding: 10px 13px; font-size: calc(12.5px * var(--dt)); color: var(--tone-strong);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    animation: toastIn 180ms var(--motion-ease) both;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .ios-gate-cover {
    position: absolute; inset: 0; background: var(--surface-1); z-index: 85;
    padding: 80px 26px 40px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 14px;
  }

  /* ==========================================================================
     Right Column: Data Flow, Edge States & Postmortem Inspector
     ========================================================================== */
  .inspector { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0c0c0e; overflow: hidden; }
  .insp-head { flex-shrink: 0; padding: 14px 22px 12px; border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 10px; }
  .insp-context-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .insp-screen-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--tone-strong); }
  .insp-screen-pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 5px; background: var(--accent-badge); color: var(--accent-text); }
  .insp-tabs { display: inline-flex; gap: 4px; background: var(--surface-1); padding: 3px; border-radius: 9px; border: 1px solid var(--border-subtle); align-self: flex-start; }
  .insp-tab { font-size: 12.5px; font-weight: 500; color: var(--tone-secondary); padding: 6px 12px; border-radius: 7px; }
  .insp-tab:hover { color: var(--tone-strong); }
  .insp-tab.active { background: var(--surface-input); color: var(--tone-strong); }

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function formatDuration(sec) { return `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s`; }

function renderMiniBarSvg(bars) {
  return bars.map(b => {
    const pct = Math.max(4, Math.round((b.value / (b.max || 100)) * 100));
    return `
      <div style="display:grid;grid-template-columns:82px 1fr 32px;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;">

  el.className = 'ios-toast';
  el.innerHTML = `<span>${escapeHtml(msg)}</span>${actionLabel ? `<button style="color:var(--accent-bright);font-weight:600;white-space:nowrap;" id="toastActBtn">${escapeHtml(actionLabel)}</button>` : ''}`;
  host.appendChild(el);
  if (actionLabel && actionFn) el.querySelector('#toastActBtn').onclick = () => { host.innerHTML = ''; actionFn(); };

}

function currentReviewItem() {
  if (state.finalLatched) return null;
  const active = activeQueueItems();
  if (!active.length) return null;
  const pinned = active.find(i => i.key === state.pinnedKey);

/* ============================================================================
   Workbench Conditions
   ============================================================================ */
function setCondition(cond) {
  const prev = state.condition;
  state.condition = cond;
  const carrier = document.getElementById('iosCarrierLabel');
  if (cond === 'live') {
    if (carrier) carrier.textContent = '5G';
    if (prev === 'offline' && state.outbox.length) drainOutbox();
    else logTrace('SSE', 'GET /api/navigation/view/events connected (projection_version=7)');
  } else if (cond === 'slow') {
    if (carrier) carrier.textContent = '3G';
    logTrace('SSE', 'Slow link active: POST /decision-operations times out → receipt check recovery');
  } else if (cond === 'offline') {
    if (carrier) carrier.textContent = 'No Signal';
    logTrace('OUTBOX', 'NWPathMonitor: offline. Cached queue stays usable; Outbox holds writes silently.');
  } else if (cond === 'conflict') {
    if (carrier) carrier.textContent = '5G';
    triggerReviewerConflict();
  } else if (cond === 'unavailable') {
    if (carrier) carrier.textContent = '5G';
    logTrace('ERR', 'GET /api/navigation/view/snapshot → 503 (fail closed)');
  }
  renderPhone(); renderInspector();
}

function triggerReviewerConflict() {
  let item = currentReviewItem();
  if (state.root.kind !== 'review' || state.stack.length || !item || item.kind !== 'ticket' || item.proposalDone) {
    state.root = { kind: 'review' }; state.stack = []; state.finalLatched = false; state.sidebarOpen = false;
    item = state.queue[0]; item.proposalDone = false;
    state.skippedKeys = state.skippedKeys.filter(k => k !== item.key);
    state.pinnedKey = item.key;
  }
  item.revision += 1; item.holder = 'Manager';
  item.refusal = { message: 'This proposal moved to Manager while it was open. Your note and attachments were kept.' };
  logTrace('SSE', `PATCH /api/tickets/${item.ticketId} bumped pending_proposal_revision → ${item.revision}`);
  logTrace('ERR', 'POST /decision-operations → HTTP 200 receipt.outcome="refused"');
}

function resetPrototype() {

function drainOutbox() {
  const count = state.outbox.length;

  state.outbox.forEach(r => logTrace('POST', `Drained ${r.lane}: ${r.summary} → applied`));
  state.outbox = [];
  showToast(`Synced ${count} queued item${count > 1 ? 's' : ''}`);
}

/* ============================================================================
   Review Deck & Decisions
   ============================================================================ */
function advanceDeck(direction, afterMutate) {
  const stage = document.querySelector('.deck-stage');
  const existing = stage ? stage.querySelector('.deck-card-shell') : null;
  if (existing) {
    existing.classList.remove('enter-from-right', 'enter-from-left');
    existing.classList.add(direction === 1 ? 'exit-left' : 'exit-right');
  }
  state.deckDir = direction;
  afterMutate();
  const next = activeQueueItems();
  if (!next.length) { state.finalLatched = true; state.pinnedKey = null; }
  else { state.finalLatched = false; state.pinnedKey = next[0].key; }
  setTimeout(() => { renderPhone({ animateDeck: true }); renderInspector(); }, existing ? 60 : 0);
}

function skipCurrentCard() {
  const item = currentReviewItem();
  if (!item) return;
  if (state.artifactLayer) closeArtifactLayer('left');
  logTrace('UI', `Skip ${item.key} (deferred for this visit)`);
  advanceDeck(1, () => { if (!state.skippedKeys.includes(item.key)) state.skippedKeys.push(item.key); });
}

function returnToReview() {
  const active = activeQueueItems();
  const pendingSkipped = state.skippedKeys.filter(k => state.queue.some(item => item.key === k && ((item.kind === 'ticket' && !item.proposalDone) || (item.kind === 'answer' && !item.answered) || (item.kind === 'message' && !item.read))));
  if (!active.length && !pendingSkipped.length) return;
  logTrace('SSE', `Return from final screen: review_priority_keys=[${pendingSkipped.join(', ')}]`);
  advanceDeck(-1, () => {
    const first = active.length ? active[0].key : pendingSkipped[0];
    state.skippedKeys = []; state.finalLatched = false; state.pinnedKey = first;
  });
}

function handleProposalApproveClick(itemKey) {
  const item = state.queue.find(q => q.key === itemKey);
  if (!item || item.refusal) return;
  if (item.isTerminal) executeProposalDecision(item, 'approve', null, null);
  else openApproveCeilingSheet(item);
}

function handleProposalSendBackClick(itemKey) {
  const item = state.queue.find(q => q.key === itemKey);
  if (!item || item.refusal) return;
  const note = (state.drafts[itemKey] || '').trim();
  const atts = state.attachments[itemKey] || [];
  if (!note && !atts.length) {
    const ta = document.getElementById('activeNoteInput');
    if (ta) ta.focus();
    const nudge = document.getElementById('sendBackNudge');
    if (nudge) nudge.style.display = 'block';
    return;
  }
  executeProposalDecision(item, 'send_back', null, null);
}

function executeProposalDecision(item, decision, nextCeiling, nextHolder) {
  const opId = 'op_' + Math.random().toString(36).slice(2, 8);
  if (state.condition === 'slow') {
    item.uncertain = { opId, decision, summary: `${decision === 'approve' ? 'Approval' : 'Send back'} timed out before the server replied.` };
    logTrace('POST', `POST /api/tickets/${item.ticketId}/decision-operations/${opId} (rev=${item.revision}) → timeout (.uncertain)`);
    closeSheet(); renderPhone(); renderInspector(); return;
  }
  if (state.condition === 'offline') {
    state.outbox.push({ opId, lane: `ticket:${item.ticketId}`, summary: `${decision} ${item.field} (rev ${item.revision})` });
    logTrace('OUTBOX', `Saved frozen DecisionCommand ${opId} to SwiftData Outbox`);
    showToast('Saved offline');
  } else {
    logTrace('POST', `POST /api/tickets/${item.ticketId}/decision-operations/${opId} (${decision}, rev=${item.revision}${nextCeiling ? `, ceiling=${nextCeiling}` : ''}${nextHolder ? `, holder=${nextHolder}` : ''}) → 200 applied`);
  }

  state.drafts[item.key] = ''; state.attachments[item.key] = [];
  closeSheet();
  if (state.artifactLayer) closeArtifactLayer('left');
  advanceDeck(1, () => { item.proposalDone = true; });
}

function checkUncertainReceipt(itemKey) {
  const item = state.queue.find(q => q.key === itemKey);
  if (!item || !item.uncertain) return;
  logTrace('GET', `GET /api/tickets/${item.ticketId}/decision-operations/${item.uncertain.opId} → receipt applied`);
  item.uncertain = null; setCondition('live'); showToast('Confirmed · Already applied');
  advanceDeck(1, () => { item.proposalDone = true; });
}

function transferHolder(itemKey, newHolder) {

function openArtifact(artifactId, origin, convId) {

  state.artifactLayer = { artifactId, origin, convId: convId || art.defaultConvId || 'chief', htmlMode: 'phone' };

function closeArtifactLayer(mode) {

/* ============================================================================
   Render iPhone Screen
   ============================================================================ */
function renderPhone(opts = {}) {
  const vp = document.getElementById('iosViewport');
  let html = '';
  if (state.root.kind === 'review') html += renderReviewRoot(opts);
  else if (state.root.kind === 'manager') html += renderManagerScreen(state.root.id, null);
  else if (state.root.kind === 'chief') html += renderChiefScreen(null);
  else html += renderMoreScreen();

  state.stack.forEach((route, idx) => {
    const prev = idx === 0
      ? (state.root.kind === 'review' ? 'Review' : state.root.kind === 'manager' ? 'Manager' : 'Chief')
      : (state.stack[idx - 1].kind === 'manager' ? 'Manager' : state.stack[idx - 1].kind === 'chief' ? 'Chief' : 'Ticket');
    html += `<div class="ios-pushed-layer">${renderPushedRoute(route, prev)}</div>`;
  });

  if (state.artifactLayer) html += renderArtifactLayer(state.artifactLayer);
  vp.innerHTML = html;

  document.getElementById('iosSidebarHost').innerHTML = state.sidebarOpen ? renderSidebarDrawer() : '';

  const noteInput = document.getElementById('activeNoteInput');
  if (noteInput) {
    noteInput.oninput = (e) => {
      state.drafts[e.target.dataset.draftKey] = e.target.value;
      const n = document.getElementById('sendBackNudge');
      if (n) n.style.display = 'none';
    };
    noteInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey && e.target.dataset.isProposal === '1') {
        e.preventDefault();
        document.querySelectorAll('.decision-btn-row-3 .ios-btn:not(.skip), .decision-btn-row .ios-btn').forEach(b => {
          b.classList.remove('flash-ring'); void b.offsetWidth; b.classList.add('flash-ring');
          setTimeout(() => b.classList.remove('flash-ring'), 850);
        });
      }
    };
  }
  vp.querySelectorAll('[data-bind-draft]').forEach(el => {
    const key = el.dataset.bindDraft;
    if (el.id !== 'activeNoteInput') {
      el.oninput = (e) => {
        state.drafts[key] = e.target.value;
        const box = e.target.closest('.note-box');
        const btn = box ? box.querySelector('.composer-send-circle') : null;
        if (btn) {
          const hasContent = Boolean(e.target.value.trim() || (state.attachments[key] || []).length);
          btn.classList.toggle('empty', !hasContent);
        }
      };
      el.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          const box = e.target.closest('.note-box');
          const btn = box ? box.querySelector('.composer-send-circle') : null;
          if (btn) { e.preventDefault(); btn.click(); }
        }
      };
    }
  });

  document.getElementById('iosGateHost').innerHTML = state.gate426 ? `
    <div class="ios-gate-cover">
      <h2 style="margin:0;font-size:19px;color:var(--tone-strong);">Update Panels from TestFlight</h2>
      <p style="margin:0;font-size:13.5px;color:var(--tone-secondary);max-width:280px;">This server requires a newer build. Your unsent drafts and Outbox stay safely on device.</p>
      <button class="ios-btn primary" style="width:100%;max-width:240px;" onclick="state.gate426=false;renderPhone()">Close</button>
    </div>` : '';
}

function renderReviewItemCard(item) {

          <div class="panels-chart-card">

        <button class="ios-btn secondary" style="width:100%;" onclick="skipCurrentCard()">Skip</button>
      </div>`}`;
}

function renderComposerBox(draftKey, placeholder, isProposal, inlineSendAction) {
  const val = state.drafts[draftKey] || '';
  const atts = state.attachments[draftKey] || [];
  const hasContent = Boolean(val.trim() || atts.length);
  const isRec = state.voice.activeKey === draftKey && state.voice.phase === 'recording';
  const isTrans = state.voice.activeKey === draftKey && state.voice.phase === 'transcribing';

  return `
    <div class="note-box">
      ${atts.length ? `<div class="att-strip">${atts.map(a => `<span class="att-chip ${a.preparing ? 'preparing' : ''}"><span>${escapeHtml(a.label)}</span><button class="att-remove" onclick="removeAttachment('${draftKey}','${a.id}')">×</button></span>`).join('')}</div>` : ''}
      ${isRec ? `<div class="voice-strip"><div style="display:flex;align-items:center;gap:8px;"><div class="voice-waves"><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span></div><span id="voiceSecLabel" style="font-variant-numeric:tabular-nums;">0:${String(state.voice.sec).padStart(2,'0')}</span></div><button style="color:var(--accent-bright);font-weight:600;padding:2px 8px;" onclick="stopVoiceAndTranscribe('${draftKey}')">Done</button></div>` : ''}
      ${isTrans ? `<div class="voice-strip" style="background:#171d27;"><span>Transcribing…</span><span class="mark-spinner"></span></div>` : ''}

      <div class="note-input-row">
        <button class="composer-tool-btn" onclick="openAttachSheet('${draftKey}')" aria-label="Attach">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea class="note-textarea" id="${isProposal ? 'activeNoteInput' : ''}" data-draft-key="${draftKey}" data-bind-draft="${draftKey}" data-is-proposal="${isProposal ? '1' : '0'}" rows="1" placeholder="${escapeHtml(placeholder)}">${escapeHtml(val)}</textarea>
        <button class="composer-tool-btn ${isRec ? 'recording' : ''}" onclick="toggleVoice('${draftKey}')" aria-label="Voice">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        ${inlineSendAction ? `<button class="composer-send-circle ${hasContent ? '' : 'empty'}" onclick="${inlineSendAction}" aria-label="Send"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>` : ''}
      </div>
    </div>`;
}

function renderReviewFinalScreen() {
  const newCount = activeQueueItems().length;
  const skippedCount = state.skippedKeys.filter(k => state.queue.some(item => item.key === k && ((item.kind === 'ticket' && !item.proposalDone) || (item.kind === 'answer' && !item.answered) || (item.kind === 'message' && !item.read)))).length;
  const total = newCount + skippedCount;

  let line1 = 'All clear.';
  let line2 = 'Nothing to review.';
  let cta = '';
  if (newCount > 0 && skippedCount > 0) {
    line1 = `${total} to review.`;
    line2 = `${newCount} new, ${skippedCount} skipped.`;
    cta = 'Back to review';
  } else if (newCount > 0) {
    line1 = `${newCount} new.`;
    line2 = 'Ready to review.';
    cta = 'Back to review';
  } else if (skippedCount > 0) {
    line1 = `${skippedCount} skipped.`;
    line2 = 'Nothing new.';
    cta = 'Review skipped';
  }

  const workingCount = 4;

  return `
    <div class="final-screen">
      <div class="final-stage">
        <h2 class="final-line1">${line1}</h2>
        <div class="final-line2">${line2}</div>
        ${cta ? `<button class="final-cta" onclick="returnToReview()">${cta}</button>` : ''}
        ${workingCount ? `<div class="final-working">${workingCount} agent${workingCount === 1 ? '' : 's'} working right now</div>` : ''}
      </div>

      <div class="decision-dock">
        ${renderComposerBox('owner:chief', 'Message Chief…', false, 'sendChiefQuickMessage()')}
      </div>
    </div>`;
}

/* ==========================================================================
   Artifact Vertical Layer (3-Way Web-Parity Bottom Controls)
   ========================================================================== */
function renderArtifactLayer(layer) {
  const art = ARTIFACTS[layer.artifactId];
  const item = state.queue.find(q => q.key === art.ticketKey);
  const conv = state.conversations[layer.convId] || state.conversations.chief;
  const chatDraftKey = conv.id === 'chief' ? 'owner:chief' : `chat:${conv.id}`;

  let bottomHtml = '';
  if (layer.origin === 'proposal' && item && item.kind === 'ticket' && !item.proposalDone) {
    bottomHtml = renderProposalDecisionDock(item, true);
  } else if (layer.origin === 'message' && item && item.kind === 'message' && !item.read) {
    bottomHtml = `
      <div class="decision-dock">
        ${renderComposerBox(item.key, 'Reply…', false, `sendReviewMessageReply('${item.conversationId}','${item.key}')`)}
        <div class="decision-btn-row">
          <button class="ios-btn secondary" onclick="skipCurrentCard()">Skip</button>
          <button class="ios-btn secondary" onclick="markReviewMessageRead('${item.conversationId}','${item.key}')">Mark read</button>
        </div>
      </div>`;
  } else {
    const lastAgent = [...conv.messages].reverse().find(m => m.role === 'agent' || m.role === 'human');
    const previewTxt = lastAgent ? (lastAgent.text || lastAgent.html.replace(/<[^>]+>/g, ' ').trim().slice(0, 64)) : `Chat with ${conv.title}`;
    bottomHtml = `
      <div class="conv-preview-dock">
        <div class="conv-preview-line">
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(conv.title)}: ${escapeHtml(previewTxt)}</span>
          <button style="color:var(--accent-bright);font-weight:500;flex-shrink:0;" onclick="closeArtifactLayer('drop');pushScreen({kind:'conversation',id:'${conv.id}'})">Open chat</button>
        </div>
        ${renderComposerBox(chatDraftKey, `Message ${conv.title}…`, false, `sendChatFromArtifact('${conv.id}','${chatDraftKey}')`)}
      </div>`;
  }

  return `
    <div class="artifact-layer">
      <div class="ios-navbar">
        <button class="ios-bar-btn" onclick="closeArtifactLayer('drop')">Close</button>
        <div class="ios-nav-title">${escapeHtml(art.title)}</div>
        <div class="ios-nav-actions">
          ${art.kind === 'html' ? `
            <div class="segmented-mini">
              <button class="${layer.htmlMode === 'phone' ? 'active' : ''}" onclick="state.artifactLayer.htmlMode='phone';renderPhone()">Phone</button>
              <button class="${layer.htmlMode === 'desktop' ? 'active' : ''}" onclick="state.artifactLayer.htmlMode='desktop';renderPhone()">Fit</button>
            </div>` : ''}
        </div>
      </div>

      <div class="ios-scroll" style="padding:16px 20px 28px;">
        ${renderArtifactContent(art, layer.htmlMode)}
      </div>

      ${bottomHtml}
    </div>`;
}

function sendChatFromArtifact(convId, draftKey) {
  const text = (state.drafts[draftKey] || '').trim();
  if (!text) return;
  const conv = state.conversations[convId] || state.conversations.chief;
  conv.messages.push({ role: 'human', text, time: 'Now' });
  state.drafts[draftKey] = '';
  logTrace('POST', `POST /api/${convId === 'chief' ? 'chief' : 'tickets/' + convId}/conversation/send (from artifact conversation dock)`);
  renderPhone();
}

/* ==========================================================================
   Manager, Ticket, Chief, Conversation & Settings Screens

function renderPushedRoute(route, backLabel) {
  if (route.kind === 'ticket') return renderTicketDetail(route.id, backLabel);
  if (route.kind === 'manager') return renderManagerScreen(route.id, backLabel);
  if (route.kind === 'chief') return renderChiefScreen(backLabel);
  if (route.kind === 'conversation') return renderConversationScreen(route.id, backLabel);
  return '';
}

function groupManagerTickets(tickets) {
  const order = [
    { key: 'awaiting_approval', label: 'Needs your approval' },
    { key: 'awaiting_answer', label: 'Needs your answer' },
    { key: 'assigned', label: 'Yours' },
    { key: 'agent', label: 'Agent' }
  ];
  return order.map(o => ({ label: o.label, items: tickets.filter(t => t.group === o.key) })).filter(g => g.items.length > 0);
}

function renderMark(mark, unread) {
  if (unread) return '<span class="mark-dot-accent"></span>';
  if (mark === 'approval') return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--accent-bright)" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M2 9h3.5l1.2 1.8h2.6L10.5 9H14"/></svg>`;
  if (mark === 'answer') return '<span class="mark-dot-answer"></span>';
  if (mark === 'assigned') return '<span class="mark-ring-assigned"></span>';
  if (mark === 'working' || mark === 'setting_up') return '<span class="mark-spinner"></span>';
  if (mark === 'done') return '<span class="mark-done">✓</span>';
  return '<span class="mark-ring-upcoming"></span>';
}

function renderTicketsCard(scopeKey, activeTickets, backlogged, done) {
  const elapsedStr = formatDuration(state.settingUpElapsed);
  const groups = groupManagerTickets(activeTickets);
  const blKey = `${scopeKey}:backlogged`;
  const doneKey = `${scopeKey}:done`;
  const blOpen = Boolean(state.openBuckets[blKey]);
  const doneOpen = Boolean(state.openBuckets[doneKey]);

  return `
    <div class="worker-sections">
      ${groups.length ? groups.map(g => {
        const gKey = `${scopeKey}:${g.label}`;
        const isOpen = !state.closedGroups[gKey];
        const unreadCount = g.items.filter(t => t.unread).length;
        return `
          <div>
            <button class="worker-disc-head" onclick="state.closedGroups['${gKey}']=!state.closedGroups['${gKey}'];renderPhone()">
              <span>${escapeHtml(g.label)}</span>
              <span class="worker-disc-count">${!isOpen && unreadCount > 0 ? `${unreadCount} unread` : g.items.length}</span>
            </button>
            ${isOpen ? `
              <div class="worker-rows">
                ${g.items.map(t => `
                  <button class="worker-row" onclick="pushScreen({kind:'ticket',id:'${t.id}'})">
                    <div class="worker-row-text">
                      <div class="worker-row-title ${t.group === 'agent' && !t.unread ? 'quiet' : ''}">${escapeHtml(t.title)}</div>
                      ${t.settingUp ? `<div class="worker-row-sub">Setting up · ${elapsedStr}</div>` : ''}
                    </div>
                    <span class="mark-trail">${renderMark(t.mark, t.unread)}</span>
                  </button>`).join('')}
              </div>` : ''}
          </div>`;
      }).join('') : `<div style="padding:4px 4px;font-size:13px;color:var(--tone-tertiary);">No active workers</div>`}

      ${backlogged.length ? `
        <div>
          <button class="worker-disc-head" onclick="state.openBuckets['${blKey}']=!state.openBuckets['${blKey}'];renderPhone()">
            <span>Backlogged</span>
            <span class="worker-disc-count">${backlogged.length}</span>
          </button>
          ${blOpen ? `
            <div class="worker-rows">
              ${backlogged.map(t => `
                <button class="worker-row" onclick="pushScreen({kind:'ticket',id:'${t.id}'})">
                  <div class="worker-row-text"><div class="worker-row-title quiet">${escapeHtml(t.title)}</div></div>
                </button>`).join('')}
            </div>` : ''}
        </div>` : ''}

      ${done.length ? `
        <div>
          <button class="worker-disc-head" onclick="state.openBuckets['${doneKey}']=!state.openBuckets['${doneKey}'];renderPhone()">
            <span>Done</span>
            <span class="worker-disc-count">${done.length}</span>
          </button>
          ${doneOpen ? `
            <div class="worker-rows">
              ${done.map(t => `
                <button class="worker-row" onclick="pushScreen({kind:'ticket',id:'${t.id}'})">
                  <div class="worker-row-text"><div class="worker-row-title quiet">${escapeHtml(t.title)}</div></div>
                  <span class="mark-trail"><span class="mark-done">✓</span></span>
                </button>`).join('')}
            </div>` : ''}
        </div>` : ''}
    </div>`;
}

        return `<div class="chat-agent-block prose">${m.html}</div>`;
      }).join('')}
    </div>

function sendChatMessage(convId, draftKey) {
  const text = (state.drafts[draftKey] || '').trim();
  const atts = state.attachments[draftKey] || [];
  if (!text && !atts.length) return;
  const conv = state.conversations[convId] || state.conversations.chief;
  const label = text + (atts.length ? ` [${atts.map(a => a.label).join(', ')}]` : '');
  if (state.condition === 'offline') {
    state.outbox.push({ opId: 'chat_' + Date.now(), lane: `conversation:${convId}`, summary: label.slice(0, 28) });
    conv.messages.push({ role: 'human', text: label, time: 'Now' });
  } else {
    conv.messages.push({ role: 'human', text: label, time: 'Now' });
    logTrace('POST', `POST /api/${convId === 'chief' ? 'chief' : 'tickets/' + convId}/conversation/send`);
  }
  state.drafts[draftKey] = ''; state.attachments[draftKey] = [];
  renderPhone();
  setTimeout(() => { const a = document.getElementById('chatScrollArea'); if (a) a.scrollTop = a.scrollHeight; }, 20);
}

      { broken: 'Mixed Proposal + Message Cards Stacked Multiple Composers', cause: 'Showing a proposal and an unread conversation on the same phone card forced two composers and competing button rows.', fix: 'Conversation items are separate Review cards on iOS: every card has one clear focus and one balanced bottom dock.', fn: () => jumpReviewCard('message:conv_app_routes') },
      { broken: 'Over-Engineered Final Page', cause: 'Extra status cards, lists, and chrome turned the end of Review into noise.', fix: 'Simple, quiet All caught up screen (with Revisit skipped only when needed) and Chief composer anchored at the bottom.', fn: () => { state.root = { kind: 'review' }; state.stack = []; state.artifactLayer = null; state.sidebarOpen = false; state.finalLatched = true; renderPhone(); renderInspector(); } },
      { broken: 'Web-Parity 3-Way Artifact Bottom Controls', cause: 'iOS ArtifactViewer dropped proposal controls and ignored conversation-below behavior.', fix: 'Proposal links keep Skip / Return / Approve below; message links keep inline-Send reply + subtle Mark read; Ticket/Manager/Chat links keep Conversation composer below.', fn: () => { state.root = { kind: 'manager', id: 'm_improve_wren' }; state.stack = [{ kind: 'ticket', id: 't_post_paywall' }]; openArtifact('post_paywall_html', 'conversation', 't_post_paywall'); } },
      { broken: '1,451 ms Main-Thread Review Hangs & Keystroke SQLite Saves', cause: 'ReviewView queried SwiftData synchronously on every render, and saveDraft wrote on MainActor per keystroke.', fix: 'In-memory ReviewSavedWork snapshot invalidated only on Outbox writes + debounced off-main draft saves.', fn: () => setInspectorTab('dataflow') },
      { broken: 'Chief Sideways Swipe Shift & Workspace Composer Leaks', cause: 'Hidden UINavigationBar delegate hijack + nested MountedTabContent hosting controller + dual-mounted ConversationSurface.', fix: 'Standard native navigation, unified table layout, pure SwiftUI stack, and screen-scoped conversation dock.', fn: () => selectRoot({ kind: 'chief' }) },
      { broken: 'Photo HTTP 422, Dual Voice Systems & Inline-Only Chat Markdown', cause: 'Raw >3 MiB HEIC froze MainActor, chat dropped offline voice audio, and chat lacked tables/code/charts.', fix: 'Off-main HEIC→JPEG prep, unified durable .m4a voice capture, and block Markdown rendering everywhere.', fn: () => { state.root = { kind: 'chief' }; state.stack = [{ kind: 'conversation', id: 'chief' }]; renderPhone(); renderInspector(); } }
    ];
    body.innerHTML = items.map((it, i) => `
      <div class="problem-row">
        <div>
          <span class="problem-badge">Before</span>
          <div style="font-size:13.5px;font-weight:600;color:var(--tone-strong);">${escapeHtml(it.broken)}</div>
          <div style="font-size:12.5px;color:var(--tone-secondary);margin-top:2px;">${escapeHtml(it.cause)}</div>
          <span class="fix-badge">Now</span>
          <div style="font-size:12.5px;color:var(--tone-primary);">${escapeHtml(it.fix)}</div>
        </div>
        <button class="sim-btn" style="margin:0;" id="pjump-${i}">Show</button>
      </div>`).join('');
    items.forEach((it, i) => document.getElementById('pjump-' + i).onclick = it.fn);
    return;
  }

  const jumps = [
    { k: 'Review · Home', t: 'Proposal Card (3 Balanced Buttons)', s: 'Equal-width Skip, Return, and Approve in one bottom row', fn: () => jumpReviewCard('ticket:t_post_paywall') },
    { k: 'Sidebar', t: 'Chief & Managers Rail Cards', s: 'All projects eyebrow on Chief, identical cards, no borders', fn: () => openSidebar() },
    { k: 'Review · Card 2', t: 'Terminal Proposal Card', s: 'Clean proposal only — conversation item is its own card', fn: () => jumpReviewCard('ticket:t_app_routes') },
    { k: 'Review · Card 3', t: 'Worker Message Card', s: 'Separate conversation item: inline Send + Skip / Mark read', fn: () => jumpReviewCard('message:conv_app_routes') },
    { k: 'Review · Card 4', t: 'Worker Question', s: 'Equal-width Skip and Send answer buttons', fn: () => jumpReviewCard('answer:t_goal_sheet') },
    { k: 'Review · Card 5', t: 'Manager Message', s: 'Send inside composer, equal-width Skip & Mark read below', fn: () => jumpReviewCard('message:conv_accounts') },
    { k: 'Review · End', t: 'All Caught Up + Chief Composer', s: 'Simple quiet end screen with Chief composer anchored below', fn: () => { state.root = { kind: 'review' }; state.stack = []; state.artifactLayer = null; state.sidebarOpen = false; state.finalLatched = true; renderPhone(); renderInspector(); } },
    { k: 'Manager', t: 'Existing iOS Manager Page', s: 'Kept intact from today’s app, no weird long-presses', fn: () => selectRoot({ kind: 'manager', id: 'm_improve_wren' }) },
    { k: 'Chief', t: 'Chief of Staff Page', s: 'Same layout as Managers, headroom.page + direct Tickets', fn: () => selectRoot({ kind: 'chief' }) },
    { k: 'Artifact · Proposal', t: 'HTML Artifact + Proposal Bar', s: 'Opened from Review proposal → Skip / Return / Approve below', fn: () => { jumpReviewCard('ticket:t_post_paywall'); openArtifact('post_paywall_html', 'proposal'); } },
    { k: 'Artifact · Conversation', t: 'HTML Artifact + Conversation Below', s: 'Opened from Ticket Artifacts / Chat → inline-Send dock below', fn: () => { state.root = { kind: 'manager', id: 'm_improve_wren' }; state.stack = [{ kind: 'ticket', id: 't_post_paywall' }]; openArtifact('post_paywall_html', 'conversation', 't_post_paywall'); } },
    { k: 'Conversation', t: 'Existing Conversation View', s: 'Unchanged iOS conversation screen with inline Send', fn: () => { state.root = { kind: 'chief' }; state.stack = [{ kind: 'conversation', id: 'chief' }]; state.sidebarOpen = false; state.artifactLayer = null; renderPhone(); renderInspector(); } }
  ];
  body.innerHTML = `<div class="jump-grid">${jumps.map((j, i) => `<button class="jump-card" id="j-${i}"><span style="font-size:11px;font-weight:600;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.04em;">${escapeHtml(j.k)}</span><span style="font-size:13.5px;font-weight:600;color:var(--tone-strong);">${escapeHtml(j.t)}</span><span style="font-size:12px;color:var(--tone-secondary);line-height:1.4;">${escapeHtml(j.s)}</span></button>`).join('')}</div>`;
  jumps.forEach((j, i) => document.getElementById('j-' + i).onclick = j.fn);
}

function jumpReviewCard(key) {
  state.root = { kind: 'review' }; state.stack = []; state.artifactLayer = null; state.sidebarOpen = false; state.finalLatched = false;
  const item = state.queue.find(q => q.key === key);
  if (item) {
    if (item.kind === 'ticket') item.proposalDone = false;
    if (item.kind === 'answer') item.answered = false;
    if (item.kind === 'message') item.read = false;
    state.skippedKeys = state.skippedKeys.filter(k => k !== key);
    state.pinnedKey = key;
  }
  renderPhone(); renderInspector();
}

function fitPhoneFrame() {
  const scaler = document.getElementById('phoneScaler');
  const stage = document.querySelector('.phone-stage');
  if (!scaler || !stage) return;
  if (window.innerWidth <= 440) { scaler.style.transform = 'none'; return; }
  const scale = Math.min(1, (stage.clientHeight - 24) / 876, (stage.clientWidth - 24) / 418);
  scaler.style.transform = `scale(${scale.toFixed(3)})`;
}
window.addEventListener('resize', fitPhoneFrame);

setInterval(() => {
  state.settingUpElapsed += 1;
  if (state.root.kind === 'manager' && !currentPushed()) {
    document.querySelectorAll('.worker-row-sub').forEach(el => {
      if (el.textContent.startsWith('Setting up ·')) el.textContent = `Setting up · ${formatDuration(state.settingUpElapsed)}`;
    });
  }
}, 1000);

logTrace('SSE', 'GET /api/navigation/view/events connected (projection_version=7, review=4)');
logTrace('GET', 'GET /api/tickets/t_post_paywall/workspace (ResourceOwner cached)');
renderPhone();
renderInspector();
fitPhoneFrame();
</script>
