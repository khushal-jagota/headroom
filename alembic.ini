# Alembic configuration for authoring migrations from the repository root:
#
#   .venv/bin/alembic revision -m "what this migration does"
#   .venv/bin/alembic history
#
# Applying migrations is not done from here. The server applies them at startup, and
# src/planner/core/migrations/env.py refuses a command-line upgrade, because bringing a
# database up to date involves decisions (is it new, is it already tracked, is it an old
# one being adopted) that live in planner.core.db.create_schema. There is deliberately no
# sqlalchemy.url: the database path has one source of truth, the Panels configuration.

[alembic]
script_location = src/planner/core/migrations
