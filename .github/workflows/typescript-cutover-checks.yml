# Test-only copy of deploy.yml prepare/suites/checks. No release or install jobs.
# The same runner prerequisites and full selections exercise feature and frozen staging.
name: TypeScript cutover release checks
'on':
  push:
    branches: [ticket/t_57s7b5hm-proof-f21f3872]
permissions:
  contents: read
  actions: read
concurrency:
  group: cutover-release-checks-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: [candidate]
    env:
      PANELS_REQUESTED_SHA: f21f3872689a7e8069450b11621bf9c72661985e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set preparation source path
        run: echo "PANELS_CANDIDATE_SOURCE=$RUNNER_TEMP/publication-source" >> "$GITHUB_ENV"
      - name: Prove exact temporary source
        run: |
          printf '%s\n' "$PANELS_REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "commit_sha must be a lowercase, full 40-character hexadecimal SHA" >&2
            exit 2
          }
          git cat-file -e "$PANELS_REQUESTED_SHA^{commit}"
          git worktree add --detach "$PANELS_CANDIDATE_SOURCE" "$PANELS_REQUESTED_SHA"
          test "$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse HEAD)" = "$PANELS_REQUESTED_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) throw new Error("Node 22 or newer is required")'
      - name: Check native iOS compatibility before publication
        run: python3 "$PANELS_CANDIDATE_SOURCE/scripts/check_ios_compatibility.py"
      - name: Prepare complete source-bound selection
        run: python3 scripts/publication_checks.py prepare --output "$RUNNER_TEMP/publication-selection"
      - name: Retain prepared selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: cutover-selection-${{ matrix.source }}
          path: ${{ runner.temp }}/publication-selection/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
  suites:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, e2e, browser]
        source: [candidate]
    env:
      PANELS_REQUESTED_SHA: f21f3872689a7e8069450b11621bf9c72661985e
      PANELS_SUITE: ${{ matrix.suite }}
      PANELS_REHEARSAL: 'true'
      PANELS_BASELINE_SHA: '5622d2a81c8b45cbabd358fe2b2023b123c4b92b'
    defaults:
      run:
        shell: python3 scripts/deployment_progress.py {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bootstrap disposable hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap dbus-user-session ffmpeg patchelf binutils libtk8.6
          # Hosted Ubuntu's AppArmor policy otherwise denies unprivileged bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sudo mkdir -p /home/vps/Deployments/Panels
          sudo chown "$(id -u):$(id -g)" /home/vps/Deployments/Panels
      - name: Set deployment paths
        run: python3 scripts/deployment_rehearsal.py configure
      - name: Initialize suite reports
        run: mkdir -p "$PANELS_REPORT_DIR"

      - name: Prove exact temporary source
        run: |
          printf '%s\n' "$PANELS_REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "commit_sha must be a lowercase, full 40-character hexadecimal SHA" >&2
            exit 2
          }
          git cat-file -e "$PANELS_REQUESTED_SHA^{commit}"
          git worktree add --detach "$PANELS_CANDIDATE_SOURCE" "$PANELS_REQUESTED_SHA"
          test "$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse HEAD)" = "$PANELS_REQUESTED_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) throw new Error("Node 22 or newer is required")'
      - name: Download complete selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: cutover-selection-${{ matrix.source }}
          path: ${{ runner.temp }}/publication-selection
      - name: Check prepared source and selection
        id: selection
        run: python3 scripts/publication_checks.py accept-selection --download "$RUNNER_TEMP/publication-selection"
      - name: Establish authenticated E2E user manager
        if: ${{ matrix.suite == 'e2e' }}
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/e2e.log") 2>&1
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          if (os.environ.get("PANELS_REHEARSAL") != "true"
                  or os.environ.get("RUNNER_ENVIRONMENT") != "github-hosted"):
              raise RuntimeError("E2E user manager setup requires a disposable hosted runner")
          uid = os.getuid()
          unit = f"user@{uid}.service"
          expected_pid = int(subprocess.check_output(
              ["systemctl", "show", unit, "--property=MainPID", "--value"], text=True).strip())
          if expected_pid <= 1:
              raise RuntimeError("system user unit has no live manager PID")
          print(json.dumps({"expected_manager_pid": expected_pid, "expected_uid": uid}), flush=True)
          try:
              executable = Path(f"/proc/{expected_pid}/exe")
              metadata = executable.stat()
              print(json.dumps({"manager_exe": os.readlink(executable),
                                "device": metadata.st_dev, "inode": metadata.st_ino}), flush=True)
          except OSError as error:
              print(json.dumps({"manager_exe_error": str(error)}), flush=True)
          command = [
              "/usr/bin/busctl", f"--address=unix:path=/run/user/{uid}/bus", "--json=short",
              "call", "org.freedesktop.DBus", "/org/freedesktop/DBus", "org.freedesktop.DBus",
              "GetConnectionCredentials", "s", "org.freedesktop.systemd1",
          ]
          started = time.monotonic()

          def query(label):
              attempt = time.monotonic()
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=1.0)
                  print(json.dumps({"query": label, "elapsed_seconds": time.monotonic() - started,
                                    "duration_seconds": time.monotonic() - attempt,
                                    "exit": result.returncode, "stdout": result.stdout,
                                    "stderr": result.stderr}), flush=True)
                  if result.returncode:
                      return False
                  value = json.loads(result.stdout)
                  credentials = value["data"][0]
                  return (value["type"] == "a{sv}"
                          and credentials["ProcessID"] == {"type": "u", "data": expected_pid}
                          and credentials["UnixUserID"] == {"type": "u", "data": uid})
              except subprocess.TimeoutExpired as error:
                  print(json.dumps({"query": label, "elapsed_seconds": time.monotonic() - started,
                                    "duration_seconds": time.monotonic() - attempt,
                                    "exit": None, "timeout": True, "stdout": str(error.stdout),
                                    "stderr": str(error.stderr)}), flush=True)
              except (ValueError, KeyError, TypeError, IndexError) as error:
                  print(json.dumps({"query": label, "credentials_error": str(error)}), flush=True)
              return False

          query("before-start")
          subprocess.run(["systemctl", "--user", "start", "dbus.service"],
                         check=True, timeout=10)
          deadline = time.monotonic() + 20
          attempt = 0
          while time.monotonic() < deadline:
              attempt += 1
              if query(f"readiness-{attempt}"):
                  current_pid = int(subprocess.check_output(
                      ["systemctl", "show", unit, "--property=MainPID", "--value"],
                      text=True).strip())
                  if current_pid != expected_pid:
                      raise RuntimeError("system user manager changed during readiness")
                  print(json.dumps({"authenticated_manager_ready": True, "attempts": attempt,
                                    "elapsed_seconds": time.monotonic() - started}), flush=True)
                  break
              time.sleep(0.25)
          else:
              raise RuntimeError("E2E user manager did not acquire authenticated DBus credentials")
          PYTHON


      - name: Provision offline Hermes integration prerequisite
        if: ${{ matrix.suite == 'integration' }}
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/integration.log") 2>&1
          set -o pipefail
          # Only the real core + ACP package is needed; never provider credentials/extras.
          hermes_source="$HOME/.hermes/hermes-agent"
          hermes_sha=76d832d3857551a029c4b39c23945eb47c16fe5b
          test ! -e "$hermes_source"
          echo "PANELS_REHEARSAL_HERMES_ROOT=$hermes_source" >> "$GITHUB_ENV"
          git init "$hermes_source"
          git -C "$hermes_source" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_source" fetch --depth=1 origin "$hermes_sha"
          git -C "$hermes_source" checkout --detach FETCH_HEAD
          test "$(git -C "$hermes_source" rev-parse HEAD)" = "$hermes_sha"
          python3 -m venv "$hermes_source/venv"
          "$hermes_source/venv/bin/python" -m pip install --editable "$hermes_source[acp]" \
            2>&1 | tee "$PANELS_GATE_DIR/hermes-install.log"
          echo "$hermes_sha" > "$PANELS_GATE_DIR/hermes-revision.txt"
      - name: Prepare requested-source check environment
        id: checks_setup
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/$PANELS_SUITE.log") 2>&1
          # Never inherit service/database/provider configuration into requested checks.
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --editable .
          # Keep web dependencies locked; resolve current agent CLIs for this build.
          npm ci --prefix web
          npm install --prefix agent_backends --package-lock=false --save=false @anthropic-ai/claude-code@latest @openai/codex@latest
          if [ "$PANELS_REHEARSAL" = true ]; then
            .venv/bin/python -m playwright install --with-deps chromium
          else
            .venv/bin/python -m playwright install chromium
          fi
          codex_bin="$(.venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" setup --source-root "$PANELS_CANDIDATE_SOURCE")"
          echo "$codex_bin" >> "$GITHUB_PATH"
          export PATH="$codex_bin:$PATH"
          npm --prefix web run build
          # A missing sandbox fails before any selected connected host starts.
          connected="$(python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); print(bool(s["e2e"] or s["browser"]))' "$PANELS_GATE_DIR/selection.json")"
          if [ "$connected" = True ]; then
            command -v bwrap
          fi
          mkdir -p "$PANELS_GATE_DIR/artifact-shadow" "$PANELS_REPORT_DIR"
      - name: pytest unit at requested source
        if: ${{ matrix.suite == 'unit' && !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/unit.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "unit")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" verify --source-root "$PANELS_CANDIDATE_SOURCE"
          # One pytest worker per vCPU of the hosted runner, here and in the other suites.
          # Worker custody needs a delegated cgroup; the runner service cgroup is not writable.
          systemd-run --user --scope --quiet -p Delegate=yes -- .venv/bin/pytest "${selected[@]}" -n 4 --junitxml="$PANELS_REPORT_DIR/unit.xml"
          python3 "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" pytest "$PANELS_REPORT_DIR/unit.xml" "${selected[@]}"
      - name: pytest integration at requested source
        if: ${{ matrix.suite == 'integration' && !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/integration.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "integration")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" verify --source-root "$PANELS_CANDIDATE_SOURCE"
          # Worker custody needs a delegated cgroup; the runner service cgroup is not writable.
          systemd-run --user --scope --quiet -p Delegate=yes -- .venv/bin/pytest "${selected[@]}" -n 4 --junitxml="$PANELS_REPORT_DIR/integration.xml"
          python3 "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" pytest "$PANELS_REPORT_DIR/integration.xml" "${selected[@]}"
      - name: pytest E2E at requested source
        if: ${{ matrix.suite == 'e2e' && !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/e2e.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "e2e")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" verify --source-root "$PANELS_CANDIDATE_SOURCE"
          bwrap --bind / / --dev-bind /dev /dev \
            --bind "$PANELS_GATE_DIR/artifact-shadow" /home/vps/Deployments/Panels \
            --bind "$PANELS_CANDIDATE_SOURCE" "$PANELS_CANDIDATE_SOURCE" \
            --bind "$PANELS_REPORT_DIR" "$PANELS_REPORT_DIR" \
            --bind "$PANELS_CODEX_TOOLS" "$PANELS_CODEX_TOOLS" \
            --chdir "$PANELS_CANDIDATE_SOURCE" -- \
            .venv/bin/pytest "${selected[@]}" -n 4 --junitxml="$PANELS_REPORT_DIR/e2e.xml"
          python3 "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" pytest "$PANELS_REPORT_DIR/e2e.xml" "${selected[@]}"
      - name: Browser hosts at requested source
        if: ${{ matrix.suite == 'browser' && !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee -a "$PANELS_REPORT_DIR/browser.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "browser")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          browser_format="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["browser_format"])' "$PANELS_GATE_DIR/selection.json")"
          node --input-type=module -e 'import {pathToFileURL} from "node:url"; const {assertCompleteCaseEnvironment} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + "/web/tests/browser/contracts.mjs").href); assertCompleteCaseEnvironment(process.env);'
          if [ "$browser_format" = shared-v1 ]; then
            invocation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-browser"
            # The receipt proves its own revision with git, so the checkout's git
            # directory must survive the artifact shadow it can sit underneath.
            git_common_dir="$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse --path-format=absolute --git-common-dir)"
            bwrap --bind / / --dev-bind /dev /dev \
              --bind "$PANELS_GATE_DIR/artifact-shadow" /home/vps/Deployments/Panels \
              --bind "$PANELS_CANDIDATE_SOURCE" "$PANELS_CANDIDATE_SOURCE" \
              --ro-bind "$git_common_dir" "$git_common_dir" \
              --bind "$PANELS_REPORT_DIR" "$PANELS_REPORT_DIR" \
              --bind "$PANELS_CODEX_TOOLS" "$PANELS_CODEX_TOOLS" \
              --chdir "$PANELS_CANDIDATE_SOURCE/web" -- \
              node tests/browser/run.mjs --report "$PANELS_REPORT_DIR/browser.json" \
                --revision "$PANELS_REQUESTED_SHA" --invocation-id "$invocation_id" "${selected[@]}"
            python3 "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" \
              browser "$PANELS_REPORT_DIR/browser.json" "${selected[@]}" \
              --source-root "$PANELS_CANDIDATE_SOURCE" --revision "$PANELS_REQUESTED_SHA" \
              --invocation-id "$invocation_id"
          elif [ "$browser_format" = legacy ]; then
            # Rollback source predates case receipts. Preserve its original exit checks.
            status=0
            for host in "${selected[@]}"; do
              bwrap --bind / / --dev-bind /dev /dev \
                --bind "$PANELS_GATE_DIR/artifact-shadow" /home/vps/Deployments/Panels \
                --bind "$PANELS_CANDIDATE_SOURCE" "$PANELS_CANDIDATE_SOURCE" \
                --bind "$PANELS_REPORT_DIR" "$PANELS_REPORT_DIR" \
                --bind "$PANELS_CODEX_TOOLS" "$PANELS_CODEX_TOOLS" \
                --chdir "$PANELS_CANDIDATE_SOURCE/web" -- \
                node "${host#web/}" || status=1
            done
            exit "$status"
          else
            echo "Unsupported browser proof format: $browser_format" >&2
            exit 1
          fi
      - name: Inventory available suite evidence
        if: ${{ always() && steps.selection.outcome == 'success' }}
        env:
          PANELS_SUITE: ${{ matrix.suite }}
        run: python3 scripts/publication_checks.py pack --suite "$PANELS_SUITE" --output "$RUNNER_TEMP/publication-suite"
      - name: Retain suite evidence and diagnostics
        id: suite_proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: cutover-${{ matrix.source }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/publication-suite/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Retain raw suite diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: cutover-${{ matrix.source }}-${{ matrix.suite }}-diagnostics
          path: ${{ env.PANELS_GATE_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
      - name: Remove suite temporary state
        env:
          PANELS_PROOF_RETENTION_OUTCOME: ${{ steps.suite_proof.outcome }}
        run: python3 scripts/deployment_rehearsal.py cleanup
        if: ${{ always() }}
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: [candidate]
    env:
      PANELS_REQUESTED_SHA: f21f3872689a7e8069450b11621bf9c72661985e
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set static check paths
        run: |
          echo "PANELS_CANDIDATE_SOURCE=$RUNNER_TEMP/checks-source" >> "$GITHUB_ENV"
          echo "PANELS_GATE_DIR=$RUNNER_TEMP/checks-gate" >> "$GITHUB_ENV"
          echo "PANELS_REPORT_DIR=$RUNNER_TEMP/checks-gate/reports" >> "$GITHUB_ENV"
      - name: Prove exact temporary source
        run: |
          printf '%s\n' "$PANELS_REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "commit_sha must be a lowercase, full 40-character hexadecimal SHA" >&2
            exit 2
          }
          git cat-file -e "$PANELS_REQUESTED_SHA^{commit}"
          git worktree add --detach "$PANELS_CANDIDATE_SOURCE" "$PANELS_REQUESTED_SHA"
          test "$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse HEAD)" = "$PANELS_REQUESTED_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) throw new Error("Node 22 or newer is required")'
      - name: Download complete selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          name: cutover-selection-${{ matrix.source }}
          path: ${{ runner.temp }}/publication-selection
      - name: Check prepared source and selection
        run: python3 scripts/publication_checks.py accept-selection --download "$RUNNER_TEMP/publication-selection"
      - name: Prepare static check environment
        id: checks_setup
        run: |
          # Never inherit service/database/provider configuration into requested checks.
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --editable .
          npm ci --prefix web
          mkdir -p "$PANELS_REPORT_DIR"
      - name: Ruff at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/ruff.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "ruff_paths")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/ruff check "${selected[@]}"
      - name: mypy at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/mypy.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          enabled="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["mypy"]; assert isinstance(v,bool), "invalid check flag"; print(str(v).lower())' "$PANELS_GATE_DIR/selection.json")"
          if [ "$enabled" != true ]; then exit 0; fi
          .venv/bin/mypy
      - name: Frontend check at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/svelte-check.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          enabled="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["web_check"]; assert isinstance(v,bool), "invalid check flag"; print(str(v).lower())' "$PANELS_GATE_DIR/selection.json")"
          if [ "$enabled" != true ]; then exit 0; fi
          npm --prefix web run check
      - name: Typechecked Vitest at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "vitest")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          for index in "${!selected[@]}"; do selected[$index]="${selected[$index]#web/}"; done
          npm --prefix web run test:vitest -- "${selected[@]}" --reporter=default --reporter=json --outputFile="$PANELS_REPORT_DIR/vitest.json"
          python3 "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" vitest "$PANELS_REPORT_DIR/vitest.json" "${selected[@]}"
      - name: Retain static check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          overwrite: true
          name: cutover-${{ matrix.source }}-checks
          path: ${{ runner.temp }}/checks-gate/reports/
          if-no-files-found: ignore
          retention-days: 30
