name: TypeScript backend checkpoint

on:
  pull_request:
    branches: [staging, feature/server-and-machine-code, feature/update-rework]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-suite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/typescript-backend-server.yml

  web-suite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/development-tools.yml

  browser:
    name: Browser gates (${{ matrix.backend }}, Node 22)
    # Browser gates run on the schedule and on manual runs, not on pull requests
    # or pushes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: ['typescript']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up and run isolated browser gates
        env:
          BROWSER_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          browser_root="$RUNNER_TEMP/browser-$BROWSER_BACKEND"
          browser_evidence="$RUNNER_TEMP/browser-evidence-$BROWSER_BACKEND"
          mkdir -p "$browser_root"/{home,tmp,config,cache,data,state,runtime,ms-playwright} \
            "$browser_evidence"/{success,html,failure}
          browser_environment=()
          for browser_env_key in $(compgen -e); do
            case "$browser_env_key" in
              PLAN_*|PANELS_*|CODEX_*|CLAUDE_*|ANTHROPIC_*|OPENAI_*|AZURE_OPENAI_*|GEMINI_*|GOOGLE_APPLICATION_CREDENTIALS|*_HOME|*_CONFIG_DIR|*_DATA_DIR|*_STATE_DIR|*_CACHE_DIR|XDG_*|HUGGINGFACE_HUB_CACHE|TRANSFORMERS_CACHE|PLAYWRIGHT_*|PYTEST_*|PYTHONHOME|PYTHONPATH|NODE_OPTIONS|NODE_PATH|PIP_*|npm_config_*|NPM_CONFIG_*|BASH_ENV|ENV|CDPATH|VIRTUAL_ENV|HOME|TMPDIR|TMP|TEMP)
                browser_environment+=(-u "$browser_env_key")
                ;;
            esac
          done
          env "${browser_environment[@]}" \
            HOME="$browser_root/home" \
            TMPDIR="$browser_root/tmp" TMP="$browser_root/tmp" TEMP="$browser_root/tmp" \
            XDG_CONFIG_HOME="$browser_root/config" XDG_CACHE_HOME="$browser_root/cache" \
            XDG_DATA_HOME="$browser_root/data" XDG_STATE_HOME="$browser_root/state" \
            XDG_RUNTIME_DIR="$browser_root/runtime" \
            PLAYWRIGHT_BROWSERS_PATH="$browser_root/ms-playwright" \
            PANELS_UI_PROOF_DIR="$browser_evidence/success" \
            PANELS_TICKET_EVIDENCE_DIR="$browser_evidence/html" \
            PANELS_E2E_FAILURE_DIR="$browser_evidence/failure" \
            BROWSER_EVIDENCE_DIR="$browser_evidence" \
            bash --noprofile --norc -euo pipefail <<'BROWSER' 2>&1 | tee "$browser_evidence/job.log"
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config build-essential ffmpeg
          npm ci --prefix server
          npm ci --prefix web
          npm install --prefix agent_backends --no-save --no-package-lock
          npm ci --prefix tests/e2e
          (cd web && node node_modules/vite/bin/vite.js build)
          cd tests/e2e
          node_modules/.bin/playwright install --with-deps chromium
          node_modules/.bin/playwright test conversation_send_motion review_deck --repeat-each=8
          BROWSER
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ matrix.backend }}-node-22
          path: ${{ runner.temp }}/browser-evidence-${{ matrix.backend }}
          if-no-files-found: warn
