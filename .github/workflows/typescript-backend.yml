name: TypeScript backend checkpoint

on:
  pull_request:
    branches: [feature/typescript-backend]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [feature/typescript-backend]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparison:
    name: comparison (${{ matrix.node }}, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Pull requests run only Node 22 and the direct part, which includes the
      # static checks. Pushes to the branch and manual runs run the full matrix.
      # The matrix itself shrinks, so no skipped entries are left pending.
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["22", "24"]') }}
        part: ${{ fromJSON(github.event_name == 'pull_request' && '["direct"]' || '["direct", "areas"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install isolated dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --editable . --config-settings editable_mode=compat
          scripts/dev npm --prefix server ci
          scripts/dev npm --prefix web ci
          scripts/dev check-node web
          (cd web && node node_modules/vite/bin/vite.js build)
      - name: Python comparison lint
        if: matrix.part == 'direct'
        run: .venv/bin/ruff check tests/compare
      - name: Python type check
        if: matrix.part == 'direct'
        run: scripts/dev mypy
      - name: Check conversation contracts
        if: matrix.part == 'direct'
        run: .venv/bin/python scripts/generate_conversation_view_contracts.py --check
      - name: Check remaining generated contracts
        if: matrix.part == 'direct'
        run: |
          .venv/bin/python scripts/generate_resource_browser_contracts.py --check
          .venv/bin/python scripts/generate_navigation_browser_contracts.py --check
          .venv/bin/python scripts/generate_ticket_workspace_contracts.py --check
          .venv/bin/python scripts/generate_goal_browser_contracts.py --check
      - name: Check real migration graph and schema drift
        if: matrix.part == 'direct'
        run: |
          schema_root=$(mktemp -d "$RUNNER_TEMP/panels-schema.XXXXXX")
          trap 'rm -rf -- "$schema_root"' EXIT
          mkdir -p "$schema_root"/{home,codex,claude,hermes,app,logs,backups,workspace,scratch,run}
          printf '{}\n' > "$schema_root/config.yaml"
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME="$schema_root/home" CODEX_HOME="$schema_root/codex" \
            CLAUDE_CONFIG_DIR="$schema_root/claude" HERMES_HOME="$schema_root/hermes" \
            PLAN_HERMES_HOME="$schema_root/hermes" TMPDIR="$schema_root" \
            PLAN_CONFIG_PATH="$schema_root/config.yaml" PLAN_DB_PATH="$schema_root/private.sqlite" \
            PLAN_APP_ROOT="$schema_root/app" PLAN_TICKET_SCRATCH_ROOT="$schema_root/scratch" \
            PLAN_TICKET_SCRATCH_DATABASE="$schema_root/private.sqlite" \
            PLAN_LOGS_DIR="$schema_root/logs" PLAN_BACKUP_DIR="$schema_root/backups" \
            PLAN_WORKSPACE_ROOT="$schema_root/workspace" PLAN_CREDENTIAL_KEY_PATH="$schema_root/key" \
            PLAN_DISPATCHER_LOCK_PATH="$schema_root/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$schema_root/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$schema_root/run/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_TEST_MODE=1 PLAN_DISPATCH_ENABLED=false \
            .venv/bin/python tests/compare/direct/unit21_schema_seed.py --check
      - name: Compare direct runtime checks against Python
        if: matrix.part == 'direct'
        run: |
          scripts/dev pytest tests/compare/direct --compare-report-dir "$RUNNER_TEMP/comparison"
          .venv/bin/python tests/compare/tools/generate_fixture_oracle.py --check
      - name: Check shared comparison oracles and stalls
        if: matrix.part == 'direct'
        run: scripts/dev pytest tests/compare --ignore=tests/compare/direct --ignore=tests/compare/test_compare.py
      - name: Compare affected areas or every area after branch updates
        if: matrix.part == 'areas'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          selection=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            selection=(--base "$BASE_SHA")
          fi
          .venv/bin/python tests/compare/select_lists.py "${selection[@]}" > "$RUNNER_TEMP/comparison-lists"
          .venv/bin/python - <<'PYTHON'
          from collections import Counter
          import os
          from pathlib import Path

          shards = (
              (
                  "unit-04.authority.json",
                  "unit-04.json",
                  "unit-04.populated.json",
                  "unit-08.starts.json",
                  "unit-12.measures-datasets.json",
                  "unit-15.notices.json",
                  "unit-15.queue.json",
                  "unit-15.real-core-reruns.unit-07.complete.json",
                  "unit-15.real-core-reruns.unit-07.links-accepted.json",
                  "unit-15.real-core-reruns.unit-07.links-edited.json",
                  "unit-15.real-core-reruns.unit-08.wakes.json",
                  "unit-15.real-core-reruns.unit-09.disabled.json",
                  "unit-15.real-core-reruns.unit-10.notifications.json",
                  "unit-15.real-core-reruns.unit-11.credential-metadata.json",
                  "unit-15.real-core-reruns.unit-11.files.json",
                  "unit-15.real-core-reruns.unit-11.foundation.json",
                  "unit-15.real-core-reruns.unit-11.manager-lifecycle.json",
                  "unit-15.real-core-reruns.unit-11.origin.json",
                  "unit-15.real-core-reruns.unit-11.ranges.json",
                  "unit-15.real-core-reruns.unit-12.goals.json",
                  "unit-15.routes.json",
                  "unit-15b.receipts.json",
                  "unit-15b.review.json",
                  "unit-19.uploads.json",
                  "unit-20-commands.work.json",
              ),
              (
                  "unit-01.json",
                  "unit-05.json",
                  "unit-06.json",
                  "unit-13.schedule.json",
                  "unit-13.sources.json",
                  "unit-14.json",
                  "unit-15.asks.json",
                  "unit-15.closures.json",
                  "unit-15.models.json",
                  "unit-15.publication.json",
                  "unit-15.real-core-reruns.unit-07.lifecycle.json",
                  "unit-15.real-core-reruns.unit-07.links-pending.json",
                  "unit-15.real-core-reruns.unit-07.links-rejected.json",
                  "unit-15.real-core-reruns.unit-08.delivery.json",
                  "unit-15.real-core-reruns.unit-08.managers.json",
                  "unit-15.real-core-reruns.unit-08.starts.json",
                  "unit-15.real-core-reruns.unit-09.json",
                  "unit-15.real-core-reruns.unit-11.credentials.json",
                  "unit-15.real-core-reruns.unit-11.preview-ingress.json",
                  "unit-15.real-core-reruns.unit-11.previews.json",
                  "unit-15.real-core-reruns.unit-12.measures-datasets.json",
                  "unit-15.retry.json",
                  "unit-15.sessions.json",
                  "unit-15.wire.json",
                  "unit-19.backends.json",
                  "unit-19.credentials.json",
                  "unit-20-commands.domain.json",
                  "unit-21.http.json",
              ),
          )

          inventory = {path.name for path in Path("tests/compare/lists").glob("unit-*.json")}
          counts = Counter(name for shard in shards for name in shard)
          missing = sorted(inventory - counts.keys())
          duplicate = sorted(name for name, count in counts.items() if count > 1)
          unknown = sorted(counts.keys() - inventory)
          if missing or duplicate or unknown:
              raise SystemExit(
                  f"Invalid comparison shards: missing={missing}, duplicate={duplicate}, unknown={unknown}"
              )

          output = Path(os.environ["RUNNER_TEMP"])
          selected = (output / "comparison-lists").read_text().splitlines()
          known_paths = {f"tests/compare/lists/{name}" for name in inventory}
          if set(selected) - known_paths:
              raise SystemExit(f"Unknown selected lists: {sorted(set(selected) - known_paths)}")
          for number, names in enumerate(shards, start=1):
              paths = [path for path in selected if Path(path).name in names]
              (output / f"comparison-lists-{number}").write_text("".join(f"{path}\n" for path in paths))
          PYTHON
          comparison_tmp=$(.venv/bin/python -c 'import tempfile; print(tempfile.gettempdir())')
          run_shard() {
            local shard="$1"
            local port_start=$((10000 * shard))
            local port_end=$((10000 * (shard + 1)))
            local lists=() arguments=()
            mapfile -t lists < "$RUNNER_TEMP/comparison-lists-$shard"
            if [[ ${#lists[@]} -eq 0 ]]; then
              echo "Comparison shard $shard has no selected lists."
              return 0
            fi
            for list in "${lists[@]}"; do
              arguments+=(--compare-list "$list")
            done
            PANELS_TEST_PORT_RANGE="$port_start:$port_end" \
              scripts/dev pytest tests/compare/test_compare.py "${arguments[@]}" \
              --basetemp "$comparison_tmp/comparison-shard-$shard-tmp" \
              --compare-report-dir "$RUNNER_TEMP/comparison"
          }
          run_shard 1 &
          first_pid=$!
          run_shard 2 &
          second_pid=$!
          status=0
          wait "$first_pid" || status=$?
          wait "$second_pid" || status=$?
          exit "$status"
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comparison-evidence-node-${{ matrix.node }}-${{ matrix.part }}
          path: ${{ runner.temp }}/comparison
          if-no-files-found: ignore

  browser:
    name: Browser gates (${{ matrix.backend }}, Node 22)
    # Browser gates run after merge and on manual runs, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: ['python', 'typescript']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up and run isolated browser gates
        env:
          BROWSER_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          browser_root="$RUNNER_TEMP/browser-$BROWSER_BACKEND"
          browser_evidence="$RUNNER_TEMP/browser-evidence-$BROWSER_BACKEND"
          mkdir -p "$browser_root"/{home,tmp,config,cache,data,state,runtime,ms-playwright} \
            "$browser_evidence"/{success,html,failure}
          browser_environment=()
          for browser_env_key in $(compgen -e); do
            case "$browser_env_key" in
              PLAN_*|PANELS_*|CODEX_*|HERMES_*|CLAUDE_*|ANTHROPIC_*|OPENAI_*|AZURE_OPENAI_*|GEMINI_*|GOOGLE_APPLICATION_CREDENTIALS|*_HOME|*_CONFIG_DIR|*_DATA_DIR|*_STATE_DIR|*_CACHE_DIR|XDG_*|HUGGINGFACE_HUB_CACHE|TRANSFORMERS_CACHE|PLAYWRIGHT_*|PYTEST_*|PYTHONHOME|PYTHONPATH|NODE_OPTIONS|NODE_PATH|PIP_*|npm_config_*|NPM_CONFIG_*|BASH_ENV|ENV|CDPATH|VIRTUAL_ENV|HOME|TMPDIR|TMP|TEMP)
                browser_environment+=(-u "$browser_env_key")
                ;;
            esac
          done
          env "${browser_environment[@]}" \
            HOME="$browser_root/home" \
            TMPDIR="$browser_root/tmp" TMP="$browser_root/tmp" TEMP="$browser_root/tmp" \
            XDG_CONFIG_HOME="$browser_root/config" XDG_CACHE_HOME="$browser_root/cache" \
            XDG_DATA_HOME="$browser_root/data" XDG_STATE_HOME="$browser_root/state" \
            XDG_RUNTIME_DIR="$browser_root/runtime" \
            PLAYWRIGHT_BROWSERS_PATH="$browser_root/ms-playwright" \
            PANELS_TEST_SERVER_BACKEND="$BROWSER_BACKEND" \
            PANELS_UI_PROOF_DIR="$browser_evidence/success" \
            PANELS_TICKET_EVIDENCE_DIR="$browser_evidence/html" \
            PANELS_E2E_FAILURE_DIR="$browser_evidence/failure" \
            BROWSER_EVIDENCE_DIR="$browser_evidence" \
            bash --noprofile --norc -euo pipefail <<'BROWSER' 2>&1 | tee "$browser_evidence/job.log"
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config build-essential ffmpeg
          scripts/dev setup
          scripts/dev check-node web
          (cd web && node node_modules/vite/bin/vite.js build)
          .venv/bin/python -m playwright install --with-deps chromium

          browser_cases=(
            'tests/e2e/test_ticket_conversation_shared_behaviors.py::test_private_credential_save_survives_reload_and_reaches_the_actual_wire[chromium]'
            'tests/e2e/test_conversation_video_upload.py::test_video_upload_early_send_and_native_range_playback[chromium]'
            'tests/e2e/test_conversation_signals.py::test_exact_conversation_signals_cross_runtime_stream_and_surfaces[chromium-desktop]'
            'tests/e2e/test_conversation_signals.py::test_combined_review_approval_reply_and_bounded_read_reach_canonical_writers[chromium]'
            'tests/e2e/test_conversation_signals.py::test_history_refused_row_keeps_unread_credit_until_latest_delivery[chromium]'
            'tests/e2e/test_ticket_conversation_shared_behaviors.py::test_agent_questions_survive_reload_submit_as_one_map_and_replay_answers[chromium]'
            'tests/e2e/test_ticket_conversation_shared_behaviors.py::test_canonical_queue_writes_refresh_the_mounted_pane[chromium]'
            'tests/e2e/test_ticket_conversation_shared_behaviors.py::test_owner_send_lands_at_the_end_of_the_conversation_not_the_retained_window[chromium]'
            'tests/e2e/test_compact_approval.py::test_shared_compact_card_real_transaction_and_stale_revision[chromium-ticket]'
            'tests/e2e/test_ticket_lifecycle_browser.py::test_ticket_backlog_resume_and_settled_discovery[chromium]'
            'tests/e2e/test_ticket_list_first_draw.py::test_ticket_lists_arrive_settled_when_switching_pages[chromium]'
            'tests/e2e/test_orchestrator_rail.py::test_settle_reopen_keeps_outstanding_work_and_worker_address[chromium]'
            'tests/e2e/test_ticket_file_previews.py::test_html_artifact_interacts_loads_sibling_assets_and_refreshes_in_place[chromium]'
            'tests/e2e/test_goals_browser.py::test_goal_page_persistence_external_refresh_and_owned_conversation[chromium]'
            'tests/e2e/test_goal_holders_browser.py::test_goal_promotion_and_stable_url_share_manager_name[chromium]'
            'tests/e2e/test_goal_holders_browser.py::test_leaving_a_goal_manager_with_text_blocks_opens_each_next_page[chromium]'
            'tests/e2e/test_live_update.py::test_composing_survives_a_change_to_the_same_ticket'
            'tests/e2e/test_ticket_file_previews.py::test_a_video_preview_shows_a_poster_then_plays_and_seeks'
            'tests/e2e/test_goals_browser.py::test_formula_expectation_projection_and_correction_reach_mounted_chart'
          )
          cli_plugin=()
          if [[ "$PANELS_TEST_SERVER_BACKEND" == typescript ]]; then
            cli_plugin=(-p tests.compare.direct.unit20_e2e_cli)
          fi
          scripts/dev pytest "${cli_plugin[@]}" "${browser_cases[@]}" --browser chromium \
            --basetemp "$TMPDIR/pytest" --junitxml "$BROWSER_EVIDENCE_DIR/results.xml"
          BROWSER
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ matrix.backend }}-node-22
          path: ${{ runner.temp }}/browser-evidence-${{ matrix.backend }}
          if-no-files-found: warn
