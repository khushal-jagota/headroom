name: Publish TypeScript server release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  linux:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.app.outputs.artifact-id }}
      build_artifact_id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native tools and the admission host Node
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'const fs=require("node:fs");if(process.platform!=="linux"||process.arch!=="x64"||!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node)||fs.realpathSync(process.execPath)!==process.argv[1])throw Error("Selected Linux Node22 >=22.18 is required in admission HOST_PATH")' "$selected_node"
      - name: Build, seal, admit, and boot the exact Linux archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" \
            XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$private/cache/pip" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'PUBLISH'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          scripts/dev npm --prefix server ci
          node --input-type=module -e 'import{writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT;writeFileSync(r+"/build-request.json",JSON.stringify({source_root:process.env.GITHUB_WORKSPACE,requested_sha:process.env.GITHUB_SHA,output_directory:r+"/linux",public_cli_entrypoint:"server/cli/main.ts"}));'
          node server/environments/release/publication_main.ts "$PUBLICATION_ROOT/build-request.json"
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT,b=JSON.parse(readFileSync(r+"/linux/linux-publication-build.json","utf8"));writeFileSync(r+"/boot-request.json",JSON.stringify({archive_path:r+"/linux/panels-app.tar.gz",archive_sha256:b.archive.sha256,requested_sha:process.env.GITHUB_SHA,work_root:r+"/boot"}));'
          node server/environments/release/publication_boot_main.ts "$PUBLICATION_ROOT/boot-request.json"
          cp "$PUBLICATION_ROOT/boot/boot-proof.json" "$PUBLICATION_ROOT/linux/boot-proof.json"
          PUBLISH
      - name: Upload the checked Linux archive
        id: app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-app
          path: ${{ runner.temp }}/panels-publication/linux/panels-app.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Linux build, license, and boot evidence
        id: build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-build
          path: ${{ runner.temp }}/panels-publication/linux/*.json
          if-no-files-found: error
          retention-days: 30

  linux-executor:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.executor.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native tools and the admission host Node
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'const fs=require("node:fs");if(process.platform!=="linux"||process.arch!=="x64"||!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node)||fs.realpathSync(process.execPath)!==process.argv[1])throw Error("Selected Linux Node22 >=22.18 is required in admission HOST_PATH")' "$selected_node"
      - name: Build and prove the relocated Linux executor archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-linux-executor-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" \
            XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$private/cache/pip" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'PUBLISH'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          scripts/dev npm --prefix server ci
          node --input-type=module -e 'import{writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT;writeFileSync(r+"/build-request.json",JSON.stringify({source_root:process.env.GITHUB_WORKSPACE,requested_sha:process.env.GITHUB_SHA,output_directory:r+"/linux-executor"}));'
          node server/environments/linux_executor/build_main.ts "$PUBLICATION_ROOT/build-request.json"
          PUBLISH
      - name: Upload only the checked Linux executor archive and receipt
        id: executor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-linux-executor
          path: |
            ${{ runner.temp }}/panels-linux-executor-publication/linux-executor/panels-linux-executor.tar.gz
            ${{ runner.temp }}/panels-linux-executor-publication/linux-executor/linux-executor-publication.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  mac:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.mac.outputs.artifact-id }}
      mac_home_artifact_id: ${{ steps.mac_home.outputs.artifact-id }}
      mac_home_build_artifact_id: ${{ steps.mac_home_build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native Mac build prerequisites
        run: brew install icu4c pkgconf
      - name: Install the launcher build's dependencies without the signing secrets
        run: npm ci --prefix server --omit=dev
      - name: Build an ad-hoc launcher for verification
        run: |
          mkdir -p "$RUNNER_TEMP/panels-launcher"
          node server/executor/mac/packaging/launcher_main.ts --output "$RUNNER_TEMP/panels-launcher/Panels TypeScript.app" --sign -
      - name: Build and prove the sealed TypeScript Mac runtime
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-mac-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data,logs,backups,workspace,scratch,runtime,tmp,source}
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" LAUNCHER_APP="$RUNNER_TEMP/panels-launcher/Panels TypeScript.app" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" npm_config_cache="$private/cache/npm" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_APP_ROOT="$private/app" PLAN_DATA_DIR="$private/data" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_SCRATCH_ROOT="$private/scratch" \
            PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=0 \
            bash --noprofile --norc -euo pipefail <<'MAC'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$PUBLICATION_ROOT/source"
          NODE_ENV=production "$PUBLICATION_ROOT/source/scripts/dev" npm --prefix server ci
          mkdir "$PUBLICATION_ROOT/source-repeat"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$PUBLICATION_ROOT/source-repeat"
          NODE_ENV=production "$PUBLICATION_ROOT/source-repeat/scripts/dev" npm --prefix server ci
          node_distribution=$(node --input-type=module -e 'import{realpathSync}from"node:fs";import{dirname}from"node:path";console.log(dirname(dirname(realpathSync(process.execPath))));')
          node "$PUBLICATION_ROOT/source/server/executor/mac/packaging/publication_main.ts" \
            --source "$PUBLICATION_ROOT/source" --node-distribution "$node_distribution" \
            --node-modules "$PUBLICATION_ROOT/source/server/node_modules" \
            --repeat-node-modules "$PUBLICATION_ROOT/source-repeat/server/node_modules" \
            --output "$PUBLICATION_ROOT/mac" --revision "$GITHUB_SHA" \
            --launcher-app "$LAUNCHER_APP" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          MAC
      - name: Upload the checked native Mac runtime and receipt
        id: mac
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-runtime
          path: |
            ${{ runner.temp }}/panels-mac-publication/mac/panels-mac-runtime.tar.gz
            ${{ runner.temp }}/panels-mac-publication/mac/mac-runtime-publication.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Exercise the signature-only promotion on disposable bytes
        run: |
          node server/environments/release/promote_mac.ts \
            "$RUNNER_TEMP/panels-mac-publication/mac" "$RUNNER_TEMP/test-signed" - \
            "$RUNNER_TEMP/panels-launcher/Panels TypeScript.app"

      - name: Preserve the Mac build record and native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-typescript-mac-build
          path: |
            ${{ runner.temp }}/launcher-codesign.txt
            ${{ runner.temp }}/panels-mac-publication/mac/build.json
            ${{ runner.temp }}/panels-mac-publication/mac/proof-work/
          if-no-files-found: warn
          retention-days: 30

      - name: Build and prove the sealed Darwin home archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-mac-home-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data,logs,backups,workspace,scratch,runtime,tmp,inputs}
          env -i PATH="$PATH" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" \
            CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" XDG_DATA_HOME="$private/data" \
            XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" HOMEBREW_NO_AUTO_UPDATE=1 \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_APP_ROOT="$private/app" \
            PLAN_DATA_DIR="$private/data" PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" \
            PLAN_CREDENTIAL_KEY_PATH="$private/data/key" PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=0 \
            bash --noprofile --norc -euo pipefail <<'MAC_HOME'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$PUBLICATION_ROOT/inputs"
          NODE_ENV=production "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix server ci
          NODE_ENV=production "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix agent_backends install
          "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix web ci
          "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix web run build
          scripts/dev npm --prefix server ci
          node server/environments/release/mac_home_main.ts \
            --source "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" --output "$PUBLICATION_ROOT/home-release" \
            --node-modules "$PUBLICATION_ROOT/inputs/server/node_modules" \
            --agent-backends "$PUBLICATION_ROOT/inputs/agent_backends" --web-dist "$PUBLICATION_ROOT/inputs/web/dist" \
            --public-cli-entrypoint server/cli/main.ts
          MAC_HOME
      - name: Upload the checked Darwin home archive
        id: mac_home
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-home
          path: ${{ runner.temp }}/panels-mac-home-publication/home-release/panels-app.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Darwin home build, admission, and boot evidence
        id: mac_home_build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-home-build
          path: ${{ runner.temp }}/panels-mac-home-publication/home-release/*.json
          if-no-files-found: error
          retention-days: 30

  machine-compatibility:
    name: Historical machine compatibility (${{ matrix.platform }})
    needs: [mac, linux-executor]
    if: ${{ !cancelled() && (needs.mac.result == 'success' || needs.linux-executor.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare Linux native tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          selected_node=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
      - name: Prepare Darwin native tools
        if: matrix.platform == 'darwin'
        run: brew install icu4c pkgconf
      - name: Restore digest-pinned oldest machine archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/machine-baseline-cache
          key: machine-baseline-${{ matrix.platform }}-${{ hashFiles('server/environments/release/machine_baselines.json') }}
      - name: Download the candidate and prove historical compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ matrix.platform == 'linux' && needs.linux-executor.outputs.artifact_id || needs.mac.outputs.artifact_id }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/machine-compatibility/tmp"
          export TMPDIR="$RUNNER_TEMP/machine-compatibility/tmp"
          npm ci --prefix server
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/machine-compatibility/candidate.zip"
          node --input-type=module <<'REQUEST'
          import { writeFileSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          writeFileSync(root + '/machine-compatibility/request.json', JSON.stringify({candidate_zip:root + '/machine-compatibility/candidate.zip', output_directory:root + '/machine-compatibility/tmp/proof', cache_directory:root + '/machine-baseline-cache'}));
          REQUEST
          if [ "$RUNNER_OS" = Linux ]; then
            systemd-run --user --scope --quiet -p Delegate=yes -- \
              node server/environments/release/machine_compatibility_main.ts "$RUNNER_TEMP/machine-compatibility/request.json"
          else
            node server/environments/release/machine_compatibility_main.ts "$RUNNER_TEMP/machine-compatibility/request.json"
          fi
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-machine-compatibility-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/machine-compatibility/tmp/proof/machine-compatibility-*.json
            ${{ runner.temp }}/machine-compatibility/tmp/proof/failure.txt
            ${{ runner.temp }}/machine-compatibility/tmp/proof/server-failure.json
            ${{ runner.temp }}/machine-compatibility/tmp/proof/*-stdout.log
            ${{ runner.temp }}/machine-compatibility/tmp/proof/*-stderr.log
            ${{ runner.temp }}/machine-compatibility/tmp/proof/*-codex.jsonl
            ${{ runner.temp }}/machine-compatibility/tmp/proof/*-claude.jsonl
          if-no-files-found: error
          retention-days: 30

  linux-upgrade:
    needs: [linux, linux-executor]
    uses: ./.github/workflows/installed-release-upgrade.yml
    with:
      system: linux
      home_artifact_id: ${{ needs.linux.outputs.artifact_id }}
      home_build_artifact_id: ${{ needs.linux.outputs.build_artifact_id }}
      machine_artifact_id: ${{ needs.linux-executor.outputs.artifact_id }}

  mac-upgrade:
    needs: mac
    uses: ./.github/workflows/installed-release-upgrade.yml
    with:
      system: darwin
      home_artifact_id: ${{ needs.mac.outputs.mac_home_artifact_id }}
      home_build_artifact_id: ${{ needs.mac.outputs.mac_home_build_artifact_id }}
      machine_artifact_id: ${{ needs.mac.outputs.artifact_id }}

  server-suite:
    uses: ./.github/workflows/typescript-backend-server.yml

  web-suite:
    uses: ./.github/workflows/development-tools.yml

  mac-machine-suite:
    needs: mac
    with:
      machine_artifact_id: ${{ needs.mac.outputs.artifact_id }}
    uses: ./.github/workflows/typescript-mac-executor.yml

  first-install:
    needs: [linux, linux-executor, mac]
    with:
      use_release_packages: true
    uses: ./.github/workflows/typescript-first-install.yml

  release-gate:
    name: Release qualification
    needs: [linux, mac, linux-executor, machine-compatibility, linux-upgrade, mac-upgrade, server-suite, web-suite, mac-machine-suite, first-install]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every candidate build, compatibility and installed upgrade
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the publisher refuses red, canceled and stale proofs
        run: python3 server/environments/release/testing/check_promotion_test.py
      - name: Bind the successful qualification to the tested merge tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 server/environments/release/testing/check_promotion.py record > "$RUNNER_TEMP/qualified.json"
      - name: Preserve the successful PR receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-merge-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified.json
          if-no-files-found: error
          retention-days: 30

  select:
    name: Select packages from the qualified PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      qualified: ${{ steps.select.outputs.qualified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 server/environments/release/testing/check_promotion.py

  sign:
    name: Sign the qualified launcher and verify the installed swap
    needs: select
    runs-on: macos-15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix server --omit=dev
      - name: Download the exact qualified Mac runtime before opening the keychain
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_ID: ${{ fromJSON(needs.select.outputs.qualified).artifacts.mac }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MAC_ID" --jq '.digest' > "$RUNNER_TEMP/qualified-digest"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MAC_ID/zip" > "$RUNNER_TEMP/qualified.zip"
          expected=$(cat "$RUNNER_TEMP/qualified-digest")
          test "sha256:$(shasum -a 256 "$RUNNER_TEMP/qualified.zip" | awk '{print $1}')" = "$expected"
          mkdir "$RUNNER_TEMP/qualified"
          for member in panels-mac-runtime.tar.gz mac-runtime-publication.json; do
            unzip -p "$RUNNER_TEMP/qualified.zip" "$member" > "$RUNNER_TEMP/qualified/$member"
          done
      - name: Fetch the previous published launcher
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(node server/environments/release/previous_launcher_main.ts "$RUNNER_TEMP/previous")
          echo "app=$previous" >> "$GITHUB_OUTPUT"
      - name: Sign, notarize, compare and exercise the qualified launcher
        env:
          PREVIOUS_APP: ${{ steps.previous.outputs.app }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/launcher-signing.keychain-db"
          password=$(openssl rand -hex 24)
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$RUNNER_TEMP/developer-id.p12" "$NOTARY_KEY_PATH"' EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$MAC_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          unset MAC_DEVELOPER_ID_P12_BASE64 MAC_DEVELOPER_ID_P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')
          test -n "$identity"
          printf '%s\n' "$APPLE_NOTARY_API_KEY_P8" > "$NOTARY_KEY_PATH"
          unset APPLE_NOTARY_API_KEY_P8
          node server/environments/release/promote_mac.ts "$RUNNER_TEMP/qualified" "$RUNNER_TEMP/signed" "$identity" "$PREVIOUS_APP"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-signed-mac-runtime
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  receipt:
    needs: [select, sign, server-suite, web-suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install receipt validation tools
        run: npm ci --prefix server
      - name: Bind the selected ZIPs to GitHub and the signed launcher proof
        env:
          QUALIFIED: ${{ needs.select.outputs.qualified }}
          SIGNED_MAC_ID: ${{ needs.sign.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 server/environments/release/prepare_promoted_receipt.py
          node server/environments/release/publication_receipt_main.ts "$RUNNER_TEMP/panels-publication/receipt-request.json"
      - name: Upload the complete publication receipt and audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-proof
          path: ${{ runner.temp }}/panels-publication/receipt/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the same checked ZIPs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node server/environments/release/github_publication_main.ts "$RUNNER_TEMP/panels-publication"
