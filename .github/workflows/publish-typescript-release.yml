name: Publish TypeScript server release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.app.outputs.artifact-id }}
      build_artifact_id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native tools and the admission host Node
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'const fs=require("node:fs");if(process.platform!=="linux"||process.arch!=="x64"||!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node)||fs.realpathSync(process.execPath)!==process.argv[1])throw Error("Selected Linux Node22 >=22.18 is required in admission HOST_PATH")' "$selected_node"
      - name: Build, seal, admit, and boot the exact Linux archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" \
            XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$private/cache/pip" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'PUBLISH'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          scripts/dev npm --prefix server ci
          node --input-type=module -e 'import{writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT;writeFileSync(r+"/build-request.json",JSON.stringify({source_root:process.env.GITHUB_WORKSPACE,requested_sha:process.env.GITHUB_SHA,output_directory:r+"/linux",public_cli_entrypoint:"server/cli/main.ts"}));'
          node server/environments/release/publication_main.ts "$PUBLICATION_ROOT/build-request.json"
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT,b=JSON.parse(readFileSync(r+"/linux/linux-publication-build.json","utf8"));writeFileSync(r+"/boot-request.json",JSON.stringify({archive_path:r+"/linux/panels-app.tar.gz",archive_sha256:b.archive.sha256,requested_sha:process.env.GITHUB_SHA,work_root:r+"/boot"}));'
          node server/environments/release/publication_boot_main.ts "$PUBLICATION_ROOT/boot-request.json"
          cp "$PUBLICATION_ROOT/boot/boot-proof.json" "$PUBLICATION_ROOT/linux/boot-proof.json"
          PUBLISH
      - name: Upload the checked Linux archive
        id: app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-app
          path: ${{ runner.temp }}/panels-publication/linux/panels-app.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Linux build, license, and boot evidence
        id: build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-build
          path: ${{ runner.temp }}/panels-publication/linux/*.json
          if-no-files-found: error
          retention-days: 30

  linux-executor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.executor.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native tools and the admission host Node
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'const fs=require("node:fs");if(process.platform!=="linux"||process.arch!=="x64"||!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node)||fs.realpathSync(process.execPath)!==process.argv[1])throw Error("Selected Linux Node22 >=22.18 is required in admission HOST_PATH")' "$selected_node"
      - name: Build and prove the relocated Linux executor archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-linux-executor-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" \
            XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$private/cache/pip" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'PUBLISH'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          scripts/dev npm --prefix server ci
          node --input-type=module -e 'import{writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT;writeFileSync(r+"/build-request.json",JSON.stringify({source_root:process.env.GITHUB_WORKSPACE,requested_sha:process.env.GITHUB_SHA,output_directory:r+"/linux-executor"}));'
          node server/environments/linux_executor/build_main.ts "$PUBLICATION_ROOT/build-request.json"
          PUBLISH
      - name: Upload only the checked Linux executor archive and receipt
        id: executor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-linux-executor
          path: |
            ${{ runner.temp }}/panels-linux-executor-publication/linux-executor/panels-linux-executor.tar.gz
            ${{ runner.temp }}/panels-linux-executor-publication/linux-executor/linux-executor-publication.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  mac:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.mac.outputs.artifact-id }}
      mac_home_artifact_id: ${{ steps.mac_home.outputs.artifact-id }}
      mac_home_build_artifact_id: ${{ steps.mac_home_build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native Mac build prerequisites
        run: brew install icu4c pkgconf
      - name: Build and prove the sealed TypeScript Mac runtime
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-mac-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data,logs,backups,workspace,scratch,runtime,tmp,source}
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" npm_config_cache="$private/cache/npm" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_APP_ROOT="$private/app" PLAN_DATA_DIR="$private/data" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_SCRATCH_ROOT="$private/scratch" \
            PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=0 \
            bash --noprofile --norc -euo pipefail <<'MAC'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$PUBLICATION_ROOT/source"
          NODE_ENV=production "$PUBLICATION_ROOT/source/scripts/dev" npm --prefix server ci
          node_distribution=$(node --input-type=module -e 'import{realpathSync}from"node:fs";import{dirname}from"node:path";console.log(dirname(dirname(realpathSync(process.execPath))));')
          node "$PUBLICATION_ROOT/source/server/executor/mac/packaging/publication_main.ts" \
            --source "$PUBLICATION_ROOT/source" --node-distribution "$node_distribution" \
            --node-modules "$PUBLICATION_ROOT/source/server/node_modules" \
            --output "$PUBLICATION_ROOT/mac" --revision "$GITHUB_SHA" \
            --home "$PUBLICATION_ROOT/home" --executor-id release-package \
            --server-url https://panels.invalid --backend-path /usr/bin:/bin \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          MAC
      - name: Upload the checked native Mac runtime and receipt
        id: mac
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-runtime
          path: |
            ${{ runner.temp }}/panels-mac-publication/mac/panels-mac-runtime.tar.gz
            ${{ runner.temp }}/panels-mac-publication/mac/mac-runtime-publication.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Preserve Mac installation assets and native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-typescript-mac-installation
          path: |
            ${{ runner.temp }}/panels-mac-publication/mac/assets/
            ${{ runner.temp }}/panels-mac-publication/mac/INSTALLATION.md
            ${{ runner.temp }}/panels-mac-publication/mac/build.json
            ${{ runner.temp }}/panels-mac-publication/mac/proof-work/
          if-no-files-found: warn
          retention-days: 30

      - name: Build and prove the sealed Darwin home archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-mac-home-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data,logs,backups,workspace,scratch,runtime,tmp,inputs}
          env -i PATH="$PATH" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" \
            CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" XDG_DATA_HOME="$private/data" \
            XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" HOMEBREW_NO_AUTO_UPDATE=1 \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_APP_ROOT="$private/app" \
            PLAN_DATA_DIR="$private/data" PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" \
            PLAN_CREDENTIAL_KEY_PATH="$private/data/key" PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=0 \
            bash --noprofile --norc -euo pipefail <<'MAC_HOME'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$PUBLICATION_ROOT/inputs"
          NODE_ENV=production "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix server ci
          NODE_ENV=production "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix agent_backends install
          "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix web ci
          "$PUBLICATION_ROOT/inputs/scripts/dev" npm --prefix web run build
          scripts/dev npm --prefix server ci
          node server/environments/release/mac_home_main.ts \
            --source "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" --output "$PUBLICATION_ROOT/home-release" \
            --node-modules "$PUBLICATION_ROOT/inputs/server/node_modules" \
            --agent-backends "$PUBLICATION_ROOT/inputs/agent_backends" --web-dist "$PUBLICATION_ROOT/inputs/web/dist" \
            --public-cli-entrypoint server/cli/main.ts
          MAC_HOME
      - name: Upload the checked Darwin home archive
        id: mac_home
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-home
          path: ${{ runner.temp }}/panels-mac-home-publication/home-release/panels-app.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Darwin home build, admission, and boot evidence
        id: mac_home_build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-home-build
          path: ${{ runner.temp }}/panels-mac-home-publication/home-release/*.json
          if-no-files-found: error
          retention-days: 30

  receipt:
    needs: [linux, mac, linux-executor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.linux.result == 'success' && needs.mac.result == 'success' && needs.linux-executor.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Expose the selected host runtimes in the fixed command PATH
        run: |
          set -euo pipefail
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'if(!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node))throw Error("Node22 >=22.18 is required")'
      - name: Download Darwin home artifacts for the shared receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAC_HOME_ARTIFACT_ID: ${{ needs.mac.outputs.mac_home_artifact_id }}
          MAC_HOME_BUILD_ARTIFACT_ID: ${{ needs.mac.outputs.mac_home_build_artifact_id }}
          MAC_HOME_BUILD_RESULT: ${{ needs.mac.result }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir -p "$private/home" "$private/tmp" "$private/inputs"
          env -i PATH="$PATH" LANG=C.UTF-8 HOME="$private/home" TMPDIR="$private/tmp" \
            GITHUB_TOKEN="$GITHUB_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" PUBLICATION_ROOT="$private" \
            MAC_HOME_ARTIFACT_ID="$MAC_HOME_ARTIFACT_ID" MAC_HOME_BUILD_ARTIFACT_ID="$MAC_HOME_BUILD_ARTIFACT_ID" \
            MAC_HOME_BUILD_RESULT="$MAC_HOME_BUILD_RESULT" node --input-type=module <<'MAC_HOME_INPUTS'
          import { createWriteStream, writeFileSync } from 'node:fs';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          const e = process.env, root = e.PUBLICATION_ROOT;
          for (const [name, id] of [['mac-home', e.MAC_HOME_ARTIFACT_ID], ['mac-home-build', e.MAC_HOME_BUILD_ARTIFACT_ID]]) {
            if (!/^[1-9][0-9]*$/.test(id)) throw Error('Invalid Darwin home artifact identity');
            const signal = AbortSignal.timeout(600_000);
            const response = await fetch(`https://api.github.com/repos/${e.GITHUB_REPOSITORY}/actions/artifacts/${id}/zip`, { headers: { Authorization: `Bearer ${e.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' }, signal });
            if (!response.ok || response.body === null) throw Error('Darwin home artifact download failed');
            await pipeline(Readable.fromWeb(response.body), createWriteStream(`${root}/inputs/${name}.zip`, { flags: 'wx', mode: 0o600 }), { signal });
          }
          writeFileSync(root + '/mac-home-receipt-options.json', JSON.stringify({ mac_home_artifact_zip: root + '/inputs/mac-home.zip', mac_home_build_artifact_zip: root + '/inputs/mac-home-build.zip', mac_home_artifact_id: e.MAC_HOME_ARTIFACT_ID, mac_home_build_artifact_id: e.MAC_HOME_BUILD_ARTIFACT_ID, mac_home_build_result: e.MAC_HOME_BUILD_RESULT }) + '\n', { flag: 'wx', mode: 0o600 });
          MAC_HOME_INPUTS
      - name: Download raw artifact ZIPs and write the source-bound receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_ARTIFACT_ID: ${{ needs.linux.outputs.artifact_id }}
          BUILD_ARTIFACT_ID: ${{ needs.linux.outputs.build_artifact_id }}
          MAC_ARTIFACT_ID: ${{ needs.mac.outputs.artifact_id }}
          MAC_BUILD_RESULT: ${{ needs.mac.result }}
          LINUX_EXECUTOR_ARTIFACT_ID: ${{ needs.linux-executor.outputs.artifact_id }}
          LINUX_EXECUTOR_BUILD_RESULT: ${{ needs.linux-executor.result }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp,inputs}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_TOKEN="$GITHUB_TOKEN" APP_ARTIFACT_ID="$APP_ARTIFACT_ID" BUILD_ARTIFACT_ID="$BUILD_ARTIFACT_ID" MAC_ARTIFACT_ID="$MAC_ARTIFACT_ID" MAC_BUILD_RESULT="$MAC_BUILD_RESULT" \
            LINUX_EXECUTOR_ARTIFACT_ID="$LINUX_EXECUTOR_ARTIFACT_ID" LINUX_EXECUTOR_BUILD_RESULT="$LINUX_EXECUTOR_BUILD_RESULT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" \
            TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'RECEIPT'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          env -u GITHUB_TOKEN scripts/dev npm --prefix server ci
          node --input-type=module <<'JS'
          import { createWriteStream, writeFileSync } from 'node:fs';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          const e = process.env, root = e.PUBLICATION_ROOT;
          for (const [name, id] of [['app', e.APP_ARTIFACT_ID], ['build', e.BUILD_ARTIFACT_ID], ['mac', e.MAC_ARTIFACT_ID], ['linux-executor', e.LINUX_EXECUTOR_ARTIFACT_ID]]) {
            const signal = AbortSignal.timeout(600_000);
            const response = await fetch(`https://api.github.com/repos/${e.GITHUB_REPOSITORY}/actions/artifacts/${id}/zip`, { headers: { Authorization: `Bearer ${e.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' }, signal });
            if (!response.ok || response.body === null) throw Error('Raw artifact download failed');
            await pipeline(Readable.fromWeb(response.body), createWriteStream(`${root}/inputs/${name}.zip`, { flags: 'wx', mode: 0o600 }), { signal });
          }
          writeFileSync(root + '/receipt-request.json', JSON.stringify({ source_root: e.GITHUB_WORKSPACE, linux_artifact_zip: root + '/inputs/app.zip', linux_build_artifact_zip: root + '/inputs/build.zip', mac_artifact_zip: root + '/inputs/mac.zip', output_directory: root + '/receipt', artifact_id: e.APP_ARTIFACT_ID, linux_build_artifact_id: e.BUILD_ARTIFACT_ID, mac_artifact_id: e.MAC_ARTIFACT_ID, mac_build_result: e.MAC_BUILD_RESULT, linux_executor_artifact_zip: root + '/inputs/linux-executor.zip', linux_executor_artifact_id: e.LINUX_EXECUTOR_ARTIFACT_ID, linux_executor_build_result: e.LINUX_EXECUTOR_BUILD_RESULT }));
          JS
          node --input-type=module <<'MAC_HOME_RECEIPT'
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = process.env.PUBLICATION_ROOT, path = root + '/receipt-request.json';
          writeFileSync(path, JSON.stringify({ ...JSON.parse(readFileSync(path, 'utf8')), ...JSON.parse(readFileSync(root + '/mac-home-receipt-options.json', 'utf8')) }) + '\n');
          MAC_HOME_RECEIPT
          node server/environments/release/publication_receipt_main.ts "$PUBLICATION_ROOT/receipt-request.json"
          RECEIPT
      - name: Upload the complete publication receipt and audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-proof
          path: ${{ runner.temp }}/panels-publication/receipt/
          if-no-files-found: error
          retention-days: 30
