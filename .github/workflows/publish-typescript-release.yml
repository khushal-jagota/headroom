name: Publish TypeScript server release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.app.outputs.artifact-id }}
      build_artifact_id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare native tools and the admission host Node
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'const fs=require("node:fs");if(process.platform!=="linux"||process.arch!=="x64"||!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node)||fs.realpathSync(process.execPath)!==process.argv[1])throw Error("Selected Linux Node22 >=22.18 is required in admission HOST_PATH")' "$selected_node"
      - name: Build, seal, admit, and boot the exact Linux archive
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,home/.hermes,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" \
            HERMES_HOME="$private/home/.hermes" PLAN_HERMES_HOME="$private/home/.hermes" XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" \
            XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$private/cache/pip" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'PUBLISH'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          python3 -I -S -B scripts/development_safety/bootstrap.py npm --prefix server ci
          node --input-type=module -e 'import{writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT;writeFileSync(r+"/build-request.json",JSON.stringify({source_root:process.env.GITHUB_WORKSPACE,requested_sha:process.env.GITHUB_SHA,output_directory:r+"/linux",public_cli_entrypoint:"server/cli/main.ts"}));'
          node server/environments/release/publication_main.ts "$PUBLICATION_ROOT/build-request.json"
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const r=process.env.PUBLICATION_ROOT,b=JSON.parse(readFileSync(r+"/linux/linux-publication-build.json","utf8"));writeFileSync(r+"/boot-request.json",JSON.stringify({archive_path:r+"/linux/panels-app.tar.gz",archive_sha256:b.archive.sha256,requested_sha:process.env.GITHUB_SHA,work_root:r+"/boot"}));'
          node server/environments/release/publication_boot_main.ts "$PUBLICATION_ROOT/boot-request.json"
          cp "$PUBLICATION_ROOT/boot/boot-proof.json" "$PUBLICATION_ROOT/linux/boot-proof.json"
          PUBLISH
      - name: Optional installer smoke (server/tools/smoke.ts when present)
        if: hashFiles('server/tools/smoke.ts') != ''
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir "$private/boot/smoke-state"
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" HERMES_HOME="$private/home/.hermes" PLAN_HERMES_HOME="$private/home/.hermes" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_APP_ROOT="$private/boot/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_SCRATCH_ROOT="$private/scratch" \
            PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=0 \
            node server/tools/smoke.ts --app-root "$private/boot/app" --state-root "$private/boot/smoke-state"
      - name: Upload the checked Linux archive
        id: app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-app
          path: ${{ runner.temp }}/panels-publication/linux/panels-app.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Linux build, license, and boot evidence
        id: build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-build
          path: ${{ runner.temp }}/panels-publication/linux/*.json
          if-no-files-found: error
          retention-days: 30

  mac:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.mac.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare native Mac build prerequisites
        run: brew install icu4c pkgconf
      - name: Build the unchanged native Mac runtime and bind the attempt
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-mac-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,home/.hermes,config,cache,data,logs,backups,workspace,scratch,runtime,tmp}
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" HERMES_HOME="$private/home/.hermes" PLAN_HERMES_HOME="$private/home/.hermes" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_APP_ROOT="$private/app" PLAN_DATA_DIR="$private/data" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_SCRATCH_ROOT="$private/scratch" \
            PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=0 \
            bash --noprofile --norc -euo pipefail <<'MAC'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          python3 -I -S -B scripts/build_mac_runtime.py --source "$GITHUB_WORKSPACE" --output "$PUBLICATION_ROOT/mac" --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          node --input-type=module - "$PUBLICATION_ROOT/mac/mac-runtime-publication.json" "$GITHUB_RUN_ATTEMPT" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.argv[2], attempt = process.argv[3];
          if (/^[1-9][0-9]*$/.exec(attempt)?.[0] !== attempt) throw Error('Invalid publication attempt');
          const value = JSON.parse(readFileSync(path, 'utf8'), (_key, value, context) => typeof value === 'number' ? JSON.rawJSON(context.source) : value);
          value.run_attempt = attempt;
          writeFileSync(path, JSON.stringify(value) + '\n');
          JS
          MAC
      - name: Upload the checked native Mac runtime and receipt
        id: mac
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-mac-runtime
          path: ${{ runner.temp }}/panels-mac-publication/mac/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  receipt:
    needs: [linux, mac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.linux.result == 'success' && needs.mac.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Expose the selected host runtimes in the fixed command PATH
        run: |
          set -euo pipefail
          selected_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          selected_python=$(env -i PATH="$PATH" python3 -I -S -B -c 'import os,sys; print(os.path.realpath(sys.executable))')
          if [ "$selected_node" != /usr/local/bin/node ]; then sudo ln -sfn "$selected_node" /usr/local/bin/node; fi
          if [ "$selected_python" != /usr/local/bin/python3 ]; then sudo ln -sfn "$selected_python" /usr/local/bin/python3; fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node -e 'if(!/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node))throw Error("Node22 >=22.18 is required")'
      - name: Download raw artifact ZIPs and write the source-bound receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_ARTIFACT_ID: ${{ needs.linux.outputs.artifact_id }}
          BUILD_ARTIFACT_ID: ${{ needs.linux.outputs.build_artifact_id }}
          MAC_ARTIFACT_ID: ${{ needs.mac.outputs.artifact_id }}
          MAC_BUILD_RESULT: ${{ needs.mac.result }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/panels-publication"
          mkdir -p "$private"/{home/.codex,home/.claude,home/.hermes,config,cache,data/files,logs,backups,workspace,scratch,runtime,tmp,inputs}
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_TOKEN="$GITHUB_TOKEN" APP_ARTIFACT_ID="$APP_ARTIFACT_ID" BUILD_ARTIFACT_ID="$BUILD_ARTIFACT_ID" MAC_ARTIFACT_ID="$MAC_ARTIFACT_ID" MAC_BUILD_RESULT="$MAC_BUILD_RESULT" \
            PUBLICATION_ROOT="$private" HOME="$private/home" CODEX_HOME="$private/home/.codex" CLAUDE_CONFIG_DIR="$private/home/.claude" HERMES_HOME="$private/home/.hermes" PLAN_HERMES_HOME="$private/home/.hermes" \
            XDG_CONFIG_HOME="$private/config" XDG_CACHE_HOME="$private/cache" XDG_DATA_HOME="$private/data" XDG_STATE_HOME="$private/data" XDG_RUNTIME_DIR="$private/runtime" \
            TMPDIR="$private/tmp" TMP="$private/tmp" TEMP="$private/tmp" npm_config_cache="$private/cache/npm" PIP_CONFIG_FILE=/dev/null \
            PLAN_CONFIG_PATH="$private/config.yaml" PLAN_DB_PATH="$private/data/planner.sqlite" PLAN_DATA_DIR="$private/data" PLAN_APP_ROOT="$private/app" \
            PLAN_LOGS_DIR="$private/logs" PLAN_BACKUP_DIR="$private/backups" PLAN_WORKSPACE_ROOT="$private/workspace" PLAN_TICKET_FILES_DIR="$private/data/files" \
            PLAN_TICKET_SCRATCH_ROOT="$private/scratch" PLAN_TICKET_SCRATCH_DATABASE="$private/data/planner.sqlite" PLAN_CREDENTIAL_KEY_PATH="$private/data/key" \
            PLAN_DISPATCHER_LOCK_PATH="$private/runtime/dispatcher.lock" PLAN_SERVER_CONTROL_SOCKET="$private/runtime/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$private/runtime/lifecycle.lock" PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=0 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'RECEIPT'
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          env -u GITHUB_TOKEN python3 -I -S -B scripts/development_safety/bootstrap.py npm --prefix server ci
          node --input-type=module <<'JS'
          import { createWriteStream, writeFileSync } from 'node:fs';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          const e = process.env, root = e.PUBLICATION_ROOT;
          for (const [name, id] of [['app', e.APP_ARTIFACT_ID], ['build', e.BUILD_ARTIFACT_ID], ['mac', e.MAC_ARTIFACT_ID]]) {
            const signal = AbortSignal.timeout(600_000);
            const response = await fetch(`https://api.github.com/repos/${e.GITHUB_REPOSITORY}/actions/artifacts/${id}/zip`, { headers: { Authorization: `Bearer ${e.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' }, signal });
            if (!response.ok || response.body === null) throw Error('Raw artifact download failed');
            await pipeline(Readable.fromWeb(response.body), createWriteStream(`${root}/inputs/${name}.zip`, { flags: 'wx', mode: 0o600 }), { signal });
          }
          writeFileSync(root + '/receipt-request.json', JSON.stringify({ source_root: e.GITHUB_WORKSPACE, linux_artifact_zip: root + '/inputs/app.zip', linux_build_artifact_zip: root + '/inputs/build.zip', mac_artifact_zip: root + '/inputs/mac.zip', output_directory: root + '/receipt', artifact_id: e.APP_ARTIFACT_ID, linux_build_artifact_id: e.BUILD_ARTIFACT_ID, mac_artifact_id: e.MAC_ARTIFACT_ID, mac_build_result: e.MAC_BUILD_RESULT }));
          JS
          node server/environments/release/publication_receipt_main.ts "$PUBLICATION_ROOT/receipt-request.json"
          RECEIPT
      - name: Upload the complete publication receipt and audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-proof
          path: ${{ runner.temp }}/panels-publication/receipt/
          if-no-files-found: error
          retention-days: 30
