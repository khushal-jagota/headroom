name: TypeScript server foundation
on:
  pull_request:
    branches: [feature/typescript-backend]
  push:
    branches: [feature/typescript-backend]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: scripts/dev npm --prefix server ci
      - name: Check types
        run: |
          scripts/dev check-node server
          node server/node_modules/typescript/bin/tsc --noEmit -p server/tsconfig.json
      - name: Check foundation behavior
        run: |
          scripts/dev check-node server
          cd server
          node node_modules/vitest/vitest.mjs run
