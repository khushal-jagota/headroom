name: TypeScript server foundation
on:
  pull_request:
    branches: [staging, driver-model]
  push:
    branches: [staging, driver-model]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    strategy:
      # Pull requests, pushes and manual acceptance run only Node 22. The scheduled
      # run (against staging) keeps both versions.
      # The matrix itself shrinks, so no skipped entries
      # are left pending.
      matrix:
        node: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["22"]' || '["22", "24"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: scripts/dev npm --prefix server ci
      - name: Check new native-style violations
        if: matrix.node == '22'
        env:
          STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$STYLE_BASE" ] || ! git cat-file -e "$STYLE_BASE^{commit}" 2>/dev/null; then
            STYLE_BASE=$(git rev-parse HEAD~1)
          fi
          node server/tools/native_style.ts "$STYLE_BASE"
      - name: Check driver names stay in their packages
        if: matrix.node == '22'
        run: node server/tools/check_driver_names.ts
      - name: Check formatting
        if: matrix.node == '22'
        run: scripts/dev npm --prefix server run format:check
      - name: Check types
        run: |
          node server/node_modules/typescript/bin/tsc --noEmit -p server/tsconfig.json
      - name: Check the generated schema seed
        run: node server/core/database/tools/generate_seed.ts --check
      - name: Check foundation behavior
        run: |
          cd server
          node node_modules/vitest/vitest.mjs run
      - name: Prepare the disposable native home service manager
        if: matrix.node == '22' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y dbus-user-session
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus" \
            systemctl --user start dbus.service
      - name: Prove first-home installation against native systemd
        if: matrix.node == '22' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          umask 077
          native_root="$RUNNER_TEMP/first-home-native"
          mkdir -p "$native_root"/{home/codex,home/claude,tmp,evidence}
          env -i PATH="$PATH" LANG=C.UTF-8 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            HOME="$native_root/home" TMPDIR="$native_root/tmp" \
            CODEX_HOME="$native_root/home/codex" CLAUDE_CONFIG_DIR="$native_root/home/claude" \
            XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus" \
            PLAN_SERVER_URL=http://127.0.0.1:1 PLAN_TEST_MODE=1 \
            PANELS_NATIVE_HOME_TEST=1 NATIVE_EVIDENCE="$native_root/evidence" \
            scripts/dev npm --prefix server run test -- installation/home.native.test.ts \
              --reporter=junit --outputFile "$native_root/evidence/first-home.xml"
      - name: Preserve native home service evidence
        if: always() && matrix.node == '22' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-home-native-linux-node-22
          path: ${{ runner.temp }}/first-home-native/evidence
          if-no-files-found: warn
