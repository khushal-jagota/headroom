name: Development tools

on:
  pull_request:
    branches: [staging, main, sweep/guard-sweep, feature/typescript-backend]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  development-tools:
    name: development tools (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up checkout dependencies
        run: scripts/dev setup
      - name: Check frontend tools
        run: |
          scripts/dev npm --prefix web run check
          scripts/dev npm --prefix web run test:vitest
      - name: Check Python tools and runtime isolation
        run: |
          scripts/dev pytest tests/unit/test_instrument.py tests/unit/test_backend_cli_build.py tests/unit/test_test_runtime.py
          scripts/dev mypy scripts/tree_environment.py scripts/dev_launcher.py
