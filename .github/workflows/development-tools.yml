name: Development tools

on:
  workflow_call:
  pull_request:
    branches: [sweep/guard-sweep]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  development-tools:
    name: development tools (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web
      - name: Check frontend tools
        run: |
          scripts/dev npm --prefix web run check
          scripts/dev npm --prefix web run test:vitest
      - name: Check script types
        run: node server/node_modules/typescript/bin/tsc --noEmit -p scripts/tsconfig.json
