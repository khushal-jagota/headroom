name: Native iOS
on:
  push:
    branches: ['**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Native system host tests
        run: bash ios/scripts/test-system-models.sh
      - name: Native offline and conversation host tests
        if: ${{ !cancelled() }}
        run: bash ios/scripts/test-offline.sh
      - name: Unsigned iOS Simulator build
        if: ${{ !cancelled() }}
        run: xcodebuild -project ios/Panels.xcodeproj -scheme Panels -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/panels-ios" -jobs 4 CODE_SIGNING_ALLOWED=NO build
