name: Native iOS
# The jobs need GitHub-hosted Mac machines, which are scarce. Run them once per
# change, when it reaches main, and on manual runs.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    name: Native ${{ matrix.suite }} host tests
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [system-models, offline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.suite == 'offline'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web presentation oracle dependencies
        if: matrix.suite == 'offline'
        run: scripts/dev npm --prefix web ci
      - name: Toolchain
        run: swift --version
      - name: Host tests
        run: bash ios/scripts/test-${{ matrix.suite }}.sh
  simulator:
    name: Unsigned iOS Simulator build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Verify generated project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          ios/scripts/generate-project.sh
          git diff --exit-code -- ios/Panels.xcodeproj/project.pbxproj
      - name: Build
        run: xcodebuild -project ios/Panels.xcodeproj -scheme Panels -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/panels-ios" -jobs 4 CODE_SIGNING_ALLOWED=NO build
