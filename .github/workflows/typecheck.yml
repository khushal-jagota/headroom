name: Pull request type check

on:
  pull_request:
    branches: [staging, main, sweep/guard-sweep, feature/make-updates-work, feature/ios-data-flow]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  mypy:
    name: mypy (merged tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record merged source
        env:
          PANELS_MERGED_SHA: ${{ github.sha }}
          PANELS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PANELS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checked_sha="$(git rev-parse HEAD)"
          test "$checked_sha" = "$PANELS_MERGED_SHA"
          printf 'Merged revision: %s\n' "$checked_sha"
          printf 'Merged tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'Event base revision: %s\n' "$PANELS_BASE_SHA"
          printf 'Event head revision: %s\n' "$PANELS_HEAD_SHA"
      - name: Check native iOS compatibility review
        run: python3 scripts/check_ios_compatibility.py
      - name: Install pinned Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --editable .
      - name: Check executor protocol versions
        env:
          PANELS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .venv/bin/python scripts/check_executor_protocol.py --base "$PANELS_BASE_SHA"
      - name: Check complete merged tree
        run: .venv/bin/mypy
      - name: Check generated contracts
        run: |
          .venv/bin/python scripts/generate_conversation_view_contracts.py --check
          .venv/bin/python scripts/generate_goal_browser_contracts.py --check
          .venv/bin/python scripts/generate_navigation_browser_contracts.py --check
          .venv/bin/python scripts/generate_resource_browser_contracts.py --check
          .venv/bin/python scripts/generate_ticket_workspace_contracts.py --check
