name: Pull request type check

on:
  pull_request:
    branches: [staging, main, sweep/guard-sweep, feature/make-updates-work, feature/ios-data-flow, feature/server-and-machine-code, feature/update-rework]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (merged tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record merged source
        env:
          PANELS_MERGED_SHA: ${{ github.sha }}
          PANELS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PANELS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checked_sha="$(git rev-parse HEAD)"
          test "$checked_sha" = "$PANELS_MERGED_SHA"
          printf 'Merged revision: %s\n' "$checked_sha"
          printf 'Merged tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'Event base revision: %s\n' "$PANELS_BASE_SHA"
          printf 'Event head revision: %s\n' "$PANELS_HEAD_SHA"
      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web
      - name: Check server types
        run: npm --prefix server run check
      - name: Check browser app types
        run: npm --prefix web run check
      - name: Check script types
        run: node server/node_modules/typescript/bin/tsc --noEmit -p scripts/tsconfig.json
