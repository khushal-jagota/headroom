name: TypeScript release proof

on:
  pull_request:
    branches: [feature/typescript-backend]
    paths:
      - tests/support/server_fixtures.py
      - .github/workflows/typescript-backend-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-fixture-regression:
    name: Python fixture regression (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, e2e]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/panels-fixture-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare disposable hosted prerequisites
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y bubblewrap dbus-user-session ffmpeg patchelf binutils libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ffmpeg -version
          ffprobe -version
          if [ "${{ matrix.suite }}" = e2e ]; then
            sudo loginctl enable-linger "$USER"
            sudo systemctl start "user@$(id -u).service"
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          fi
      - name: Install independent dependencies
        run: scripts/dev setup
      - name: Admit the existing real systemd fixtures
        if: matrix.suite == 'e2e'
        run: |
          systemctl --user start dbus.service
          .venv/bin/python - <<'PY'
          import os
          import subprocess
          import time
          from planner.server_lifecycle.process_identity import read_authenticated_manager_identity

          unit = f"user@{os.getuid()}.service"
          manager = int(subprocess.check_output(
              ["systemctl", "show", unit, "--property=MainPID", "--value"], text=True))
          assert manager > 1
          deadline = time.monotonic() + 20
          while read_authenticated_manager_identity(manager, "user") is None:
              if time.monotonic() >= deadline:
                  raise RuntimeError("hosted user manager lacks authenticated DBus credentials")
              time.sleep(0.25)
          PY
      - name: Provision the existing offline Hermes integration proof
        if: matrix.suite == 'integration'
        run: |
          hermes_source="$HOME/.hermes/hermes-agent"
          hermes_sha=76d832d3857551a029c4b39c23945eb47c16fe5b
          test ! -e "$hermes_source"
          git init "$hermes_source"
          git -C "$hermes_source" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_source" fetch --depth=1 origin "$hermes_sha"
          git -C "$hermes_source" checkout --detach FETCH_HEAD
          test "$(git -C "$hermes_source" rev-parse HEAD)" = "$hermes_sha"
          python3 -m venv "$hermes_source/venv"
          "$hermes_source/venv/bin/python" -m pip install --editable "$hermes_source[acp]"
      - name: Prepare existing browser fixtures
        if: matrix.suite == 'e2e'
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          scripts/dev npm --prefix web run build
      - name: Select the installed offline CLI qualification inputs
        if: matrix.suite == 'integration'
        run: |
          echo "PANELS_QUALIFY_CODEX=$GITHUB_WORKSPACE/agent_backends/node_modules/.bin/codex" >> "$GITHUB_ENV"
          echo "PANELS_QUALIFY_CLAUDE=$GITHUB_WORKSPACE/agent_backends/node_modules/.bin/claude" >> "$GITHUB_ENV"
      - name: Run the existing Python suite
        env:
          PYTHON_SUITE: ${{ matrix.suite }}
        run: |
          scripts/dev pytest "tests/$PYTHON_SUITE" -n 4 --junitxml="$RUNNER_TEMP/python-fixture-$PYTHON_SUITE.xml"
          .venv/bin/python scripts/deployment_check_report.py pytest "$RUNNER_TEMP/python-fixture-$PYTHON_SUITE.xml" "tests/$PYTHON_SUITE"
      - name: Preserve suite results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-fixture-${{ matrix.suite }}
          path: ${{ runner.temp }}/python-fixture-${{ matrix.suite }}.xml
          if-no-files-found: ignore
