name: Disposable Worker pressure proof

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the authorized Ticket branch and hosted runner
        env:
          PANELS_DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$PANELS_DISPATCH_REF" = refs/heads/ticket/t_1ecuge4h
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p "$RUNNER_TEMP/worker-pressure-evidence"
          printf '%s\n' "$PANELS_DISPATCH_REF" > "$RUNNER_TEMP/worker-pressure-evidence/dispatch-ref.txt"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve exact source and hosted environment
        env:
          PANELS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$PANELS_SOURCE_SHA"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/worker-pressure-evidence/source.tar.gz"
          (
            cd "$RUNNER_TEMP/worker-pressure-evidence"
            sha256sum source.tar.gz > source.sha256
          )
          {
            printf 'Source: %s\n' "$PANELS_SOURCE_SHA"
            git rev-parse 'HEAD^{tree}'
            printf 'Runner image: %s\nImage version: %s\n' "$ImageOS" "$ImageVersion"
            cat /etc/os-release
            uname -a
            python3 --version
            node --version
            npm --version
            systemctl --version
            free -m
          } > "$RUNNER_TEMP/worker-pressure-evidence/environment.txt"
      - name: Install build prerequisites
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config build-essential
      - name: Set up independent source-local dependencies
        run: |
          set -o pipefail
          scripts/dev setup 2>&1 | tee "$RUNNER_TEMP/worker-pressure-evidence/setup.log"
      - name: Probe a real home under builds and low memory
        run: |
          set -o pipefail
          .venv/bin/python scripts/worker_pressure_probe.py probe \
            --root "$RUNNER_TEMP/worker-pressure-run" \
            2>&1 | tee "$RUNNER_TEMP/worker-pressure-evidence/probe.log"
      - name: Preserve results, records, and home logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-pressure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/worker-pressure-evidence/
            ${{ runner.temp }}/worker-pressure-run/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
