name: Deploy exact commit
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
concurrency:
  group: production-deploy
  cancel-in-progress: false
env:
  PANELS_REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
jobs:
  deploy:
    runs-on: [self-hosted, linux, production, panels-deploy]
    steps:
      - name: Set runner-temporary deployment paths
        run: |
          echo "PANELS_CANDIDATE_SOURCE=$RUNNER_TEMP/panels-source-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PANELS_CANDIDATE_APP=$RUNNER_TEMP/panels-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PANELS_DEPLOY_VENV=$RUNNER_TEMP/panels-deploy-venv-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove exact temporary source
        run: |
          printf '%s\n' "$PANELS_REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "commit_sha must be a lowercase, full 40-character hexadecimal SHA" >&2
            exit 2
          }
          git cat-file -e "$PANELS_REQUESTED_SHA^{commit}"
          git worktree add --detach "$PANELS_CANDIDATE_SOURCE" "$PANELS_REQUESTED_SHA"
          test "$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse HEAD)" = "$PANELS_REQUESTED_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 22) throw new Error("Node 22 is required")'
          python3 -m venv "$PANELS_DEPLOY_VENV"
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install -r requirements.txt
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install --editable .
      - name: Build and validate exact app
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment app-build \
            --source-root "$PANELS_CANDIDATE_SOURCE" \
            --requested-sha "$PANELS_REQUESTED_SHA" \
            --candidate-app "$PANELS_CANDIDATE_APP"
      - name: Deploy exact app
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment app-deploy \
            --candidate-app "$PANELS_CANDIDATE_APP" \
            --current-root "$HOME/Deployments/Panels/current" \
            --source-db "$HOME/Deployments/Panels/current/data/planner.db" \
            --backup-dir "$HOME/Deployments/Panels/current/data/backups" \
            --health-url "http://127.0.0.1:8767/api/health" \
            --service-manager systemctl \
            --service-name panels-live.service
      - name: Provision production agent skills
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment provision-skills \
            --database-parent "$HOME/Deployments/Panels/current/data" \
            --hermes-home "$HOME/.hermes" \
            --codex-home "$HOME/.codex" \
            --claude-home "$HOME/.claude"
      - name: Remove runner-temporary deployment state
        if: always()
        run: |
          git worktree remove --force "$PANELS_CANDIDATE_SOURCE" || rm -rf -- "$PANELS_CANDIDATE_SOURCE"
          rm -rf -- "$PANELS_CANDIDATE_APP" "$PANELS_DEPLOY_VENV"
