name: Deploy exact main commit
on:
  push:
    branches: [main]
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, production]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove exact source commit and install prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m venv .build-venv
          .build-venv/bin/python -m pip install -r requirements.txt
          .build-venv/bin/python -m pip install --editable .
          npm ci --prefix web
          npm ci --prefix agent_backends
      - name: Release gate
        run: ./verify
      - name: Build and validate host-native release
        run: |
          .build-venv/bin/python -m planner environment release-build \
            --source-root . --requested-sha "${{ github.sha }}" \
            --release-root "$PANELS_RELEASE_ROOT/${{ github.sha }}"
      - name: Deploy exact SHA
        run: |
          panels environment deploy \
            --candidate "$PANELS_RELEASE_ROOT/${{ github.sha }}" \
            --current "$PANELS_CURRENT_POINTER" \
            --source-db "$PANELS_BACKUP_SOURCE_DB" \
            --backup-dir "$PANELS_BACKUP_DIRECTORY" \
            --records "$PANELS_DEPLOYMENT_RECORDS" \
            --health-url "$PANELS_HEALTH_URL" \
            --service-manager "$PANELS_SERVICE_MANAGER" \
            --service-name "$PANELS_SERVICE_NAME"
