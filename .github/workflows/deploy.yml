name: Deploy exact commit
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
concurrency:
  group: production-deploy
  cancel-in-progress: false
env:
  PANELS_MAC_HOST: ${{ vars.PANELS_MAC_HOST }}
  PANELS_MAC_KNOWN_HOSTS: ${{ vars.PANELS_MAC_KNOWN_HOSTS }}
  PANELS_MAC_SSH_IDENTITY: ${{ vars.PANELS_MAC_SSH_IDENTITY }}
  PANELS_MAC_PYTHON: ${{ vars.PANELS_MAC_PYTHON }}
  PANELS_MAC_NODE: ${{ vars.PANELS_MAC_NODE }}
  PANELS_MAC_NPM: ${{ vars.PANELS_MAC_NPM }}
  PANELS_MAC_ARCHITECTURE: ${{ vars.PANELS_MAC_ARCHITECTURE }}
  PANELS_MAC_PYTHON_VERSION: ${{ vars.PANELS_MAC_PYTHON_VERSION }}
  PANELS_EXECUTOR_SSH_HOST: ${{ vars.PANELS_EXECUTOR_SSH_HOST }}
  PANELS_EXECUTOR_SSH_PORT: ${{ vars.PANELS_EXECUTOR_SSH_PORT }}
  PANELS_EXECUTOR_SSH_USER: ${{ vars.PANELS_EXECUTOR_SSH_USER }}
  PANELS_EXECUTOR_SSH_AUTH_MODE: ${{ vars.PANELS_EXECUTOR_SSH_AUTH_MODE }}
  PANELS_EXECUTOR_TAILSCALE_BINARY: ${{ vars.PANELS_EXECUTOR_TAILSCALE_BINARY }}
  PANELS_EXECUTOR_SSH_IDENTITY_FILE: ${{ vars.PANELS_EXECUTOR_SSH_IDENTITY_FILE }}
  PANELS_EXECUTOR_SSH_KNOWN_HOSTS_FILE: ${{ vars.PANELS_EXECUTOR_SSH_KNOWN_HOSTS_FILE }}
  PANELS_EXECUTOR_SERVER_URL: ${{ vars.PANELS_EXECUTOR_SERVER_URL }}
  PANELS_EXECUTOR_BACKEND_PATH: ${{ vars.PANELS_EXECUTOR_BACKEND_PATH }}
  PANELS_REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
jobs:
  deploy:
    runs-on: [self-hosted, linux, production, panels-deploy]
    steps:
      - name: Set runner-temporary deployment paths
        run: |
          echo "PANELS_CANDIDATE_SOURCE=$RUNNER_TEMP/panels-source-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PANELS_CANDIDATE_APP=$RUNNER_TEMP/panels-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PANELS_DEPLOY_VENV=$RUNNER_TEMP/panels-deploy-venv-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PANELS_VPS_LAUNCH_CONFIG=$RUNNER_TEMP/panels-vps-launch-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_ENV"
          echo "PANELS_VPS_SOCKET_PATH=$HOME/Deployments/Panels/current/data/executor.sock" >> "$GITHUB_ENV"
          python3 - "$HOME/Deployments/Panels/current/app/bin/panels" "$HOME/Deployments/Panels/current/data/executor.sock" >> "$GITHUB_ENV" <<'PY'
          import shlex
          import sys
          print("PANELS_EXECUTOR_RELAY_COMMAND=" + shlex.join([
              sys.argv[1], "executor", "relay", "--socket-path", sys.argv[2],
          ]))
          PY
          echo "PANELS_RESIDENT_MANIFEST=$RUNNER_TEMP/panels-resident-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_ENV"
          echo "PANELS_EXECUTOR_CONTRACT=$RUNNER_TEMP/panels-executor-contract-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_ENV"
          echo "PANELS_RESIDENT_REPORT=$HOME/Deployments/Panels/current/data/deployments/resident-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_ENV"
          echo "PANELS_DEPLOYMENT_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "PANELS_LIFECYCLE_PATH=$HOME/Deployments/Panels/current/data/deployment-lifecycle.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate exact resident artifact and authenticated Mac configuration
        id: resident-preflight
        if: vars.PANELS_RESIDENT_DEPLOY_ENABLED == 'true'
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          for name in PANELS_MAC_HOST PANELS_MAC_KNOWN_HOSTS PANELS_MAC_SSH_IDENTITY PANELS_MAC_PYTHON PANELS_MAC_NODE PANELS_MAC_NPM PANELS_MAC_ARCHITECTURE PANELS_MAC_PYTHON_VERSION PANELS_EXECUTOR_SSH_HOST PANELS_EXECUTOR_SSH_PORT PANELS_EXECUTOR_SSH_USER PANELS_EXECUTOR_SSH_AUTH_MODE PANELS_EXECUTOR_SSH_KNOWN_HOSTS_FILE PANELS_EXECUTOR_SERVER_URL; do
            test -n "${!name}" || { echo "Missing explicit resident configuration: $name" >&2; exit 2; }
          done
          git show "$PANELS_REQUESTED_SHA:ops/panels-environments/executor-build-contract.json" > "$PANELS_EXECUTOR_CONTRACT"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m planner.environments.resident.cli package-spec \
            --source-root "$GITHUB_WORKSPACE" --requested-sha "$PANELS_REQUESTED_SHA" \
            --build-contract "$PANELS_EXECUTOR_CONTRACT" --target-architecture "$PANELS_MAC_ARCHITECTURE" \
            --python-version "$PANELS_MAC_PYTHON_VERSION" --output "$PANELS_RESIDENT_MANIFEST"
          auth_args=(--executor-ssh-auth-mode "$PANELS_EXECUTOR_SSH_AUTH_MODE")
          case "$PANELS_EXECUTOR_SSH_AUTH_MODE" in
            public_key)
              test -n "$PANELS_EXECUTOR_SSH_IDENTITY_FILE" && test -z "$PANELS_EXECUTOR_TAILSCALE_BINARY" || exit 2
              auth_args+=(--executor-ssh-identity-file "$PANELS_EXECUTOR_SSH_IDENTITY_FILE")
              ;;
            tailscale)
              test -z "$PANELS_EXECUTOR_SSH_IDENTITY_FILE" && test -n "$PANELS_EXECUTOR_TAILSCALE_BINARY" || exit 2
              auth_args+=(--executor-tailscale-binary "$PANELS_EXECUTOR_TAILSCALE_BINARY")
              ;;
            *) echo "Explicit executor authentication mode required" >&2; exit 2 ;;
          esac
          backend_args=()
          if [ -n "$PANELS_EXECUTOR_BACKEND_PATH" ]; then
            backend_args=(--backend-path "$PANELS_EXECUTOR_BACKEND_PATH")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m planner.environments.resident.cli preflight \
            --vps-app "$HOME/Deployments/Panels/current/app" \
            --requested-sha "$PANELS_REQUESTED_SHA" --source-root "$GITHUB_WORKSPACE" \
            --manifest "$PANELS_RESIDENT_MANIFEST" --ssh-host "$PANELS_MAC_HOST" \
            --known-hosts "$PANELS_MAC_KNOWN_HOSTS" --identity "$PANELS_MAC_SSH_IDENTITY" \
            --python "$PANELS_MAC_PYTHON" --node "$PANELS_MAC_NODE" --npm "$PANELS_MAC_NPM" \
            --executor-ssh-host "$PANELS_EXECUTOR_SSH_HOST" --panels-server-url "$PANELS_EXECUTOR_SERVER_URL" \
            --executor-ssh-port "$PANELS_EXECUTOR_SSH_PORT" --executor-ssh-user "$PANELS_EXECUTOR_SSH_USER" \
            "${auth_args[@]}" \
            --executor-ssh-known-hosts "$PANELS_EXECUTOR_SSH_KNOWN_HOSTS_FILE" \
            --relay-command "$PANELS_EXECUTOR_RELAY_COMMAND" \
            "${backend_args[@]}"
      - name: Start deployment lifecycle
        id: lifecycle-start
        run: |
          current_record="$(
            python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" read \
              --path "$PANELS_LIFECYCLE_PATH"
          )"
          expected_id="$(
            python3 -c 'import json, sys; value=json.load(sys.stdin).get("deployment_id"); print(value if isinstance(value, str) else "")' \
              <<< "$current_record"
          )"
          expected_args=()
          if [ -n "$expected_id" ]; then
            expected_args=(--expected-deployment-id "$expected_id")
          fi
          prior_sha="$(
            python3 - "$HOME/Deployments/Panels/current/app/manifest.json" <<'PY'
          import json
          import pathlib
          import re
          import sys

          try:
              value = json.loads(pathlib.Path(sys.argv[1]).read_text()).get("app_sha", "")
          except (OSError, AttributeError, json.JSONDecodeError):
              value = ""
          print(value if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) else "")
          PY
          )"
          prior_args=()
          if [ -n "$prior_sha" ]; then
            prior_args=(--prior-sha "$prior_sha")
          fi
          python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" start \
            --path "$PANELS_LIFECYCLE_PATH" \
            --deployment-id "$PANELS_DEPLOYMENT_ID" \
            --requested-sha "$PANELS_REQUESTED_SHA" \
            "${expected_args[@]}" \
            "${prior_args[@]}"
      - name: Prove exact temporary source
        run: |
          printf '%s\n' "$PANELS_REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "commit_sha must be a lowercase, full 40-character hexadecimal SHA" >&2
            exit 2
          }
          git cat-file -e "$PANELS_REQUESTED_SHA^{commit}"
          git worktree add --detach "$PANELS_CANDIDATE_SOURCE" "$PANELS_REQUESTED_SHA"
          test "$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse HEAD)" = "$PANELS_REQUESTED_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 22) throw new Error("Node 22 is required")'
      - name: Prepare deployment runtime
        run: |
          python3 -m venv "$PANELS_DEPLOY_VENV"
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install -r requirements.txt
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install --editable .
      - name: Build and validate exact app
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment app-build \
            --source-root "$PANELS_CANDIDATE_SOURCE" \
            --requested-sha "$PANELS_REQUESTED_SHA" \
            --candidate-app "$PANELS_CANDIDATE_APP"
      - name: Prepare explicit VPS executor launch configuration
        env:
          PANELS_RESIDENT_ENABLED: ${{ vars.PANELS_RESIDENT_DEPLOY_ENABLED }}
        run: |
          mode=local
          socket_args=()
          if [ "$PANELS_RESIDENT_ENABLED" = "true" ]; then
            mode=remote
            socket_args=(--socket "$PANELS_VPS_SOCKET_PATH")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m planner.environments.resident.cli configure-vps-launch \
            --path "$PANELS_VPS_LAUNCH_CONFIG" --mode "$mode" "${socket_args[@]}"
      - name: Deploy exact app
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment app-deploy \
            --candidate-app "$PANELS_CANDIDATE_APP" \
            --executor-launch-config "$PANELS_VPS_LAUNCH_CONFIG" \
            --current-root "$HOME/Deployments/Panels/current" \
            --source-db "$HOME/Deployments/Panels/current/data/planner.db" \
            --backup-dir "$HOME/Deployments/Panels/current/data/backups" \
            --health-url "http://127.0.0.1:8767/api/health" \
            --service-manager systemctl \
            --service-name panels-live.service \
            --lifecycle-path "$PANELS_LIFECYCLE_PATH" \
            --deployment-id "$PANELS_DEPLOYMENT_ID"
      - name: Provision production agent skills
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment provision-skills \
            --database-parent "$HOME/Deployments/Panels/current/data" \
            --hermes-home "$HOME/.hermes" \
            --codex-home "$HOME/.codex" \
            --claude-home "$HOME/.claude"
      - name: Deploy exact resident and record both observed hosts
        if: always() && !cancelled() && vars.PANELS_RESIDENT_DEPLOY_ENABLED == 'true' && steps.resident-preflight.outcome == 'success'
        run: |
          auth_args=(--executor-ssh-auth-mode "$PANELS_EXECUTOR_SSH_AUTH_MODE")
          case "$PANELS_EXECUTOR_SSH_AUTH_MODE" in
            public_key)
              test -n "$PANELS_EXECUTOR_SSH_IDENTITY_FILE" && test -z "$PANELS_EXECUTOR_TAILSCALE_BINARY" || exit 2
              auth_args+=(--executor-ssh-identity-file "$PANELS_EXECUTOR_SSH_IDENTITY_FILE")
              ;;
            tailscale)
              test -z "$PANELS_EXECUTOR_SSH_IDENTITY_FILE" && test -n "$PANELS_EXECUTOR_TAILSCALE_BINARY" || exit 2
              auth_args+=(--executor-tailscale-binary "$PANELS_EXECUTOR_TAILSCALE_BINARY")
              ;;
            *) echo "Explicit executor authentication mode required" >&2; exit 2 ;;
          esac
          backend_args=()
          if [ -n "$PANELS_EXECUTOR_BACKEND_PATH" ]; then
            backend_args=(--backend-path "$PANELS_EXECUTOR_BACKEND_PATH")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m planner.environments.resident.cli deploy-remote \
            --vps-app "$HOME/Deployments/Panels/current/app" \
            --requested-sha "$PANELS_REQUESTED_SHA" --source-root "$GITHUB_WORKSPACE" \
            --manifest "$PANELS_RESIDENT_MANIFEST" --ssh-host "$PANELS_MAC_HOST" \
            --known-hosts "$PANELS_MAC_KNOWN_HOSTS" --identity "$PANELS_MAC_SSH_IDENTITY" \
            --python "$PANELS_MAC_PYTHON" --node "$PANELS_MAC_NODE" --npm "$PANELS_MAC_NPM" \
            --executor-ssh-host "$PANELS_EXECUTOR_SSH_HOST" --panels-server-url "$PANELS_EXECUTOR_SERVER_URL" \
            --executor-ssh-port "$PANELS_EXECUTOR_SSH_PORT" --executor-ssh-user "$PANELS_EXECUTOR_SSH_USER" \
            "${auth_args[@]}" \
            --executor-ssh-known-hosts "$PANELS_EXECUTOR_SSH_KNOWN_HOSTS_FILE" \
            --relay-command "$PANELS_EXECUTOR_RELAY_COMMAND" \
            --vps-health-url "http://127.0.0.1:8767/api/health" --report "$PANELS_RESIDENT_REPORT" \
            --deployment-id "$PANELS_DEPLOYMENT_ID" "${backend_args[@]}"
      - name: Remove runner-temporary deployment state
        if: always()
        run: |
          git worktree remove --force "$PANELS_CANDIDATE_SOURCE" || rm -rf -- "$PANELS_CANDIDATE_SOURCE"
          rm -rf -- "$PANELS_CANDIDATE_APP" "$PANELS_DEPLOY_VENV"
          rm -f -- "$PANELS_RESIDENT_MANIFEST" "$PANELS_EXECUTOR_CONTRACT" "$PANELS_VPS_LAUNCH_CONFIG"
      - name: Finalize deployment lifecycle
        if: always() && steps.lifecycle-start.outcome == 'success'
        env:
          PANELS_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          test -f "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" || exit 0
          if [ "$PANELS_PRIOR_JOB_STATUS" = "success" ]; then
            phase=succeeded
            detail="Deployment completed."
            code=deployment_succeeded
            serving_args=(--serving-sha "$PANELS_REQUESTED_SHA")
          else
            phase=failed
            detail="Deployment workflow did not complete."
            code=workflow_failed
            serving_args=()
          fi
          python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" transition \
            --path "$PANELS_LIFECYCLE_PATH" \
            --deployment-id "$PANELS_DEPLOYMENT_ID" \
            --phase "$phase" \
            --detail "$detail" \
            --code "$code" \
            --preserve-terminal \
            "${serving_args[@]}"
