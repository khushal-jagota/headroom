name: Publish checked app and adopt owner request
'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full source SHA (defaults to this revision for publication)
        required: false
        type: string
      rehearsal:
        description: Run the complete deploy against a disposable hosted VM
        required: false
        default: false
        type: boolean
      baseline_sha:
        description: Full known-good SHA to serve before a rehearsal (must differ)
        required: false
        type: string
      operation:
        description: Publish a candidate or adopt an owner request
        required: true
        default: publish
        type: choice
        options:
          - publish
          - adopt
      request_id:
        description: request id
        required: false
        type: string
      publication_run_id:
        description: publication run id
        required: false
        type: string
      artifact_id:
        description: artifact id
        required: false
        type: string
      proof_artifact_id:
        description: proof artifact id
        required: false
        type: string
      artifact_digest:
        description: artifact digest
        required: false
        type: string
      archive_sha256:
        description: archive sha256
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.operation == 'adopt' && !inputs.rehearsal && 'production-deploy' || format('publish-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  PANELS_REQUESTED_SHA: ${{ inputs.commit_sha || github.sha }}
jobs:
  deploy:
    if: ${{ inputs.operation != 'adopt' || inputs.rehearsal }}
    runs-on: ubuntu-24.04
    env:
      PANELS_REHEARSAL: 'true'
      PANELS_BASELINE_SHA: ${{ inputs.baseline_sha || '2c0e05cefc82de100bfc576c1a8f3eda7a931f2d' }}
    defaults:
      run:
        shell: python3 scripts/deployment_progress.py {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bootstrap disposable hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap dbus-user-session ffmpeg patchelf binutils libtk8.6
          # Hosted Ubuntu's AppArmor policy otherwise denies unprivileged bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sudo mkdir -p /home/vps/Deployments/Panels
          sudo chown "$(id -u):$(id -g)" /home/vps/Deployments/Panels
      - name: Set deployment paths
        run: python3 scripts/deployment_rehearsal.py configure
      - name: Provision offline Hermes packaging prerequisite
        run: |
          set -o pipefail
          # Only the real core + ACP package is needed; never provider credentials/extras.
          hermes_source="$HOME/.hermes/hermes-agent"
          hermes_sha=76d832d3857551a029c4b39c23945eb47c16fe5b
          test ! -e "$hermes_source"
          echo "PANELS_REHEARSAL_HERMES_ROOT=$hermes_source" >> "$GITHUB_ENV"
          git init "$hermes_source"
          git -C "$hermes_source" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_source" fetch --depth=1 origin "$hermes_sha"
          git -C "$hermes_source" checkout --detach FETCH_HEAD
          test "$(git -C "$hermes_source" rev-parse HEAD)" = "$hermes_sha"
          python3 -m venv "$hermes_source/venv"
          "$hermes_source/venv/bin/python" -m pip install --editable "$hermes_source[acp]" \
            2>&1 | tee "$PANELS_GATE_DIR/hermes-install.log"
          echo "$hermes_sha" > "$PANELS_GATE_DIR/hermes-revision.txt"
      - name: Prepare rehearsal runtime
        run: |
          python3 -m venv "$PANELS_DEPLOY_VENV"
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install -r requirements.txt
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install --editable .
      - name: Start known-good rehearsal release
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/deployment_rehearsal.py start
      - name: Prove exact temporary source
        run: |
          printf '%s\n' "$PANELS_REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "commit_sha must be a lowercase, full 40-character hexadecimal SHA" >&2
            exit 2
          }
          git cat-file -e "$PANELS_REQUESTED_SHA^{commit}"
          git worktree add --detach "$PANELS_CANDIDATE_SOURCE" "$PANELS_REQUESTED_SHA"
          test "$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse HEAD)" = "$PANELS_REQUESTED_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or newer is required"'
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 22) throw new Error("Node 22 is required")'
      - name: Select complete publication checks
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/update_publication.py selection
      - name: Prepare requested-source check environment
        id: checks_setup
        run: |
          # Never inherit service/database/provider configuration into requested checks.
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --editable .
          # Candidate construction also needs both lockfile-controlled dependency trees.
          npm ci --prefix web
          npm ci --prefix agent_backends
          if [ "$PANELS_REHEARSAL" = true ]; then
            .venv/bin/python -m playwright install --with-deps chromium
          else
            .venv/bin/python -m playwright install chromium
          fi
          codex_bin="$(.venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" setup --source-root "$PANELS_CANDIDATE_SOURCE" --tools-dir "$PANELS_CODEX_TOOLS")"
          echo "$codex_bin" >> "$GITHUB_PATH"
          export PATH="$codex_bin:$PATH"
          npm --prefix web run build
          # A missing sandbox fails before any selected connected host starts.
          connected="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; s=json.load(open(sys.argv[1])); print(bool(s["e2e"] or s["browser"]))' "$PANELS_GATE_DIR/selection.json")"
          if [ "$connected" = True ]; then
            command -v bwrap
          fi
          mkdir -p "$PANELS_GATE_DIR/artifact-shadow" "$PANELS_REPORT_DIR"
      - name: Ruff at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/ruff.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "ruff_paths")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/ruff check "${selected[@]}"
      - name: mypy at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/mypy.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          enabled="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))["mypy"]; assert isinstance(v,bool), "invalid check flag"; print(str(v).lower())' "$PANELS_GATE_DIR/selection.json")"
          if [ "$enabled" != true ]; then exit 0; fi
          .venv/bin/mypy
      - name: pytest unit at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "unit")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" verify --source-root "$PANELS_CANDIDATE_SOURCE"
          .venv/bin/pytest "${selected[@]}" --junitxml="$PANELS_REPORT_DIR/unit.xml"
          "$PANELS_DEPLOY_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" pytest "$PANELS_REPORT_DIR/unit.xml" "${selected[@]}"
      - name: pytest integration at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "integration")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" verify --source-root "$PANELS_CANDIDATE_SOURCE"
          .venv/bin/pytest "${selected[@]}" --junitxml="$PANELS_REPORT_DIR/integration.xml"
          "$PANELS_DEPLOY_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" pytest "$PANELS_REPORT_DIR/integration.xml" "${selected[@]}"
      - name: pytest E2E at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "e2e")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/deployment_codex.py" verify --source-root "$PANELS_CANDIDATE_SOURCE"
          bwrap --bind / / --dev-bind /dev /dev \
            --bind "$PANELS_GATE_DIR/artifact-shadow" /home/vps/Deployments/Panels \
            --bind "$PANELS_CANDIDATE_SOURCE" "$PANELS_CANDIDATE_SOURCE" \
            --bind "$PANELS_REPORT_DIR" "$PANELS_REPORT_DIR" \
            --bind "$PANELS_CODEX_TOOLS" "$PANELS_CODEX_TOOLS" \
            --chdir "$PANELS_CANDIDATE_SOURCE" -- \
            .venv/bin/pytest "${selected[@]}" --junitxml="$PANELS_REPORT_DIR/e2e.xml"
          "$PANELS_DEPLOY_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" pytest "$PANELS_REPORT_DIR/e2e.xml" "${selected[@]}"
      - name: Frontend check at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/svelte-check.log") 2>&1
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          enabled="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))["web_check"]; assert isinstance(v,bool), "invalid check flag"; print(str(v).lower())' "$PANELS_GATE_DIR/selection.json")"
          if [ "$enabled" != true ]; then exit 0; fi
          npm --prefix web run check
      - name: Typechecked Vitest at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "vitest")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          for index in "${!selected[@]}"; do selected[$index]="${selected[$index]#web/}"; done
          npm --prefix web run test:vitest -- "${selected[@]}" --reporter=default --reporter=json --outputFile="$PANELS_REPORT_DIR/vitest.json"
          "$PANELS_DEPLOY_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" vitest "$PANELS_REPORT_DIR/vitest.json" "${selected[@]}"
      - name: Browser hosts at requested source
        if: ${{ !cancelled() && steps.checks_setup.outcome == 'success' }}
        run: |
          for key in $(compgen -e); do
            case "$key" in PLAN_*|PANELS_REAL_*|HERMES_HOME|CODEX_HOME|CLAUDE_CONFIG_DIR) unset "$key" ;; esac
          done
          cd "$PANELS_CANDIDATE_SOURCE"
          selected_text="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; assert isinstance(v,list) and all(isinstance(p,str) and p for p in v), "invalid selected paths"; print("\n".join(v))' "$PANELS_GATE_DIR/selection.json" "browser")"
          if [ -z "$selected_text" ]; then exit 0; fi
          mapfile -t selected <<< "$selected_text"
          browser_format="$("$PANELS_DEPLOY_VENV/bin/python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["browser_format"])' "$PANELS_GATE_DIR/selection.json")"
          node --input-type=module -e 'import {pathToFileURL} from "node:url"; const {assertCompleteCaseEnvironment} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + "/web/tests/browser/contracts.mjs").href); assertCompleteCaseEnvironment(process.env);'
          if [ "$browser_format" = shared-v1 ]; then
            invocation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-browser"
            # The receipt proves its own revision with git, so the checkout's git
            # directory must survive the artifact shadow it can sit underneath.
            git_common_dir="$(git -C "$PANELS_CANDIDATE_SOURCE" rev-parse --path-format=absolute --git-common-dir)"
            bwrap --bind / / --dev-bind /dev /dev \
              --bind "$PANELS_GATE_DIR/artifact-shadow" /home/vps/Deployments/Panels \
              --bind "$PANELS_CANDIDATE_SOURCE" "$PANELS_CANDIDATE_SOURCE" \
              --ro-bind "$git_common_dir" "$git_common_dir" \
              --bind "$PANELS_REPORT_DIR" "$PANELS_REPORT_DIR" \
              --bind "$PANELS_CODEX_TOOLS" "$PANELS_CODEX_TOOLS" \
              --chdir "$PANELS_CANDIDATE_SOURCE/web" -- \
              node tests/browser/run.mjs --report "$PANELS_REPORT_DIR/browser.json" \
                --revision "$PANELS_REQUESTED_SHA" --invocation-id "$invocation_id" "${selected[@]}"
            "$PANELS_DEPLOY_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/deployment_check_report.py" \
              browser "$PANELS_REPORT_DIR/browser.json" "${selected[@]}" \
              --source-root "$PANELS_CANDIDATE_SOURCE" --revision "$PANELS_REQUESTED_SHA" \
              --invocation-id "$invocation_id"
          elif [ "$browser_format" = legacy ]; then
            # Rollback source predates case receipts. Preserve its original exit checks.
            status=0
            for host in "${selected[@]}"; do
              bwrap --bind / / --dev-bind /dev /dev \
                --bind "$PANELS_GATE_DIR/artifact-shadow" /home/vps/Deployments/Panels \
                --bind "$PANELS_CANDIDATE_SOURCE" "$PANELS_CANDIDATE_SOURCE" \
                --bind "$PANELS_REPORT_DIR" "$PANELS_REPORT_DIR" \
                --bind "$PANELS_CODEX_TOOLS" "$PANELS_CODEX_TOOLS" \
                --chdir "$PANELS_CANDIDATE_SOURCE/web" -- \
                node "${host#web/}" || status=1
            done
            exit "$status"
          else
            echo "Unsupported browser proof format: $browser_format" >&2
            exit 1
          fi
      - name: Build exact candidate once
        run: |
          exec > >(tee "$PANELS_REPORT_DIR/candidate-build.log") 2>&1
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment app-build \
            --source-root "$PANELS_CANDIDATE_SOURCE" \
            --requested-sha "$PANELS_REQUESTED_SHA" \
            --candidate-app "$PANELS_CANDIDATE_APP"
      - name: Seal immutable executable archive
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/update_publication.py seal
      - name: Prepare pinned Debian runtime proof root
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/runtime_target_root.py "$PANELS_GATE_DIR/target-root"
      - name: Execute sealed archive on Debian target
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/runtime_target_proof.py prove \
            --archive "$PANELS_GATE_DIR/panels-app.tar.gz" \
            --requested-sha "$PANELS_REQUESTED_SHA" \
            --target-root "$PANELS_GATE_DIR/target-root" \
            --evidence "$PANELS_GATE_DIR/target"
      - name: Smoke exact retained archive
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/update_publication.py smoke
      - name: Extract exact archive for disposable replacement
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/update_publication.py rehearsal
      - name: Start deployment lifecycle
        id: lifecycle_start
        run: |
          current_record="$(
            python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" read \
              --path "$PANELS_LIFECYCLE_PATH"
          )"
          expected_id="$(
            python3 -c 'import json, sys; value=json.load(sys.stdin).get("deployment_id"); print(value if isinstance(value, str) else "")' \
              <<< "$current_record"
          )"
          expected_args=()
          if [ -n "$expected_id" ]; then
            expected_args=(--expected-deployment-id "$expected_id")
          fi
          prior_sha="$(
            python3 - "$PANELS_CURRENT_ROOT/app/manifest.json" <<'PY'
          import json
          import pathlib
          import re
          import sys

          try:
              value = json.loads(pathlib.Path(sys.argv[1]).read_text()).get("app_sha", "")
          except (OSError, AttributeError, json.JSONDecodeError):
              value = ""
          print(value if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) else "")
          PY
          )"
          prior_args=()
          if [ -n "$prior_sha" ]; then
            prior_args=(--prior-sha "$prior_sha")
          fi
          python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" start \
            --path "$PANELS_LIFECYCLE_PATH" \
            --deployment-id "$PANELS_DEPLOYMENT_ID" \
            --requested-sha "$PANELS_REQUESTED_SHA" \
            "${expected_args[@]}" \
            "${prior_args[@]}"
          echo "PANELS_DEPLOYMENT_PROGRESS_ACTIVE=true" >> "$GITHUB_ENV"
      - name: Deploy exact app
        run: |
          env HOME="$PANELS_APP_HOME" "$PANELS_DEPLOY_VENV/bin/python" -m planner environment app-deploy \
            --candidate-app "$PANELS_CANDIDATE_APP" \
            --gate-evidence "$PANELS_GATE_DIR/evidence.json" \
            --current-root "$PANELS_CURRENT_ROOT" \
            --source-db "$PANELS_CURRENT_ROOT/data/planner.db" \
            --backup-dir "$PANELS_CURRENT_ROOT/data/backups" \
            --health-url "$PANELS_HEALTH_URL" \
            --service-manager systemctl \
            --service-name "$PANELS_SERVICE_NAME" \
            --lifecycle-path "$PANELS_LIFECYCLE_PATH" \
            --deployment-id "$PANELS_DEPLOYMENT_ID"
      - name: Provision agent skills
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment provision-skills \
            --database-parent "$PANELS_CURRENT_ROOT/data" \
            --hermes-home "$PANELS_APP_HOME/.hermes" \
            --codex-home "$PANELS_APP_HOME/.codex" \
            --claude-home "$PANELS_APP_HOME/.claude"
      - name: Finalize deployment lifecycle
        shell: bash
        if: ${{ always() && steps.lifecycle_start.outcome != 'skipped' && steps.lifecycle_start.outcome != '' }}
        env:
          PANELS_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          test -f "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" || exit 0
          if [ "$PANELS_PRIOR_JOB_STATUS" = "success" ]; then
            phase=succeeded
            detail="Deployment completed."
            code=deployment_succeeded
            serving_args=(--serving-sha "$PANELS_REQUESTED_SHA")
          else
            phase=failed
            detail="Deployment workflow did not complete."
            code=workflow_failed
            serving_args=()
          fi
          python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" transition \
            --path "$PANELS_LIFECYCLE_PATH" \
            --deployment-id "$PANELS_DEPLOYMENT_ID" \
            --phase "$phase" \
            --detail "$detail" \
            --code "$code" \
            --preserve-terminal \
            "${serving_args[@]}"
      - name: Collect rehearsal proof
        env:
          PANELS_REHEARSAL_JOB_STATUS: ${{ job.status }}
        run: python3 scripts/deployment_rehearsal.py capture
        if: ${{ always() }}
      - name: Retain exact executable archive
        id: app_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-app
          path: ${{ env.PANELS_GATE_DIR }}/panels-app.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Write immutable publication receipt
        env:
          PANELS_ARTIFACT_ID: ${{ steps.app_artifact.outputs.artifact-id }}
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" scripts/update_publication.py receipt
      - name: Retain workflow timing observations
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$PANELS_GATE_DIR/run-timings.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" > "$PANELS_GATE_DIR/job-timings.json"
          # GitHub records the final upload/cleanup and total duration after this snapshot.
      - name: Retain publication proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-publication-proof
          path: |-
            ${{ env.PANELS_GATE_DIR }}/
            !${{ env.PANELS_GATE_DIR }}/panels-app.tar.gz
            !${{ env.PANELS_GATE_DIR }}/target-root/**
            !${{ env.PANELS_GATE_DIR }}/target-root-oci/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove rehearsal temporary state
        shell: python3 scripts/deployment_progress.py --cleanup {0}
        run: python3 scripts/deployment_rehearsal.py cleanup
        if: ${{ always() }}
  adopt:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'adopt' && !inputs.rehearsal && github.ref == 'refs/heads/main' }}
    runs-on:
      - self-hosted
      - linux
      - production
      - panels-deploy
    env:
      PANELS_REHEARSAL: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Configure existing deployment paths
        run: python3 scripts/deployment_rehearsal.py configure
      - name: Prepare deployment control runtime
        run: |
          set -euo pipefail
          python3 -m venv "$PANELS_DEPLOY_VENV"
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install -r requirements.txt
          "$PANELS_DEPLOY_VENV/bin/python" -m pip install --editable .
      - name: Apply pinned owner request
        env:
          UPDATE_REQUEST_ID: ${{ inputs.request_id }}
          UPDATE_PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          UPDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          UPDATE_PROOF_ARTIFACT_ID: ${{ inputs.proof_artifact_id }}
          UPDATE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          UPDATE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          UPDATE_APP_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          # Use an independent control runtime. Adoption never builds or runs publication checks.
          "$PANELS_DEPLOY_VENV/bin/python" -m planner.environments.update_runner apply \
            --request-id "$UPDATE_REQUEST_ID" --publication-run-id "$UPDATE_PUBLICATION_RUN_ID" \
            --artifact-id "$UPDATE_ARTIFACT_ID" --proof-artifact-id "$UPDATE_PROOF_ARTIFACT_ID" \
            --app-sha "$UPDATE_APP_SHA" --artifact-digest "$UPDATE_ARTIFACT_DIGEST" \
            --archive-sha256 "$UPDATE_ARCHIVE_SHA256"
      - name: Provision agent skills after local adoption
        run: |
          "$PANELS_DEPLOY_VENV/bin/python" -m planner environment provision-skills \
            --database-parent "$PANELS_CURRENT_ROOT/data" \
            --hermes-home "$PANELS_APP_HOME/.hermes" \
            --codex-home "$PANELS_APP_HOME/.codex" \
            --claude-home "$PANELS_APP_HOME/.claude"
      - name: Check published HTTP/2
        env:
          PANELS_PUBLISHED_ORIGIN: ${{ vars.PANELS_PUBLISHED_ORIGIN }}
        run: python3 scripts/check_published_http2.py
      - name: Remove adoption temporary state
        if: ${{ always() }}
        run: python3 scripts/deployment_rehearsal.py cleanup
      - name: Finalize owner adoption lifecycle
        if: ${{ always() }}
        shell: bash
        env:
          PANELS_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          # Read the serving app after post-health checks. Never restore or restart here.
          serving_sha="$(python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import urllib.request
          try:
              manifest = json.loads((pathlib.Path(os.environ["PANELS_CURRENT_ROOT"]) / "app/manifest.json").read_text())
              expected = manifest["app_sha"]
              if re.fullmatch(r"[0-9a-f]{40}", expected) is None:
                  raise ValueError("invalid installed SHA")
              url = os.environ["PANELS_HEALTH_URL"] + "?expected_sha=" + expected
              with urllib.request.urlopen(url, timeout=5) as response:
                  health = json.load(response)
              if isinstance(health, dict) and health.get("ready") is True and health.get("app_sha") == expected:
                  print(expected)
          except (OSError, ValueError, KeyError, TypeError):
              pass
          PYTHON
          )"
          # Health alone does not commit a candidate whose ordinary work is still held.
          local_commit="$(python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" read \
            --path "$PANELS_LIFECYCLE_PATH" | python3 -c '
          import json, os, sys
          record = json.load(sys.stdin)
          committed = (record.get("deployment_id") == os.environ["PANELS_DEPLOYMENT_ID"]
                       and record.get("requested_sha") == os.environ["PANELS_REQUESTED_SHA"]
                       and record.get("serving_sha") == os.environ["PANELS_REQUESTED_SHA"]
                       and record.get("phase") in {"app_healthy", "succeeded"})
          print("true" if committed else "false")
          ')"
          serving_args=()
          if [ -n "$serving_sha" ] && { [ "$local_commit" = true ] || [ "$serving_sha" != "$PANELS_REQUESTED_SHA" ]; }; then
            serving_args=(--serving-sha "$serving_sha")
          fi
          if [ "$PANELS_PRIOR_JOB_STATUS" = success ] && [ "$local_commit" = true ] && [ "$serving_sha" = "$PANELS_REQUESTED_SHA" ]; then
            phase=succeeded
            code=deployment_succeeded
            detail="The requested application is installed and post-health checks completed."
          else
            phase=failed
            code=post_health_check_failed
            if [ "$local_commit" = true ] && [ "$serving_sha" = "$PANELS_REQUESTED_SHA" ]; then
              detail="The requested application is installed, but deployment checks did not complete."
            else
              detail="Deployment did not complete. Inspect the recorded serving release and recovery evidence."
            fi
          fi
          python3 "$GITHUB_WORKSPACE/src/planner/environments/deployment_lifecycle.py" transition \
            --path "$PANELS_LIFECYCLE_PATH" --deployment-id "$PANELS_DEPLOYMENT_ID" \
            --phase "$phase" --code "$code" --detail "$detail" --preserve-terminal \
            "${serving_args[@]}"
