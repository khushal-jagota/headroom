name: TypeScript lifecycle native ABI

# Runs on the four-hourly schedule (against staging) and on
# manual runs only; macOS runners are scarce, so neither pull requests nor
# pushes run this workflow.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      prove_first_install:
        description: Run only the complete first-install proof on Linux and Apple Silicon
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  first-install:
    if: github.event_name == 'workflow_dispatch' && inputs.prove_first_install
    uses: ./.github/workflows/typescript-first-install.yml

  linux-executor:
    if: ${{ !inputs.prove_first_install }}
    name: Linux executor sealed archive and relocation (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and admit one executor archive without a service or peer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update
          sudo apt-get install -y patchelf binutils libicu-dev pkg-config
          executor_node=$(env -i PATH="$PATH" node -p 'require("node:fs").realpathSync(process.execPath)')
          if [ "$executor_node" != /usr/local/bin/node ]; then sudo ln -sfn "$executor_node" /usr/local/bin/node; fi
          executor_revision=$(git rev-parse HEAD)
          executor_root=$(mktemp -d "$RUNNER_TEMP/linux-executor.XXXXXX")
          executor_evidence="$RUNNER_TEMP/linux-executor-evidence"
          mkdir -p "$executor_evidence" "$executor_root"/{home/.codex,home/.claude,config,cache,data,state,run,tmp,logs,backups,workspace,files,scratch}
          executor_cleanup() {
            local status=$?
            trap - EXIT
            set +e
            if [ -f "$executor_root/tmp/build/linux-executor-publication.json" ]; then
              cp "$executor_root/tmp/build/linux-executor-publication.json" "$executor_evidence/publication.json" || status=1
            fi
            local retained=true
            # Failed entries can still own native work at their original deadline.
            if [ "$status" -eq 0 ]; then
              if rm -rf -- "$executor_root"; then retained=false; else status=1; fi
            fi
            printf 'seconds=%s\nexit_code=%s\nretained=%s\nroot=%s\n' "$SECONDS" "$status" "$retained" "$executor_root" > "$executor_evidence/job-time.txt"
            exit "$status"
          }
          trap executor_cleanup EXIT
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            EXECUTOR_ROOT="$executor_root" EXECUTOR_EVIDENCE="$executor_evidence" EXECUTOR_REVISION="$executor_revision" \
            HOME="$executor_root/home" CODEX_HOME="$executor_root/home/.codex" \
            CLAUDE_CONFIG_DIR="$executor_root/home/.claude" \
            XDG_CONFIG_HOME="$executor_root/config" XDG_CACHE_HOME="$executor_root/cache" XDG_DATA_HOME="$executor_root/data" \
            XDG_STATE_HOME="$executor_root/state" XDG_RUNTIME_DIR="$executor_root/run" TMPDIR="$executor_root/tmp" TMP="$executor_root/tmp" TEMP="$executor_root/tmp" \
            npm_config_cache="$executor_root/cache/npm" PIP_CONFIG_FILE=/dev/null \
            PLAN_CONFIG_PATH="$executor_root/config.yaml" PLAN_DB_PATH="$executor_root/data/planner.sqlite" PLAN_DATA_DIR="$executor_root/data" PLAN_APP_ROOT="$executor_root/app" \
            PLAN_LOGS_DIR="$executor_root/logs" PLAN_BACKUP_DIR="$executor_root/backups" PLAN_WORKSPACE_ROOT="$executor_root/workspace" \
            PLAN_TICKET_FILES_DIR="$executor_root/files" PLAN_TICKET_SCRATCH_ROOT="$executor_root/scratch" PLAN_TICKET_SCRATCH_DATABASE="$executor_root/data/planner.sqlite" \
            PLAN_CREDENTIAL_KEY_PATH="$executor_root/data/key" PLAN_DISPATCHER_LOCK_PATH="$executor_root/run/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$executor_root/run/control.sock" PLAN_SERVER_LIFECYCLE_LEASE_PATH="$executor_root/run/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 PLAN_TEST_MODE=1 PLAN_DISPATCH_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'LINUX_EXECUTOR' 2>&1 | tee "$executor_evidence/job.log"
          printf '{}\n' > "$PLAN_CONFIG_PATH"
          node --input-type=module <<'EXECUTOR_REQUEST'
          import { realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          if (process.platform !== 'linux' || process.arch !== 'x64' || !/^22\.(?:1[89]|[2-9][0-9])\./.test(process.versions.node))
            throw new Error('Linux x64 Node 22 >=22.18 is required');
          const root = process.env.EXECUTOR_ROOT;
          writeFileSync(join(root, 'request.json'), JSON.stringify({
            source_root: process.env.GITHUB_WORKSPACE,
            requested_sha: process.env.EXECUTOR_REVISION,
            output_directory: join(root, 'tmp', 'build'),
          }));
          writeFileSync(join(process.env.EXECUTOR_EVIDENCE, 'platform.json'), JSON.stringify({
            revision: process.env.EXECUTOR_REVISION, platform: process.platform, architecture: process.arch,
            node: process.version, executable: realpathSync(process.execPath),
            boundary: 'Sealed executor archive relocation, native admission and CLI help. No install, service, peer or provider.',
          }));
          EXECUTOR_REQUEST
          scripts/dev npm --prefix server ci
          node server/environments/linux_executor/build_main.ts "$EXECUTOR_ROOT/request.json"
          executor_runtime="$EXECUTOR_ROOT/tmp/build/runtime"
          test -s "$executor_runtime/web/dist/index.html"
          test ! -e "$executor_runtime/web/node_modules"
          test ! -e "$executor_runtime/server/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl"
          test -x "$executor_runtime/server/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          # Compare retained contributors with the removed-byte count in job.log.
          du --apparent-size -sb "$executor_runtime"/* \
            "$executor_runtime/server/node_modules" \
            "$executor_runtime/agent_backends/node_modules" \
            "$executor_runtime/web/dist" \
            "$EXECUTOR_ROOT/tmp/build/panels-linux-executor.tar.gz" \
            | sort -nr | tee "$EXECUTOR_EVIDENCE/payload-bytes.txt"
          du --apparent-size -ab "$executor_runtime/server/node_modules" \
            "$executor_runtime/agent_backends/node_modules" \
            | sort -nr | awk 'NR<=60' | tee "$EXECUTOR_EVIDENCE/largest-paths.txt"
          LINUX_EXECUTOR
      - name: Preserve Linux executor admission evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-executor-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-executor-evidence
          if-no-files-found: warn

  darwin-locks:
    if: ${{ !inputs.prove_first_install }}
    name: Darwin arm64 lifecycle, archive, and Worker process ABI (Node 22)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove lifecycle and archive sequences on the Darwin ABI
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          native_root="$RUNNER_TEMP/lifecycle-native"
          native_evidence="$RUNNER_TEMP/lifecycle-native-evidence"
          native_tmp=$(mktemp -d "/tmp/p21-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          native_tmp=$(cd "$native_tmp" && pwd -P)
          trap 'native_exit=$?; if [ "$native_exit" -eq 0 ]; then rm -rf -- "$native_tmp"; fi' EXIT
          mkdir -p "$native_root"/{home/.codex,home/.claude,config,cache,data,state,runtime,logs,backups,workspace,files,tickets,app} "$native_evidence"
          printf '{}\n' > "$native_root/config.yaml"
          native_revision=$(git rev-parse HEAD)
          # Scrub before npm lifecycle scripts or any repository launcher.
          env -i PATH="$PATH" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" MAC_SOURCE_REVISION="$native_revision" \
            HOME="$native_root/home" \
            CODEX_HOME="$native_root/home/.codex" CLAUDE_CONFIG_DIR="$native_root/home/.claude" \
            XDG_CONFIG_HOME="$native_root/config" XDG_CACHE_HOME="$native_root/cache" \
            XDG_DATA_HOME="$native_root/data" XDG_STATE_HOME="$native_root/state" \
            XDG_RUNTIME_DIR="$native_root/runtime" \
            TMPDIR="$native_tmp" TMP="$native_tmp" TEMP="$native_tmp" \
            PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$native_root/cache/pip" \
            npm_config_cache="$native_root/cache/npm" HOMEBREW_CACHE="$native_root/cache/brew" \
            HOMEBREW_NO_AUTO_UPDATE=1 \
            PLAN_CONFIG_PATH="$native_root/config.yaml" PLAN_DB_PATH="$native_root/data/planner.db" \
            PLAN_LOGS_DIR="$native_root/logs" PLAN_BACKUP_DIR="$native_root/backups" \
            PLAN_DATA_DIR="$native_root/data" PLAN_WORKSPACE_ROOT="$native_root/workspace" \
            PLAN_APP_ROOT="$native_root/app" PLAN_CREDENTIAL_KEY_PATH="$native_root/data/key" \
            PLAN_KEY_PATH="$native_root/data/key" PLAN_TICKET_FILES_DIR="$native_root/files" \
            PLAN_TICKET_SCRATCH_ROOT="$native_root/tickets" \
            PLAN_TICKET_SCRATCH_DATABASE="$native_root/data/planner.db" \
            PLAN_DISPATCHER_LOCK_PATH="$native_tmp/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$native_tmp/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$native_tmp/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 \
            PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=1 \
            NATIVE_EVIDENCE="$native_evidence" PANELS_NATIVE_HOME_TEST=1 \
            bash --noprofile --norc -euo pipefail <<'NATIVE' 2>&1 | tee "$native_evidence/job.log"
          native_finish() {
            local native_status=$?
            trap - EXIT
            set +e
            if [[ -n "${home_output:-}" && -n "${home_evidence:-}" ]]; then
              for proof in admission.json mac-home-build.json boot-proof.json; do
                if [[ -f "$home_output/$proof" ]]; then
                  cp "$home_output/$proof" "$home_evidence/$proof"
                fi
              done
              for log in boot.stdout.log boot.stderr.log; do
                if [[ -f "$home_output/proof-work/$log" ]]; then
                  cp "$home_output/proof-work/$log" "$home_evidence/$log"
                fi
              done
              for log in boot.phase.log boot.supervisor.stdout.log boot.supervisor.stderr.log; do
                if [[ -f "$home_output/proof-work/$log" ]]; then
                  cp "$home_output/proof-work/$log" "$home_evidence/$log"
                fi
              done
            fi
            printf 'seconds=%s\nexit_code=%s\n' "$SECONDS" "$native_status" > "$NATIVE_EVIDENCE/job-time.txt"
            exit "$native_status"
          }
          trap native_finish EXIT
          node -e '
            const fs = require("node:fs"), os = require("node:os");
            fs.writeFileSync(process.env.NATIVE_EVIDENCE + "/platform.json", JSON.stringify({
              platform: process.platform, architecture: process.arch, node: process.version,
              executable: process.execPath, os_release: os.release(),
              boundary: "Archive sequences, Worker identity, home APP custody, preview/metrics ABI, authenticated machine preview and control paths, and first-home installation against owned synthetic LaunchAgents. No provider or live installation.",
              hosted_cost: "OPEN until this job completes; each existing case and job elapsed time are preserved separately."
            }, null, 2) + "\n");
            if (process.platform !== "darwin" || process.arch !== "arm64")
              throw new Error("The native proof requires a real Darwin arm64 Node runtime");
          '
          scripts/dev npm --prefix server ci
          # Reuse this host for native process/socket and provider directory/lock evidence.
          scripts/dev npm --prefix server run test -- \
            platform_runtime/worker_processes.native.test.ts platform_runtime/worker_launchd.native.test.ts lifecycle/paths.native.test.ts \
            previews/darwin.native.test.ts skills/account.test.ts executor/command_input_reader.test.ts \
            tests/preview_transport.test.ts tests/machine_backend_cards.test.ts \
            previews/machine.test.ts tests/remote_preview_retention.test.ts \
            ticket_workspaces/filesystem.test.ts --reporter=junit \
            --outputFile "$NATIVE_EVIDENCE/process-home-preview-abi.xml"
          # Reuse this host for the native machine preview. Other cases in this file
          # exercise the server's Linux-only file intake and belong to the Linux suite.
          scripts/dev npm --prefix server run test -- executor/app_transport.test.ts \
            -t 'machine code on the home account' --reporter=junit \
            --outputFile "$NATIVE_EVIDENCE/machine-preview.xml"
          # Build the home from separate production inputs, then prove the sealed archive after relocation.
          home_inputs="$TMPDIR/mac-home-inputs"
          home_output="$TMPDIR/mac-home-output"
          home_evidence="$NATIVE_EVIDENCE/mac-home"
          mkdir -p "$home_inputs" "$home_evidence"
          git archive --format=tar "$MAC_SOURCE_REVISION" | tar -xf - -C "$home_inputs"
          NODE_ENV=production "$home_inputs/scripts/dev" npm --prefix server ci
          NODE_ENV=production "$home_inputs/scripts/dev" npm --prefix agent_backends install
          "$home_inputs/scripts/dev" npm --prefix web ci
          "$home_inputs/scripts/dev" npm --prefix web run build
          node server/environments/release/mac_home_main.ts \
            --source "$GITHUB_WORKSPACE" --revision "$MAC_SOURCE_REVISION" --output "$home_output" \
            --node-modules "$home_inputs/server/node_modules" \
            --agent-backends "$home_inputs/agent_backends" --web-dist "$home_inputs/web/dist" \
            --public-cli-entrypoint server/cli/main.ts \
            > "$home_evidence/build.json" 2> "$home_evidence/build.stderr.log"
          # The canonical producer CLI retires its app path, admits the archive, and proves clean foreground boot.
          cp "$home_output"/*.json "$home_evidence/"
          cp "$home_output/panels-app.tar.gz" "$home_evidence/panels-app.tar.gz"
          export MAC_HOME_BUILD_METADATA="$home_output/mac-home-build.json"
          export MAC_HOME_PRODUCTION_INPUTS="$home_inputs"
          scripts/dev npm --prefix server run test -- \
            installation/home.native.test.ts --reporter=junit \
            --outputFile "$NATIVE_EVIDENCE/first-home-darwin.xml"
          NATIVE
      - name: Preserve native ABI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-native-darwin-arm64-node-22
          path: ${{ runner.temp }}/lifecycle-native-evidence
          if-no-files-found: warn
