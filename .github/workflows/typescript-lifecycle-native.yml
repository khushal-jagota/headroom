name: TypeScript lifecycle native ABI

# Runs after merge and on manual runs only; macOS runners are scarce, so pull
# requests do not run this workflow.
on:
  push:
    branches: [feature/typescript-backend]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  darwin-locks:
    name: Darwin arm64 lifecycle and archive metadata ABI (Node 22)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove existing registry and archive sequences on the Darwin ABI
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          native_root="$RUNNER_TEMP/lifecycle-native"
          native_evidence="$RUNNER_TEMP/lifecycle-native-evidence"
          native_tmp=$(mktemp -d "/tmp/p21-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          native_tmp=$(cd "$native_tmp" && pwd -P)
          trap 'rm -rf -- "$native_tmp"' EXIT
          mkdir -p "$native_root"/{home/.codex,home/.claude,home/.hermes,config,cache,data,state,runtime,logs,backups,workspace,files,tickets,app} "$native_evidence"
          printf '{}\n' > "$native_root/config.yaml"
          native_revision=$(git rev-parse HEAD)
          # Scrub before pip's editable build, npm lifecycle scripts, or any repository launcher.
          env -i PATH="$PATH" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 \
            GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" MAC_SOURCE_REVISION="$native_revision" \
            HOME="$native_root/home" \
            CODEX_HOME="$native_root/home/.codex" CLAUDE_CONFIG_DIR="$native_root/home/.claude" \
            HERMES_HOME="$native_root/home/.hermes" PLAN_HERMES_HOME="$native_root/home/.hermes" \
            XDG_CONFIG_HOME="$native_root/config" XDG_CACHE_HOME="$native_root/cache" \
            XDG_DATA_HOME="$native_root/data" XDG_STATE_HOME="$native_root/state" \
            XDG_RUNTIME_DIR="$native_root/runtime" \
            TMPDIR="$native_tmp" TMP="$native_tmp" TEMP="$native_tmp" \
            PIP_CONFIG_FILE=/dev/null PIP_CACHE_DIR="$native_root/cache/pip" \
            npm_config_cache="$native_root/cache/npm" HOMEBREW_CACHE="$native_root/cache/brew" \
            HOMEBREW_NO_AUTO_UPDATE=1 \
            PLAN_CONFIG_PATH="$native_root/config.yaml" PLAN_DB_PATH="$native_root/data/planner.db" \
            PLAN_LOGS_DIR="$native_root/logs" PLAN_BACKUP_DIR="$native_root/backups" \
            PLAN_DATA_DIR="$native_root/data" PLAN_WORKSPACE_ROOT="$native_root/workspace" \
            PLAN_APP_ROOT="$native_root/app" PLAN_CREDENTIAL_KEY_PATH="$native_root/data/key" \
            PLAN_KEY_PATH="$native_root/data/key" PLAN_TICKET_FILES_DIR="$native_root/files" \
            PLAN_TICKET_SCRATCH_ROOT="$native_root/tickets" \
            PLAN_TICKET_SCRATCH_DATABASE="$native_root/data/planner.db" \
            PLAN_DISPATCHER_LOCK_PATH="$native_tmp/dispatcher.lock" \
            PLAN_SERVER_CONTROL_SOCKET="$native_tmp/control.sock" \
            PLAN_SERVER_LIFECYCLE_LEASE_PATH="$native_tmp/lifecycle.lock" \
            PLAN_SERVER_URL=http://127.0.0.1:0 PLAN_PORT=0 \
            PLAN_DISPATCH_ENABLED=false PLAN_TEST_MODE=1 \
            NATIVE_EVIDENCE="$native_evidence" \
            bash --noprofile --norc -euo pipefail <<'NATIVE' 2>&1 | tee "$native_evidence/job.log"
          trap 'native_status=$?; printf "seconds=%s\nexit_code=%s\n" "$SECONDS" "$native_status" > "$NATIVE_EVIDENCE/job-time.txt"' EXIT
          node -e '
            const fs = require("node:fs"), os = require("node:os");
            fs.writeFileSync(process.env.NATIVE_EVIDENCE + "/platform.json", JSON.stringify({
              platform: process.platform, architecture: process.arch, node: process.version,
              executable: process.execPath, os_release: os.release(),
              boundary: "Existing registry and archive sequences: Darwin fcntl/flock and descriptor-based futimens with exact Python nanoseconds. No browser, provider, executor or service.",
              hosted_cost: "OPEN until this job completes; each existing case and job elapsed time are preserved separately."
            }, null, 2) + "\n");
            if (process.platform !== "darwin" || process.arch !== "arm64")
              throw new Error("The native proof requires a real Darwin arm64 Node runtime");
          '
          brew install icu4c pkg-config
          export PKG_CONFIG_PATH="$(brew --prefix icu4c)/lib/pkgconfig"
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --editable . --config-settings editable_mode=compat
          python -I -S -B scripts/development_safety/bootstrap.py npm --prefix server ci
          # No web build: this registry fixture uses synthetic app roots and no UI assets.
          python -I -S -B scripts/development_safety/bootstrap.py pytest \
            tests/compare/direct/test_unit21_registry.py::test_unit21_registry_fixture_and_lifecycle_parity \
            tests/compare/direct/test_unit21_release.py::test_unit21_release_identity_archive_and_frontier \
            --compare-report-dir "$NATIVE_EVIDENCE/comparison" \
            --basetemp "$TMPDIR/pytest" --junitxml "$NATIVE_EVIDENCE/results.xml"
          # The first native run measured 268.48s build + 7.59s inspection. Run on every job.
          echo 'Mac producer compatibility fixture: unchanged native producer and production inspector'
          node --input-type=module <<'MAC_COMPATIBILITY'
          import assert from 'node:assert/strict';
          import * as fs from 'node:fs/promises';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const source = process.env.GITHUB_WORKSPACE;
          const load = path => import(pathToFileURL(join(source, path)).href);
          const { ChildProcesses } = await load('server/lifecycle/owned_processes.ts');
          const { run_release_command } = await load('server/environments/release/process.ts');
          const { hash_archive, inspect_mac_archive } = await load('server/environments/release/archive.ts');
          const { MacArchiveInspectionUnsettled } = await load('server/environments/release/contracts.ts');
          const { python_json_equal } = await load('server/environments/release/logic/manifest.ts');
          assert.equal(process.platform, 'darwin');
          assert.equal(process.arch, 'arm64');
          const revision = process.env.MAC_SOURCE_REVISION;
          const runId = Number(process.env.GITHUB_RUN_ID);
          assert.match(revision, /^[a-f0-9]{40}$/);
          assert(Number.isSafeInteger(runId) && runId > 0);
          const evidence = join(process.env.NATIVE_EVIDENCE, 'mac-producer-compatibility');
          const output = join(process.env.TMPDIR, 'mac-producer-output');
          await fs.mkdir(evidence, { recursive: true });
          const owner = new ChildProcesses();
          const controller = new AbortController();
          const children = { spawned: 0, closed: 0 };
          const spawn = owner.spawn.bind(owner);
          owner.spawn = (command, args, options) => {
            const child = spawn(command, args, options);
            children.spawned++;
            child.once('close', () => { children.closed++; });
            return child;
          };
          let inspectionTimer;
          let cleanupFailure;
          const cancel = reason => {
            owner.seal();
            controller.abort(reason);
            try { owner.force_kill(performance.now() / 1000 + 5); }
            catch (error) { cleanupFailure = error; }
          };
          const stop = () => cancel(new Error('Mac producer compatibility fixture interrupted'));
          process.on('SIGTERM', stop);
          process.on('SIGINT', stop);
          const started = performance.now();
          try {
            const build = await run_release_command([
              'python3', join(source, 'scripts/build_mac_runtime.py'),
              '--source', source, '--output', output, '--revision', revision, '--run-id', String(runId),
            ], { timeout_seconds: null, cwd: source, environment: { ...process.env } }, {
              child_processes: owner, signal: controller.signal, deadline: performance.now() / 1000 + 1500,
            });
            await fs.writeFile(join(evidence, 'producer.log'), build.stdout + build.stderr);
            const built = performance.now();
            const inspectionDeadline = performance.now() / 1000 + 120;
            inspectionTimer = setTimeout(() => cancel(new Error('Mac inspection exceeded its original 120-second budget')), 120_000);
            const archive = join(output, 'panels-mac-runtime.tar.gz');
            const receiptPath = join(output, 'mac-runtime-publication.json');
            const receipt = JSON.parse(await fs.readFile(receiptPath, 'utf8'));
            assert.equal(receipt.application_revision, revision);
            assert.equal(receipt.publication_run_id, runId);
            assert.equal(receipt.proof.passed, true);
            const before = { sha256: await hash_archive(archive), size: (await fs.stat(archive)).size };
            controller.signal.throwIfAborted();
            assert.equal(before.sha256, receipt.archive_sha256);
            assert.equal(before.size, receipt.archive_size);
            const result = await inspect_mac_archive(archive, before.sha256, before.size, {
              child_processes: owner, signal: controller.signal, deadline: inspectionDeadline,
            });
            controller.signal.throwIfAborted();
            assert(python_json_equal(result.manifest, {
              schema_version: 1, application_revision: revision, platform: 'darwin', architecture: 'arm64',
            }));
            assert.equal(result.python, true);
            const after = { sha256: await hash_archive(archive), size: (await fs.stat(archive)).size };
            controller.signal.throwIfAborted();
            assert.deepEqual(after, before);
            await owner.settled();
            assert.deepEqual(children, { spawned: 2, closed: 2 });
            await fs.copyFile(receiptPath, join(evidence, 'producer-receipt.json'));
            await fs.writeFile(join(evidence, 'result.json'), JSON.stringify({
              source_revision: revision, workflow_run_id: runId, node: process.version,
              archive: before, unchanged_after_inspection: true, python_marker: result.python,
              platform: 'darwin', architecture: 'arm64', children,
              build_seconds: (built - started) / 1000,
              inspection_seconds: (performance.now() - built) / 1000,
              boundary: 'Unchanged native producer, production readonly inspector. No executor or service starts.',
            }, null, 2) + '\n');
            controller.signal.throwIfAborted();
          } catch (error) {
            let failure = error;
            if (error instanceof MacArchiveInspectionUnsettled) {
              try { await error.settled; }
              catch (cleanup) {
                if (cleanup !== error.cause)
                  failure = new AggregateError([error.cause, cleanup], 'Mac inspection cleanup failed');
              }
            }
            await fs.writeFile(join(evidence, 'failure.txt'), String(failure.stack ?? failure) + '\n');
            throw failure;
          } finally {
            clearTimeout(inspectionTimer);
            owner.seal();
            controller.abort();
            try {
              try { owner.force_kill(performance.now() / 1000 + 5); }
              finally { await owner.settled(); }
            } finally {
              process.off('SIGTERM', stop);
              process.off('SIGINT', stop);
              await fs.writeFile(join(evidence, 'children.json'), JSON.stringify(children) + '\n');
            }
            if (cleanupFailure) throw cleanupFailure;
          }
          MAC_COMPATIBILITY
          for mac_evidence in producer.log producer-receipt.json result.json children.json; do
            if [[ ! -s "$NATIVE_EVIDENCE/mac-producer-compatibility/$mac_evidence" ]]; then
              printf 'Mac compatibility evidence is missing or empty: %s\n' "$mac_evidence" >&2
              exit 1
            fi
          done
          NATIVE
      - name: Preserve native ABI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-native-darwin-arm64-node-22
          path: ${{ runner.temp }}/lifecycle-native-evidence
          if-no-files-found: warn
