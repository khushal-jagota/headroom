name: Desktop app
# Builds the macOS desktop app on a GitHub-hosted Mac, signs it with the
# Developer ID and the hardened runtime, notarizes and staples it, then checks
# the result with Apple's tools. ops/desktop/signing.md lists the secrets.
# Pull requests from forks never receive repository secrets.
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-mac-app:
    name: Signed and notarized Mac app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: scripts/dev npm --prefix desktop ci
      - name: Build, sign, notarize and staple
        env:
          CSC_LINK: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
          umask 077
          printf '%s\n' "$APPLE_NOTARY_API_KEY_P8" > "$APPLE_API_KEY"
          scripts/dev npm --prefix desktop run build:mac
          rm -f "$APPLE_API_KEY"
      - name: Check the signature, notarization and Gatekeeper
        run: |
          set -euo pipefail
          zip=$(ls desktop/dist/*.zip)
          check="$RUNNER_TEMP/check"
          mkdir "$check"
          ditto -x -k "$zip" "$check"
          app="$check/Panels.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Authority=Developer ID Application: ' "$RUNNER_TEMP/codesign.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
          grep -q '^Identifier=com.khushaljagota.panels.desktop$' "$RUNNER_TEMP/codesign.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          shasum -a 256 "$zip"
      - name: Upload the signed app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panels-desktop-mac
          path: desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
