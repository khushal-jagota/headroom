name: Python Mac runtime
# The Mac still runs the Python Mac runtime. These tests protect it until the
# Mac moves to the TypeScript runtime. Then this workflow goes.
on:
  pull_request:
    branches: [staging]
    paths: ['src/**', 'tests/unit/**', 'requirements.txt', 'pyproject.toml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mac-runtime:
    name: Python Mac runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -e .
      - run: |
          scripts/dev pytest -n 4 $(ls tests/unit/test_executor_*.py tests/unit/test_darwin_*.py tests/unit/test_mac_*.py tests/unit/test_worker_supervision*.py 2>/dev/null)
