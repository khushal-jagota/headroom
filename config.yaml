# Planner configuration — checked-in defaults. Every value here is overridable by
# the matching PLAN_* environment variable. Test-mode keys (PLAN_TEST_MODE,
# PLAN_FAKE_NOW) are environment-only and deliberately absent from this file.

db_path: data/planning.db          # SQLite database location (§13)
port: 8767                         # server port; bind host is fixed at 127.0.0.1 (§2)
boundary_hour: 5                   # planning-day boundary, local hour (R1)
tick_seconds: 60                   # dispatcher tick interval (§7.1)
claim_ttl_seconds: 900             # claim time-to-live, 15 minutes (§7.3)
max_runs: 2                        # max concurrent dispatched runs (R7)
failure_limit: 2                   # consecutive failures before auto-block (§7.5)
dispatch_enabled: true             # dispatcher master switch; re-read every tick (§7.1)
hermes_bin: hermes                 # hermes executable for the spawn adapter (§7.4)
hermes_profile: default            # spawn profile (R3)
worker_skill: planning-worker      # dispatched-agent skill (R3)
ws_poll_ms: 300                    # server-side event-tail poll interval (§9)
ui_debounce_ms: 250                # UI refetch debounce, served via /api/meta (§9)
run_max_seconds: 1800              # per-run max runtime, 30 minutes (§7.3)
boundary_timeout_seconds: 60       # boundary adapter call timeout (§6.2)
title_max_chars: 200               # ticket title length cap (§3.3)
dispatcher_lock_path: data/dispatcher.lock   # advisory single-dispatcher lock (§7.1)
logs_dir: data/logs                # per-run log files (§7.4)
events_read_limit: 500             # max events returned per WS tail batch (§9)
db_busy_timeout_ms: 5000           # SQLite busy timeout on connect
spawn_adapter: auto                # auto | real | fake (§9.4)
boundary_adapter: auto             # auto | real | fake (§9.4)
gateway_adapter: auto              # auto | real | fake | offline (§9.4)
