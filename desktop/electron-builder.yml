appId: com.khushaljagota.panels.desktop
productName: Panels
files:
  - build/**
  - package.json
publish:
  - provider: github
    owner: khushal-jagota
    repo: headroom
mac:
  icon: resources/icon.icns
  # The ZIP and latest-mac.yml serve updates. The DMG serves first installation.
  artifactName: Panels-mac-${arch}.${ext}
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  hardenedRuntime: true
  notarize: true
dmg:
  artifactName: Panels-mac-${arch}.${ext}
  sign: true
  # The signed workflow notarizes and staples the container after packaging.
  # Keep updater metadata about the ZIP only, before the container changes.
  writeUpdateInfo: false
