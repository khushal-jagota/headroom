<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panels</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/server-update.css">
  <script src="/server-update.js" defer></script>
</head>
<body>
  <div class="window-top-row" aria-hidden="true"></div>
  <main class="server-update">
    <div class="update-column">
      <img class="app-icon" src="/static/icon-192.png" alt="">
      <p id="server-address" class="server-address"></p>
      <h1>This server needs an update</h1>
      <p class="lead">This app is newer than the server.</p>
      <div id="status" class="update-state" role="status" aria-live="polite"></div>
    </div>
  </main>
</body>
</html>
