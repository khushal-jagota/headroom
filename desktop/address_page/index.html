<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta name="color-scheme" content="dark" />
    <title>Panels</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11151f; color: #e6e8ee;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(28rem, 90vw); }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #a4abbb; margin: 0 0 1.25rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
      .row { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid #343b4d; background: #181d29;
        color: inherit; font: inherit; }
      button { padding: 0.55rem 1rem; border-radius: 8px; border: 0; background: #4f7cff; color: white; font: inherit;
        font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      #problem { color: #ff8a8a; margin-top: 1rem; }
      a { color: #8fb0ff; display: inline-block; margin-top: 1rem; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to your Panels server</h1>
      <p>A Panels server on this Mac is found by itself. For a server on another machine, enter its address, for example its Tailscale address.</p>
      <form id="address-form">
        <label for="address">Server address</label>
        <div class="row">
          <input id="address" name="address" type="text" placeholder="https://panels.example.ts.net" autocomplete="url" spellcheck="false" required autofocus />
          <button id="connect" type="submit">Connect</button>
        </div>
      </form>
      <p id="problem" role="alert" hidden></p>
      <a id="back" href="panels://app/" hidden>Back to Panels</a>
    </main>
    <script src="address.js"></script>
  </body>
</html>
