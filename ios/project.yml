name: Panels
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
targets:
  Panels:
    type: application
    platform: iOS
    sources: [Panels]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Panels/Panels.entitlements
        APNS_ENVIRONMENT: development
        APNS_REGISTRATION_ENABLED: NO
        INFOPLIST_FILE: Panels/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Panels
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a revision or speak a message when you tap the microphone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into an editable message.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: '1,2'
  PanelsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PanelsTests]
    dependencies:
      - target: Panels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  PanelsNotificationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PanelsNotificationUITests]
    dependencies:
      - target: Panels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios.notification-uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TEST_TARGET_NAME: Panels
schemes:
  Panels:
    build:
      targets:
        Panels: all
    test:
      targets: [PanelsTests]
  PanelsNotifications:
    build:
      targets:
        Panels: all
    test:
      targets: [PanelsTests, PanelsNotificationUITests]
