name: Panels
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
targets:
  Panels:
    type: application
    platform: iOS
    sources: [Panels]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Panels
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a revision for the worker when you tap the microphone.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: '1,2'
  PanelsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PanelsTests]
    dependencies:
      - target: Panels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Panels:
    build:
      targets:
        Panels: all
    test:
      targets: [PanelsTests]
