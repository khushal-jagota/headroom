name: Panels
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    CURRENT_PROJECT_VERSION: 16
    MARKETING_VERSION: '1.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    PANELS_APP_BUNDLE_IDENTIFIER: com.khushaljagota.panels
targets:
  Panels:
    type: application
    platform: iOS
    sources: [Panels, LiveActivity]
    dependencies:
      - target: PanelsLiveActivity
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: true
    settings:
      base:
        DEVELOPMENT_TEAM: FB99BBDJBA
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: 16
        PRODUCT_BUNDLE_IDENTIFIER: $(PANELS_APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Panels/Panels.entitlements
        APNS_ENVIRONMENT: development
        APNS_REGISTRATION_ENABLED: NO
        INFOPLIST_FILE: Panels/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Panels
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio with a video, record a revision, or speak a message when you tap the microphone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into an editable message.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
      configs:
        Release:
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: YES
          APNS_ENVIRONMENT: production
          APNS_REGISTRATION_ENABLED[sdk=iphoneos*]: YES
  PanelsLiveActivity:
    type: app-extension
    platform: iOS
    sources: [PanelsLiveActivity, LiveActivity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PANELS_APP_BUNDLE_IDENTIFIER).LiveActivity
        DEVELOPMENT_TEAM: FB99BBDJBA
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: 16
        INFOPLIST_FILE: PanelsLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: YES
  PanelsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PanelsTests]
    dependencies:
      - target: Panels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  PanelsNotificationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PanelsNotificationUITests, PanelsUITestSupport]
    dependencies:
      - target: Panels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios.notification-uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TEST_TARGET_NAME: Panels
  PanelsReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PanelsReviewUITests, PanelsUITestSupport]
    dependencies:
      - target: Panels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.panels.ios.review-uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TEST_TARGET_NAME: Panels
schemes:
  Panels:
    build:
      targets:
        Panels: all
    test:
      targets: [PanelsTests]
      shouldUseLaunchSchemeArgsEnv: false
      commandLineArguments:
        --conversation-stub: true
        http://127.0.0.1:1: true
  PanelsNotifications:
    build:
      targets:
        Panels: all
    test:
      targets: [PanelsTests, PanelsNotificationUITests]
  PanelsReview:
    build:
      targets:
        Panels: all
    test:
      targets: [PanelsReviewUITests]
