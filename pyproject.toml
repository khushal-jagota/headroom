[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "2.0.0"
description = "Planning system v2 — database-backed personal planning server and agent CLI."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "click",
  "httpx",
  "pydantic",
  "PyYAML",
]

[project.scripts]
plan = "planner.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planner = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The schema DDL is a single SQL string; its column definitions run past 100 cols.
"src/planner/core/db.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
